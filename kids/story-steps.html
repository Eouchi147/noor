<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="description" content="Story Steps: put six prophet stories in order, moment by moment. A NOOR Little Codex game."/>
<meta name="theme-color" content="#14100A"/>
<title>Story Steps · NOOR Little Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--parchment:#FFFEF7;--ink:#2C2416;--gold:#C9A227;--gold-hi:#E9C86A;--lapis:#1E3A8A;--deep:#14100A;--acc:#34d399;--spr:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--deep);color:var(--parchment);min-height:100svh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px;border-radius:12px}
::selection{background:rgba(201,162,39,.35)}
.amiri{font-family:Amiri,serif}

/* night sky */
.sky{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#0d1b45 0%,#16295f 45%,#1E3A8A 74%,#2d4fb3 130%)}
.sky::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;background:radial-gradient(130% 110% at 50% 128%,rgba(76,110,215,.5),transparent 70%)}
.tw{position:absolute;display:block;border-radius:50%;background:#FFF9E3;opacity:.25;animation:twk var(--td,4s) ease-in-out var(--tl,0s) infinite alternate}
@keyframes twk{from{opacity:.1;transform:scale(.7)}to{opacity:.9;transform:scale(1.2)}}

/* header + footer */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px;max-width:600px;margin:0 auto}
.backlink{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 15px;border-radius:999px;border:1px solid rgba(233,200,106,.4);background:rgba(20,16,10,.4);color:var(--gold-hi);font-weight:700;font-size:13px;text-decoration:none;transition:background .25s,transform .25s}
.backlink:hover{background:rgba(233,200,106,.16);transform:translateY(-1px)}
.gtitle{text-align:right;font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:800;color:var(--gold-hi)}
.dn{display:block;margin-top:4px;font-size:10px;letter-spacing:.08em;font-weight:700;color:#9BE8C5}
footer{display:flex;justify-content:center;align-items:center;gap:9px;padding:20px 12px 34px;font-size:12.5px}
footer a{color:var(--gold-hi);text-decoration:none;font-weight:700}
footer a:hover{text-decoration:underline}
footer .dot{opacity:.5}
.reset{font-size:11px;color:rgba(255,254,247,.55);text-decoration:underline;min-height:24px}

/* crescent + story trail */
.deco{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px auto 12px;max-width:560px}
.cres{width:36px;filter:drop-shadow(0 0 12px rgba(233,200,106,.45))}
.trail{position:relative;display:flex;gap:13px;align-items:center;padding:4px 2px}
.trail::before{content:"";position:absolute;left:4px;right:4px;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(233,200,106,.6),transparent)}
.gem{position:relative;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(233,200,106,.65);background:rgba(255,253,244,.12);display:grid;place-items:center;transition:background .35s,border-color .35s,transform .35s}
.gem.on{background:linear-gradient(180deg,#7CE7BC,#34d399);border-color:#34d399;box-shadow:0 0 8px rgba(52,211,153,.55)}
.gem.st::after{content:"✦";font-size:8px;color:#0E5A3C;line-height:1}
.gem.cur{animation:gpulse 2.6s ease-in-out infinite}
@keyframes gpulse{50%{transform:scale(1.3)}}

/* stage */
main{width:100%;max-width:560px;margin:0 auto;padding:0 12px}
.stage{position:relative;background:#FFFDF4;color:var(--ink);border:3px solid var(--gold);border-radius:22px;padding:16px 14px 18px;box-shadow:0 12px 34px rgba(0,0,0,.45);animation:srise .5s ease both}
.stage::before{content:"";position:absolute;inset:4px;border:1px solid #D9BC66;border-radius:16px;pointer-events:none}
@keyframes srise{from{opacity:0;transform:translateY(12px)}}
.lvlhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative}
.lvlno{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#A9821C}
.pname{font-family:Amiri,serif;font-weight:700;font-size:29px;line-height:1.1;margin:2px 0 0}
.saw{font-size:.86em;color:#8F6F14}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #E3CE8E;background:#FBF4DE;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;color:#8F6F14;transition:border-color .3s,color .3s,background .3s}
.chip.hot{border-color:var(--acc);color:#0E7A50;background:#EDFBF4}
.chip.bump{animation:bump .38s var(--spr)}
@keyframes bump{45%{transform:scale(1.22)}}
.hint{min-height:19px;margin:8px 2px 10px;font-size:13px;font-weight:600;color:rgba(44,36,22,.66)}

/* the illuminated strip */
.strip{position:relative;display:flex;align-items:center;gap:6px;padding:9px 7px;border-radius:15px;border:1.5px solid #D9BC66;background:linear-gradient(180deg,#FBF3DA,#F3E7C4);overflow:hidden;transition:box-shadow .5s}
.strip::before,.strip::after{content:"✦";flex:0 0 auto;font-size:10px;color:#CDAE55;padding:0 1px}
.strip.swept{box-shadow:0 0 0 2px rgba(233,200,106,.55),0 0 18px rgba(233,200,106,.5)}
.slot{position:relative;flex:1 1 0;max-width:64px;aspect-ratio:1;border:2px dashed #D3B45C;border-radius:13px;background:var(--parchment);transition:border-color .3s,background .3s}
.slot .num{position:absolute;top:1px;left:6px;font-family:Amiri,serif;font-weight:700;font-size:13px;color:#B08A1E;z-index:1}
.slot .sic{position:absolute;inset:0;display:grid;place-items:center}
.slot .sic svg{width:78%;height:78%}
.slot.fl{border:2px solid var(--acc);background:#F2FBF6}
.slot.fl .num{color:#0E7A50}
.slot.fl::after{content:"";position:absolute;inset:-4px;border-radius:15px;box-shadow:0 0 12px rgba(52,211,153,.5),0 0 20px rgba(233,200,106,.35);opacity:.75;pointer-events:none}
.slot.pop,.slot.cele{animation:pop .55s var(--spr)}
@keyframes pop{0%{transform:scale(.5)}62%{transform:scale(1.13)}100%{transform:scale(1)}}
.ring{position:absolute;inset:-5px;border:2.5px solid var(--acc);border-radius:16px;opacity:.9;animation:rng .55s ease-out forwards;pointer-events:none}
@keyframes rng{to{transform:scale(1.5);opacity:0}}
.p1{position:absolute;left:50%;top:-6px;transform:translate(-50%,4px);font-weight:800;font-size:13px;color:#B08A1E;animation:rise .85s ease-out forwards;pointer-events:none;z-index:2}
@keyframes rise{0%{transform:translate(-50%,6px);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-24px);opacity:0}}
.shine{position:absolute;top:0;bottom:0;left:0;width:46%;background:linear-gradient(105deg,transparent,rgba(233,200,106,.7) 50%,transparent);transform:translateX(-130%);pointer-events:none}
.swept .shine{animation:sweep .9s ease .05s forwards}
@keyframes sweep{to{transform:translateX(330%)}}

/* meter */
.mtrack{height:7px;background:#EADFC2;border-radius:99px;margin:10px 3px 0;overflow:hidden}
.mfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold-hi));border-radius:99px;transform-origin:0 50%;transform:scaleX(0);transition:transform .5s cubic-bezier(.22,1,.36,1)}

/* moment cards */
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px}
.card{position:relative;flex:0 1 31.6%;min-width:88px;min-height:110px;background:var(--parchment);border:2px solid #E3CE8E;border-radius:16px;padding:9px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 #E7D9AC;transition:transform .18s var(--spr),opacity .45s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.card:active{transform:scale(.93) rotate(-1deg)}
.card .ic svg{width:48px;height:48px;display:block}
.card .lb{font-size:11.5px;line-height:1.28;font-weight:700;color:var(--ink);text-align:center}
.card.cin{animation:cin .5s var(--spr) both}
@keyframes cin{from{opacity:0;transform:translateY(12px) scale(.85)}}
.card.used{opacity:0;pointer-events:none;box-shadow:none}
.card.shk{animation:shk .45s ease}
@keyframes shk{15%{transform:translateX(-5px) rotate(-2deg)}35%{transform:translateX(5px) rotate(2deg)}55%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.nope{position:absolute;left:50%;top:-13px;transform:translateX(-50%);background:#FBF4DE;border:1.5px solid #E3CE8E;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;color:#8F6F14;white-space:nowrap;animation:nrise .9s ease forwards;pointer-events:none;z-index:3}
@keyframes nrise{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}

/* moral panel */
.moral{margin-top:16px;text-align:center;animation:cin .5s var(--spr) both}
.mstar{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8F6F14}
.mstar svg{width:58px;height:58px;animation:pop .6s var(--spr)}
.mline{font-family:Amiri,serif;font-size:21px;line-height:1.4;margin:2px 8px 14px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 28px;border-radius:999px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);font-weight:800;font-size:16px;border:2px solid #B08A1E;box-shadow:0 4px 0 #8F6F14,0 10px 20px rgba(0,0,0,.25);text-decoration:none;transition:transform .18s var(--spr),box-shadow .18s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8F6F14}
.btn2{background:rgba(20,16,10,.35);color:var(--gold-hi);border-color:rgba(233,200,106,.55);box-shadow:0 4px 0 rgba(0,0,0,.35)}

/* flash messages */
#flash{position:fixed;left:50%;top:22%;z-index:65;pointer-events:none}
.fmsg{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:23px;color:var(--gold-hi);text-shadow:0 2px 0 rgba(20,16,10,.85),0 0 18px rgba(233,200,106,.65);animation:fpop 1.2s ease forwards}
@keyframes fpop{0%{opacity:0;transform:translateX(-50%) scale(.4)}16%{opacity:1;transform:translateX(-50%) scale(1.12)}30%{transform:translateX(-50%) scale(1)}72%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-16px)}}

/* win screen */
.win{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px 16px;overflow:auto;background:radial-gradient(120% 100% at 50% 18%,rgba(13,27,69,.9),rgba(5,8,24,.97))}
.rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(233,200,106,.15) 0deg 9deg,transparent 9deg 24deg);border-radius:50%;animation:spin 26s linear infinite;-webkit-mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.5) 45%,transparent 72%);mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.5) 45%,transparent 72%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.wcard{position:relative;z-index:2;background:#FFFDF4;color:var(--ink);border:3px solid var(--gold);border-radius:24px;padding:26px 20px 24px;max-width:430px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.55);animation:wpop .6s var(--spr) both}
.wcard::before{content:"";position:absolute;inset:5px;border:1px solid #D9BC66;border-radius:18px;pointer-events:none}
@keyframes wpop{from{opacity:0;transform:scale(.7)}}
.wmoon{font-size:30px;color:var(--gold);line-height:1}
.wtop{font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:800;color:#A9821C;margin-top:6px}
.wcount{font-family:Amiri,serif;font-weight:700;font-size:19px;color:#8F6F14;margin-top:10px}
.wcount b{font-size:46px;line-height:1;color:var(--gold);display:inline-block;min-width:58px}
.wcount b.pk{animation:bump .4s var(--spr)}
.wline{font-family:Amiri,serif;font-size:22px;line-height:1.42;margin:12px 4px 14px}
.wstars{display:flex;gap:7px;justify-content:center;margin-bottom:10px}
.wstars span{display:block;width:30px;height:30px;animation:pop .55s var(--spr) both}
.wstars span.off{opacity:.2;filter:grayscale(1)}
.wstars svg{width:100%;height:100%}
.wsub{font-size:13px;font-weight:600;color:rgba(44,36,22,.72);margin:0 6px 16px}
.wbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fw{position:absolute;top:-20px;z-index:1;border-radius:50%;animation:fall .95s ease-in forwards;pointer-events:none}
.fw.dm,.pt.dm{border-radius:1px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
@keyframes fall{from{opacity:1}to{transform:translate(var(--fx,0px),560px) rotate(230deg);opacity:0}}

/* ghost flight + particles */
.ghost{position:fixed;z-index:70;pointer-events:none;transition:transform .5s cubic-bezier(.3,.75,.25,1.07);will-change:transform;filter:drop-shadow(0 4px 8px rgba(20,16,10,.3))}
.ghost svg{width:100%;height:100%;display:block}
#pLayer{position:fixed;inset:0;pointer-events:none;z-index:80}
.pt{position:fixed;border-radius:50%;animation:ptf .85s cubic-bezier(.16,.84,.44,1) forwards}
@keyframes ptf{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(var(--rz,0deg));opacity:0}}

@media(max-width:349px){
 .card .ic svg{width:42px;height:42px}
 .card{min-width:82px}
 .pname{font-size:25px}
 .strip{gap:5px}
}
@media(min-width:900px){
 main{padding:0}
 .stage{padding:20px 20px 22px}
}
@media(prefers-reduced-motion:reduce){
 .tw,.rays,.gem.cur,.shine{animation:none!important}
 .stage,.card.cin,.moral,.wcard{animation:fadein .3s ease both!important}
 .slot.pop,.slot.cele,.wstars span,.mstar svg,.chip.bump{animation:none!important}
 @keyframes fadein{from{opacity:0}}
}
</style>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
var SLUG="nk-story-steps";

/* palette for icons */
var X={g:"#C9A227",h:"#E9C86A",l:"#1E3A8A",b:"#4A6FD4",n:"#16204A",s:"#5C6A9C",a:"#34d399",e:"#1F8A5D",t:"#7CE7BC",d:"#EED9A4",d2:"#DFC280",w:"#8A5A24",k:"#2C2416",p:"#FFFDF4"};
function q(v){return Math.round(v*10)/10}
function sp(x,y,s,c){var m=q(s*.42);return '<path d="M'+x+' '+q(y-s)+'L'+q(x+m)+' '+q(y-m)+'L'+q(x+s)+' '+y+'L'+q(x+m)+' '+q(y+m)+'L'+x+' '+q(y+s)+'L'+q(x-m)+' '+q(y+m)+'L'+q(x-s)+' '+y+'L'+q(x-m)+' '+q(y-m)+'Z" fill="'+c+'"/>'}
function ht(x,y,s,c,st){return '<path d="M0 4.6C-4.4 1 -6.4 -2.6 -4.4 -5.2 -2.8 -7.2 0 -6.2 0 -3.6 0 -6.2 2.8 -7.2 4.4 -5.2 6.4 -2.6 4.4 1 0 4.6Z" transform="translate('+x+' '+y+') scale('+s+')" fill="'+c+'"'+(st?' stroke="'+st+'" stroke-width="'+q(1.7/s)+'" stroke-linejoin="round"':'')+'/>'}
function cr(x,y,s,c,rot,mir){var k=q(s/9*100)/100;return '<g transform="translate('+x+' '+y+')'+(mir?' scale(-1 1)':'')+(rot?' rotate('+rot+')':'')+' scale('+k+') translate(-12 -12)"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="'+c+'"/></g>'}
function paw(x,y,s,c){return '<g fill="'+c+'" transform="translate('+x+' '+y+') scale('+s+')"><ellipse cx="0" cy="1.3" rx="2.4" ry="2"/><circle cx="-2.2" cy="-1.6" r="1"/><circle cx="0" cy="-2.3" r="1"/><circle cx="2.2" cy="-1.6" r="1"/></g>'}
function kb(x,y,s){return '<g transform="translate('+x+' '+y+') scale('+s+')"><rect x="-9" y="-9" width="18" height="18" rx="1.5" fill="'+X.k+'"/><rect x="-9" y="-3.9" width="18" height="3.2" fill="'+X.h+'"/><rect x="2" y="3.2" width="4" height="5.8" rx="1" fill="'+X.g+'"/></g>'}
function wh(x,b){var o='<path d="M'+x+' '+b+'v-9" stroke="'+X.e+'" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="'+x+'" cy="'+q(b-10.2)+'" rx="1.5" ry="2.2" fill="'+X.g+'"/>',i,y;for(i=0;i<3;i++){y=q(b-2.8-i*2.9);o+='<ellipse cx="'+q(x-2)+'" cy="'+y+'" rx="1.4" ry="2.2" fill="'+X.h+'" transform="rotate(-34 '+q(x-2)+' '+y+')"/><ellipse cx="'+q(x+2)+'" cy="'+y+'" rx="1.4" ry="2.2" fill="'+X.h+'" transform="rotate(34 '+q(x+2)+' '+y+')"/>'}return o}
function sv(b){return '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#F3E9CD"/>'+b+'</svg>'}
var STAR='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#F3E9CD" stroke="#C9A227" stroke-width="2"/><path d="M24 8.5l4.7 9.6 10.6 1.5-7.7 7.5 1.8 10.5L24 32.6l-9.4 5 1.8-10.5-7.7-7.5 10.6-1.5z" fill="#E9C86A" stroke="#C9A227" stroke-width="1.8" stroke-linejoin="round"/></svg>';

/* 30 moment icons, level by level */

{n:"Ibrahim",m:["Breaks the idols with an axe","The fire turns cool and safe","Raises the Kaaba with Ismail","Prays for a caring nation","Millions still answer his call"],mo:"One brave heart can light the whole world."},
{n:"Yusuf",m:["Dreams of eleven stars","Thrown into the dark well","From prison to the palace","Explains the king's dream","His family bows: dream comes true"],mo:"Allah's plan is longer than any bad day."},
{n:"Musa",m:["A basket floats on the Nile","The burning bush speaks","Stands before Pharaoh","The sea splits in two","Tablets on the mountain"],mo:"Allah can open a road through the sea."},
{n:"Muhammad",sw:1,m:["Iqra in the cave of Hira","Inviting Makkah with patience","The hijrah journey","Brotherhood in Madinah","Returning to Makkah in mercy"],mo:"Mercy wins the longest race."}
];
var GOOD=["Yes! Then what happens?","Beautiful! Keep going.","That is the one!","Right on the mark!"];
var WRNG=["Not yet! What happens first?","Almost! An earlier moment comes first.","Hmm, look for the moment before it."];

/* storage */
function load(){try{var v=JSON.parse(localStorage.getItem(SLUG));if(v&&typeof v==="object")return v}catch(e){}return null}
function save(){try{localStorage.setItem(SLUG,JSON.stringify(store))}catch(e){}}
var store=load()||{};
if(!Array.isArray(store.levels)||store.levels.length!==6)store.levels=[false,false,false,false,false,false];
store.done=store.done===true;store.stars=typeof store.stars==="number"?store.stars:0;

/* shared rAF loop */
var tasks=[],rafId=0;
function tick(t){var i,keep=[];for(i=0;i<tasks.length;i++){if(tasks[i](t)!==false)keep.push(tasks[i])}tasks=keep;if(tasks.length){rafId=requestAnimationFrame(tick)}else{rafId=0}}
function addTask(f){tasks.push(f);if(!rafId)rafId=requestAnimationFrame(tick)}

/* refs */
var lvlNo=$("lvlNo"),pName=$("pName"),chip=$("chip"),streakN=$("streakN"),hint=$("hint"),strip=$("strip"),mfill=$("mfill"),cardsEl=$("cards"),moralBox=$("moralBox"),mStar=$("mStar"),mLine=$("mLine"),nextBtn=$("nextBtn"),trail=$("trail"),win=$("win"),wStars=$("wStars"),wSub=$("wSub"),cnt=$("cnt"),doneNote=$("doneNote"),pLayer=$("pLayer"),flashEl=$("flash");

/* twinkle stars */
(function(){if(RM)return;var h="",i,s;for(i=0;i<35;i++){s=(Math.random()*1.8+1.2).toFixed(1);h+='<i class="tw" style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*88).toFixed(1)+'%;width:'+s+'px;height:'+s+'px;--td:'+(Math.random()*3+2.6).toFixed(1)+'s;--tl:'+(Math.random()*4).toFixed(1)+'s"></i>'}$("sky").innerHTML=h})();

/* particles */
var ptc=0;
function burst(x,y,cols,n){if(RM)return;n=Math.min(n,40-ptc);var i,d,s,a,v;for(i=0;i<n;i++){d=document.createElement("i");s=4+Math.random()*6;a=Math.random()*6.283;v=26+Math.random()*58;d.className="pt"+(Math.random()<.45?" dm":"");d.style.cssText="left:"+q(x-s/2)+"px;top:"+q(y-s/2)+"px;width:"+q(s)+"px;height:"+q(s)+"px;background:"+cols[i%cols.length]+";--dx:"+q(Math.cos(a)*v)+"px;--dy:"+q(Math.sin(a)*v-34)+"px;--rz:"+((Math.random()*220-110)|0)+"deg";pLayer.appendChild(d);ptc++;setTimeout(function(el){return function(){el.remove();ptc--}}(d),900)}}
function shower(){if(RM)return;var k;for(k=0;k<2;k++){setTimeout(function(){var i,d,s,cols=["#E9C86A","#C9A227","#34d399","#FFF9E3"];for(i=0;i<16;i++){if(ptc>=40)break;d=document.createElement("i");s=5+Math.random()*6;d.className="fw"+(Math.random()<.5?" dm":"");d.style.cssText="left:"+((Math.random()*100)|0)+"%;width:"+q(s)+"px;height:"+q(s)+"px;background:"+cols[i%4]+";--fx:"+((Math.random()*60-30)|0)+"px;animation-delay:"+((Math.random()*250)|0)+"ms";win.appendChild(d);ptc++;setTimeout(function(el){return function(){el.remove();ptc--}}(d),1200)}},k*650)}}
function flash(msg){var s=document.createElement("span");s.className="fmsg";s.textContent=msg;flashEl.appendChild(s);setTimeout(function(){s.remove()},1250)}
function nope(card){var s=document.createElement("span");s.className="nope";s.textContent="not yet!";card.appendChild(s);setTimeout(function(){s.remove()},950)}
function plus1(slot){var s=document.createElement("span");s.className="p1";s.textContent="+1";slot.appendChild(s);setTimeout(function(){s.remove()},900)}
function ringAt(slot){if(RM)return;var r=document.createElement("i");r.className="ring";slot.appendChild(r);setTimeout(function(){r.remove()},600)}

/* game state */
var L=0,next=0,lock=false,streak=0,missMoment=false,missLevel=0,runStars=0,gi=0,wi=0,slots=[];

function shuf(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.random()*(i+1)|0;t=a[i];a[i]=a[j];a[j]=t}return a}
function chipUp(){streakN.textContent=streak;chip.classList.toggle("hot",streak>0);chip.classList.remove("bump");void chip.offsetWidth;chip.classList.add("bump")}
function buildTrail(){var h="",i;for(i=0;i<6;i++)h+='<span class="gem'+(store.levels[i]?" on":"")+'"></span>';trail.innerHTML=h}
function trailMark(){var g=trail.children,i;for(i=0;i<6;i++)g[i].classList.toggle("cur",i===L)}
function trailDone(i,st){var g=trail.children[i];g.classList.add("on");if(st)g.classList.add("st");g.classList.remove("cur")}
function updateDone(){doneNote.hidden=!store.done}

function startLevel(i){
L=i;next=0;missMoment=false;missLevel=0;
lvlNo.textContent="Story "+(i+1)+" of 6";
pName.innerHTML=LV[i].n+(LV[i].sw?' <span class="saw" lang="ar">ﷺ</span>':"");
hint.textContent="Tap the moment that comes next.";
var sh="",k;for(k=0;k<5;k++)sh+='<div class="slot"><span class="num">'+(k+1)+'</span><span class="sic"></span></div>';
strip.classList.remove("swept");strip.innerHTML=sh+'<div class="shine"></div>';
slots=[].slice.call(strip.querySelectorAll(".slot"));
mfill.style.transform="scaleX(0)";
var ord=[0,1,2,3,4];do{shuf(ord)}while(ord[0]===0&&ord[1]===1&&ord[2]===2&&ord[3]===3&&ord[4]===4);
cardsEl.hidden=false;
cardsEl.innerHTML=ord.map(function(mi,k){return '<button type="button" class="card cin" style="animation-delay:'+k*60+'ms" data-mi="'+mi+'" aria-label="'+LV[i].m[mi]+'"><span class="ic">'+ICONS[i][mi]+'</span><span class="lb">'+LV[i].m[mi]+"</span></button>"}).join("");
[].slice.call(cardsEl.children).forEach(function(b){b.addEventListener("click",onCard)});
moralBox.hidden=true;
trailMark();lock=false;
}

function fly(icEl,slot,svg,cb){
if(RM){cb();return}
var r=icEl.getBoundingClientRect(),t=slot.getBoundingClientRect();
if(!r.width||!t.width){cb();return}
var g=document.createElement("div");g.className="ghost";g.innerHTML=svg;
g.style.cssText="left:"+q(r.left)+"px;top:"+q(r.top)+"px;width:"+q(r.width)+"px;height:"+q(r.height)+"px";
document.body.appendChild(g);
var dx=q(t.left+t.width/2-(r.left+r.width/2)),dy=q(t.top+t.height/2-(r.top+r.height/2)),sc=q((t.width*.74)/r.width*100)/100;
addTask(function(){g.style.transform="translate("+dx+"px,"+dy+"px) scale("+sc+") rotate(8deg)";return false});
var fin=false;function end(){if(fin)return;fin=true;g.remove();cb()}
g.addEventListener("transitionend",end);setTimeout(end,620);
}

function onCard(e){
var b=e.currentTarget;if(lock||b.disabled)return;
var mi=+b.getAttribute("data-mi");
if(mi!==next){
missLevel++;missMoment=true;streak=0;chipUp();
b.classList.remove("shk");void b.offsetWidth;b.classList.add("shk");
nope(b);hint.textContent=WRNG[wi++%WRNG.length];
return;
}
lock=true;b.disabled=true;
var slot=slots[mi];
fly(b.querySelector(".ic"),slot,ICONS[L][mi],function(){landSlot(slot,mi)});
b.classList.add("used");
}

function landSlot(slot,mi){
slot.querySelector(".sic").innerHTML=ICONS[L][mi];
slot.classList.add("fl","pop");setTimeout(function(){slot.classList.remove("pop")},560);
ringAt(slot);plus1(slot);
var r=slot.getBoundingClientRect();
burst(r.left+r.width/2,r.top+r.height/2,["#E9C86A","#C9A227","#34d399","#FFF9E3"],10);
if(missMoment){streak=0}else{streak++}
missMoment=false;chipUp();
if(streak===3||(streak>=5&&streak%5===0))flash("✦ "+streak+" in a row!");
next++;mfill.style.transform="scaleX("+next/5+")";
if(next<5){hint.textContent=GOOD[gi++%GOOD.length];lock=false}
else{hint.textContent="Story complete!";setTimeout(levelDone,420)}
}

function levelDone(){
strip.classList.add("swept");
slots.forEach(function(s,k){s.style.animationDelay=k*70+"ms";s.classList.add("cele")});
var perfect=missLevel===0;
if(perfect){runStars++;setTimeout(function(){flash("Perfect Storyteller! ✦")},520)}
store.levels[L]=true;if(runStars>store.stars)store.stars=runStars;save();
trailDone(L,perfect);
var rr=strip.getBoundingClientRect();
setTimeout(function(){burst(rr.left+rr.width*.5,rr.top+rr.height*.5,["#E9C86A","#C9A227","#FFF9E3"],12)},420);
setTimeout(function(){
cardsEl.hidden=true;
mStar.hidden=!perfect;
if(perfect)mStar.innerHTML=STAR+"<span>Perfect Storyteller!</span>";
mLine.textContent=LV[L].mo;
nextBtn.textContent=L<5?"Next story ✦":"The big ending ✦";
moralBox.hidden=false;
try{nextBtn.focus({preventScroll:true})}catch(e){}
},950);
}

nextBtn.addEventListener("click",function(){if(L<5){startLevel(L+1)}else{showWin()}});

function rollCount(){
if(RM){cnt.textContent="30";return}
cnt.textContent="0";var st=0;
addTask(function(t){
if(!st)st=t;
var p=Math.min(1,(t-st)/1100),ez=1-Math.pow(1-p,3),v=Math.round(ez*30);
if(cnt.textContent!==""+v){cnt.textContent=""+v;if(v===10||v===20||v===30){cnt.classList.remove("pk");void cnt.offsetWidth;cnt.classList.add("pk")}}
return p<1?true:false;
});
}

function showWin(){
lock=true;
win.hidden=false;
store.done=true;if(runStars>store.stars)store.stars=runStars;save();updateDone();
var h="",k;for(k=0;k<6;k++)h+='<span class="ws'+(k<runStars?"":" off")+'" style="animation-delay:'+(200+k*90)+'ms">'+STAR+"</span>";
wStars.innerHTML=h;
wSub.textContent=runStars===6?"Every single page, first try!":(runStars>0?"You earned "+runStars+" Perfect Storyteller "+(runStars===1?"star":"stars")+"! Best so far: "+store.stars+".":"The stories are told! Play again to earn Perfect Storyteller stars. Best so far: "+store.stars+".");
rollCount();shower();
try{$("againBtn").focus({preventScroll:true})}catch(e){}
}

$("againBtn").addEventListener("click",function(){
win.hidden=true;runStars=0;streak=0;chipUp();buildTrail();startLevel(0);
});
$("reset").addEventListener("click",function(){
try{localStorage.removeItem(SLUG)}catch(e){}
location.reload();
});

buildTrail();updateDone();startLevel(0);
})();
</script>
</body>
</html>
