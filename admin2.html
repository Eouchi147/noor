<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>The Console · NOOR</title>
<meta name="theme-color" content="#0B0D16"/>
<link rel="icon" type="image/svg+xml" href="/assets/brand/mark.svg"/>
<link rel="apple-touch-icon" href="/assets/brand/mark-180.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,300&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ===========================================================================
   THE CONSOLE, SECOND HOUSE

   Four surfaces instead of twelve tabs. The phone gets a bar at the bottom
   where the thumb is; the desk gets a rail on the left. Nothing is fetched
   until its surface is opened, and a surface opened again within a minute is
   instant. Anything irreversible (the ladder) asks from a sheet first; a
   slot in flight is drawn as "Sending…" through every redraw so nothing can
   be pressed twice; a 401 brings the gate back rather than printing guesses
   as facts; the Lantern is never probed on load, only from its Test button.
   It talks to the same endpoints as /admin, which stays exactly as it was.

   The palette is the reel's: ink, a panel a shade lighter, one gold, and a
   cream for the words that matter. Green means went, red means did not, gold
   means the machine is still on it.
   =========================================================================== */
:root{
  --ink:#0B0D16;--panel:#11131F;--panel2:#161A2A;--line:#242B41;--line2:#2E3752;
  --gold:#E9C86A;--gold-dim:#8D7736;--cream:#FFF9E3;
  --text:#DCE3F2;--muted:#94A2C0;--faint:#66738F;
  --good:#8ED49B;--bad:#F08A8A;--wait:#E9C86A;--blue:#7E9BD1;
  --f-disp:'Spectral',Georgia,serif;--f-body:'Inter',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bar:64px;--rail:0px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{background:var(--ink);color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
a{color:var(--gold);text-decoration:none}
code{font-family:var(--f-mono);font-size:.86em;color:var(--gold);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
[hidden]{display:none!important}

/* ---- the gate ---- */
#gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .card{width:min(100%,380px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
#gate .mark{width:44px;height:44px;border-radius:50%;background:#1a1608;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:22px;margin:0 0 16px}
#gate h1{font-family:var(--f-disp);font-weight:500;font-size:24px;color:var(--cream);margin:0 0 6px}
#gate p{color:var(--muted);font-size:14px;margin:0 0 18px}
#gate input{width:100%;font:inherit;font-size:16px;background:var(--ink);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin:0 0 10px}
#gate .go{width:100%;background:var(--gold);color:#1a1608;font-weight:700;border-radius:10px;padding:13px;font-size:15px}
#gate .err{color:var(--bad);font-size:13px;min-height:1.2em;margin:10px 0 0}
#gate .old{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--faint)}

/* ---- the shell ---- */
#app{display:none;min-height:100svh}
#app.on{display:block}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,13,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:12px}
header.top .mark{width:30px;height:30px;border-radius:50%;background:#1a1608;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:16px;flex:0 0 auto}
header.top h1{font-family:var(--f-disp);font-weight:500;font-size:20px;color:var(--cream);margin:0;flex:1;letter-spacing:-.01em}
header.top .when{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}
header.top .rf{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
header.top .rf svg{width:16px;height:16px}
header.top .rf.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:16px 16px calc(var(--bar) + var(--sab) + 24px);max-width:760px;margin:0 auto}
.surf{display:none}.surf.on{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.surf.on{animation:none}}

/* the bar, and the rail it becomes on a desk */
/* the columns are counted from the buttons that are there, so a fifth
   surface can join the four without a rule being edited */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--bar) + var(--sab));padding-bottom:var(--sab);
  background:rgba(17,19,31,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.bar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;position:relative;min-height:44px}
nav.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bar button.on{color:var(--gold)}
nav.bar button .dot{position:absolute;top:10px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
@media(min-width:900px){
  :root{--bar:0px;--rail:216px}
  nav.bar{top:0;bottom:0;left:0;right:auto;width:var(--rail);height:auto;padding:24px 12px;border-top:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:4px;align-items:stretch;justify-content:flex-start}
  nav.bar::before{content:"NOOR";font-family:var(--f-disp);font-size:18px;color:var(--gold);letter-spacing:.2em;padding:6px 14px 18px}
  nav.bar button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;border-radius:10px;font-size:13px;letter-spacing:.04em;text-transform:none}
  nav.bar button.on{background:rgba(233,200,106,.1)}
  nav.bar button .dot{position:static;margin-left:auto;border:0}
  header.top,main{margin-left:var(--rail)}
  header.top{padding-left:28px;padding-right:28px}
  main{padding:24px 28px 60px;max-width:calc(760px + var(--rail))}
}

/* ---- the pieces ---- */
.sec{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);margin:26px 0 10px}
.sec:first-child{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.card.tap{cursor:pointer;transition:border-color .15s}
.card.tap:active{border-color:var(--line2)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero .n{font-family:var(--f-disp);font-size:52px;font-weight:600;line-height:1;color:var(--cream);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding-bottom:8px}
.hero .d{font-family:var(--f-mono);font-size:12px;padding-bottom:9px}
.hero .d.up{color:var(--good)}.hero .d.dn{color:var(--bad)}
.strip{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.strip .s{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:52px;padding:8px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.strip .s b{font-size:11px;color:var(--text);font-weight:600}
.strip .s span{font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.strip .s i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.strip .s.sent i{background:var(--good)}.strip .s.partial i,.strip .s.failed i,.strip .s.due i{background:var(--bad)}
.strip .s.pending i{background:var(--wait)}.strip .s.queued i{background:var(--blue)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.row.tap{cursor:pointer}.row.tap:active{border-color:var(--line2)}
.row .ic{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--gold)}
.row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .t{flex:1;min-width:0}
.row .t>b{display:block;color:var(--cream);font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t>span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex:0 0 auto;text-align:right}
.row .chev{color:var(--faint);flex:0 0 auto}
.row .acts2{display:flex;gap:6px;flex:0 0 auto}
.row.hold .t.tap{cursor:pointer}
@media(max-width:560px){.row.hold{flex-wrap:wrap}.row.hold .acts2{flex:1 0 100%;padding-left:46px}.row.hold .acts2 .btn{flex:1}}
.fold summary .pill{max-width:46%;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;border-radius:100px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:#2b4a37}.pill.bad{color:var(--bad);border-color:#4a2b2b}.pill.wait{color:var(--wait);border-color:#4a3f1f}.pill.blue{color:var(--blue);border-color:#2b3a5c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:13.5px;background:var(--gold);color:#1a1608}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--text)}
.btn.danger{background:none;border:1px solid #4a2b2b;color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{min-height:34px;padding:0 12px;font-size:12.5px;border-radius:8px}
.chan{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;min-height:30px;padding:0 11px;border-radius:100px;border:1px solid transparent}
.chan.ok{color:var(--good)}.chan.pending{color:var(--wait)}.chan.wait{color:var(--faint);border-color:var(--line)}
.chan.bad{color:var(--bad);border-color:rgba(240,138,138,.35);cursor:pointer}
.chan.bad:active{background:rgba(240,138,138,.12)}
.chan.more{color:var(--blue);border-color:rgba(126,155,209,.35);cursor:pointer;background:none}
.chan.more:active{background:rgba(126,155,209,.12)}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.slot .h{display:flex;align-items:baseline;gap:10px}
.slot .h code{font-size:11px;background:none;border:0;color:var(--gold);padding:0}
.slot .h b{color:var(--cream);font-weight:600;font-size:14.5px;flex:1;min-width:0}
.slot .h .pill{margin-left:auto}
.slot .b{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .b .spacer{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{padding:10px 6px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--gold);box-shadow:0 1px 0 var(--line)}
.bar2{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:6px 0 2px}
.bar2 i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar2 i.low{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.reel{border-radius:10px;overflow:hidden;background:#05060f;aspect-ratio:9/16;position:relative;cursor:pointer;border:1px solid var(--line)}
.reel img{width:100%;height:100%;object-fit:cover;display:block}
.reel b{position:absolute;left:8px;right:8px;bottom:8px;font-size:11px;line-height:1.3;color:var(--cream);text-shadow:0 1px 4px #000;font-weight:600}
details.fold{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:0 0 12px}
details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;color:var(--cream);font-weight:600;font-size:14.5px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--gold);font-size:12px;transition:transform .18s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary .pill{margin-left:auto}
details.fold>.in{padding:0 16px 16px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.stat{grid-template-columns:repeat(4,1fr)}}
.stat .c{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .c .v{font-family:var(--f-disp);font-size:26px;font-weight:600;color:var(--cream);line-height:1.1;font-variant-numeric:tabular-nums}
.stat .c .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:4px}
.stat .c .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
svg.chart{width:100%;height:150px;display:block}
.bars .b{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.bars .b .n{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .b .t{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bars .b .t i{display:block;height:100%;background:var(--gold);border-radius:3px;width:0;transition:width .5s ease}
.bars .b .v{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right}
.msg{overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px;color:var(--text);line-height:1.6}
.link{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);margin:0 0 8px}
.link b{color:var(--cream);font-weight:600;display:block;font-size:14px}
.link span{color:var(--muted);font-size:12.5px;display:block}
.link .chev{margin-left:auto;color:var(--faint)}
.sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;min-height:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{color:var(--faint);font-size:13.5px;padding:8px 2px}

/* ---- the rooms: House is the hub, each room is a surface of its own ---- */
.back{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px 0 10px;border-radius:100px;
  border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600}
.back:active{border-color:var(--line2);color:var(--text)}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.rooms{grid-template-columns:repeat(3,1fr)}}
.rooms .card{margin:0;display:flex;flex-direction:column;gap:3px;min-height:112px;text-align:left;width:100%}
.rooms .card b{color:var(--cream);font-weight:600;font-size:14px}
.rooms .card .w{color:var(--faint);font-size:11.5px;line-height:1.35}
.rooms .card .v{font-family:var(--f-disp);font-size:23px;font-weight:600;color:var(--cream);line-height:1.1;margin-top:auto;font-variant-numeric:tabular-nums}
.ttl{font-family:var(--f-disp);font-weight:500;font-size:19px;color:var(--cream);letter-spacing:-.01em;margin:8px 0 0}
.fi{width:100%;font:inherit;font-size:16px;background:var(--ink);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.fi::placeholder{color:var(--faint)}
textarea.fi{font-size:14px;line-height:1.65;resize:vertical}
select.fi{-webkit-appearance:none;appearance:none}
.frm{display:grid;gap:8px}
@media(min-width:560px){.frm.two{grid-template-columns:1fr 1fr}.frm.two .full{grid-column:1/-1}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts .btn{flex:1 1 auto}
@media(min-width:560px){.acts .btn{flex:0 0 auto}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv>b{color:var(--muted);font-weight:600;white-space:nowrap}
.kv>span{color:var(--text);min-width:0;overflow-wrap:anywhere}
.mon{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:76px;margin:12px 0 0}
.mon i{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.mon i u{display:block;background:var(--line2);border-radius:2px 2px 0 0}
.mon i.has u{background:var(--gold-dim)}
.mon i.now u{background:var(--gold)}
.mon i b{font-size:9px;font-weight:600;color:var(--faint);text-align:center}
.tog{cursor:pointer;min-height:30px;display:inline-flex;align-items:center}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46svh;overflow:auto;margin-bottom:10px}
.bub{border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line)}
.bub.me{background:var(--panel2);align-self:flex-end;max-width:88%}
.bub.it{background:var(--ink);color:var(--text)}
.bub.warn{border-color:#4a2b2b;color:var(--bad)}
.dif{display:grid;gap:6px;margin-top:10px;font-size:13.5px;overflow-wrap:anywhere}
.dif .was{color:var(--bad);text-decoration:line-through}
.dif .now{color:var(--good)}
.seg.two{grid-template-columns:repeat(2,1fr)}

/* ---- the dials: one row a switch, and a bar that counts what is unsaved ----
   The row is the whole sentence: what the dial is, what it does, where its
   value comes from, and the control itself. On a phone the control drops
   under the words rather than squeezing them, which is why the row wraps. */
.dial{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin:0 0 8px}
.dial.dirty{border-color:var(--gold-dim)}
.dial .dt{flex:1 1 210px;min-width:0}
.dial .dt>b{display:block;color:var(--cream);font-weight:600;font-size:14.5px}
.dial .dh{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:3px}
.dial .tags{margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.dial .src{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}
.dial .src.chg{color:var(--gold)}
.dial .why{color:var(--bad);font-size:12.5px;line-height:1.5;margin-top:7px}
.dial .dc{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:8px;max-width:100%}
.dial .dc .seg{min-width:180px;max-width:100%}
/* the 16px stays: anything smaller and a phone zooms the page on focus */
.dial input.fi{padding:8px 10px}
.dial input.numi{width:110px;text-align:center;font-family:var(--f-mono)}
.dial input.txti{width:min(260px,62vw)}
/* a switch that is a button, so the tab key reaches it and a reader is told
   what state it is in rather than what colour it is */
.sw{width:50px;height:29px;border-radius:100px;border:1px solid var(--line2);background:var(--panel2);position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--faint);
  transition:transform .16s ease,background .16s ease}
.sw[aria-checked="true"]{background:rgba(233,200,106,.2);border-color:var(--gold-dim)}
.sw[aria-checked="true"]::after{transform:translateX(21px);background:var(--gold)}
@media(prefers-reduced-motion:reduce){.sw::after{transition:none}}
.savebar{position:sticky;bottom:calc(var(--bar) + var(--sab) + 10px);z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--panel2);border:1px solid var(--gold-dim);border-radius:12px;padding:10px 12px;margin:16px 0 0}
.savebar .n{font-size:13.5px;font-weight:600;color:var(--cream)}
.savebar .sp{color:var(--faint)}
@media(min-width:900px){.savebar{bottom:16px}}

/* ---- Today's reels: five cards, one thumb ----
   The cover is small and the button is big, because the point of the room
   is the Share button. The caption sits folded under the hook so a card is
   one screen tall on a phone; Copy is beside it for the target that drops
   the text (most of them do when a file is attached). */
.rl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.rl .top{display:flex;gap:12px;align-items:flex-start}
.rl .cv{flex:0 0 72px;width:72px;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:#05060f;border:1px solid var(--line)}
.rl .cv img{width:100%;height:100%;object-fit:cover;display:block}
.rl .tx{flex:1;min-width:0}
.rl .tx .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rl .tx b{display:block;font-family:var(--f-disp);font-weight:500;font-size:17px;line-height:1.35;color:var(--cream);margin-top:4px;overflow-wrap:anywhere}
.rl .tx .st{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rl details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.rl details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-height:36px}
.rl details>summary::-webkit-details-marker{display:none}
.rl details>summary::before{content:"▸";color:var(--gold);font-size:12px;transition:transform .18s}
.rl details[open]>summary::before{transform:rotate(90deg)}
.rl details>summary .btn{margin-left:auto}
.rl .cap{margin-top:8px;font-size:13.5px}
.rl .share{width:100%;min-height:52px;font-size:15.5px;margin-top:12px;border-radius:12px}
.rl .share[disabled]{opacity:.75}
.rl .hint{color:var(--faint);font-size:12px;line-height:1.5;margin:8px 0 0;text-align:center}
.rl .hand{color:var(--good);font-family:var(--f-mono);font-size:10.5px}

/* ---- sheets: every action is one ---- */
#veil{position:fixed;inset:0;background:rgba(5,6,15,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding:8px 18px calc(18px + var(--sab));max-height:88svh;overflow:auto;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
#sheet:not(.on){visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s}
#sheet.on{transform:none;visibility:visible}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 14px}
#sheet h2{font-family:var(--f-disp);font-weight:500;font-size:20px;color:var(--cream);margin:0 0 4px}
#sheet .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
#sheet .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#sheet .acts .btn{flex:1 1 auto}
@media(min-width:900px){#sheet{left:calc(var(--rail) + 50% - 300px);right:auto;width:600px;bottom:24px;border-radius:18px;border-bottom:1px solid var(--line);transform:translateY(20px);opacity:0;pointer-events:none}
  #sheet.on{transform:none;opacity:1;pointer-events:auto}}
#toast{position:fixed;left:50%;bottom:calc(var(--bar) + var(--sab) + 16px);transform:translate(-50%,10px);z-index:50;background:var(--cream);color:#1a1608;
  font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#F08A8A}
@media(min-width:900px){#toast{left:calc(var(--rail) + 50%);bottom:24px}}
.diag{font-size:13.5px}.diag .said{margin:0 0 10px;padding:8px 12px;border-left:2px solid rgba(240,138,138,.5);background:rgba(240,138,138,.07);font-style:italic;color:var(--text)}
.diag ul{margin:4px 0 12px;padding-left:18px}.diag li{margin:3px 0}.diag .ok{color:var(--good)}.diag .no{color:var(--bad)}
.diag h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);margin:12px 0 4px}

/* ---- the steward: what the house says before anything is asked of it ----
   One card at the top of Today. The paragraph is the Lantern's when the
   Lantern answered and the house's own template when it did not, and the
   small mono label says which, because the two must never look the same. */
.stw{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.stw .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.stw .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim)}
.stw .rd{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}
.stw .hd .btn{margin-left:auto}
.stw p.say{margin:0;font-family:var(--f-disp);font-size:17px;line-height:1.55;color:var(--cream);font-weight:500}
.fnd{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.fnd .f{display:flex;gap:11px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.fnd .f>i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:6px;background:var(--faint)}
.fnd .f.act>i{background:var(--bad)}
.fnd .f.watch>i{background:var(--wait)}
.fnd .f.good>i{background:var(--good)}
.fnd .f .x{flex:1;min-width:0}
.fnd .f b{display:block;color:var(--cream);font-weight:600;font-size:14px;line-height:1.35}
.fnd .f span.sy{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.fnd .f .go{margin-top:10px}
.fnd details.q{border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.fnd details.q>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;align-items:center;gap:11px;color:var(--muted);font-size:13px;min-height:44px}
.fnd details.q>summary::-webkit-details-marker{display:none}
.fnd details.q>summary::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--good);flex:0 0 auto}
.fnd details.q>summary::after{content:"▸";color:var(--gold-dim);font-size:11px;margin-left:auto;transition:transform .18s}
.fnd details.q[open]>summary::after{transform:rotate(90deg)}
.fnd details.q>.in{padding:0 13px 11px;display:flex;flex-direction:column;gap:8px}
.fnd details.q .f{background:var(--panel)}

/* ---- the flow: one map of where the energy goes ----
   The drawing is magnitude and never status, so not one of the good, bad or
   waiting tones is used in it: the widths carry the size, gold marks the
   heaviest step and the travelling dots, and everything else is a line. */
.map{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;margin:0 0 12px}
svg.flow{width:100%;height:auto;display:block}
svg.flow .node{cursor:pointer}
svg.flow .nb{fill:var(--panel2);stroke:var(--line2);stroke-width:1}
svg.flow .node:hover .nb,svg.flow .node:focus-visible .nb{stroke:var(--gold-dim)}
svg.flow .node:focus-visible{outline:none}
/* an unread node is drawn hollow but is still a thing a thumb can hit, so its
   ground is transparent rather than absent */
svg.flow .node.unread .nb{fill:transparent;stroke:var(--line2);stroke-dasharray:4 4}
svg.flow .nl{fill:var(--muted);font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.02em}
svg.flow .nv{fill:var(--cream);font-family:var(--f-disp);font-weight:600;font-variant-numeric:tabular-nums}
svg.flow .nu{fill:var(--faint);font-family:var(--f-mono);font-size:9px;letter-spacing:.04em}
svg.flow .node.unread .nv{fill:var(--faint);font-family:var(--f-mono);font-size:12px;font-weight:400}
svg.flow .ed{fill:none;stroke:var(--line2);stroke-linecap:round}
svg.flow .ed.big{stroke:var(--gold);opacity:.72}
svg.flow .ed.none{stroke:var(--line2);stroke-width:1.5;stroke-dasharray:3 5;opacity:.85}
svg.flow .rt{fill:var(--muted);font-family:var(--f-mono);font-size:10px;letter-spacing:.01em}
svg.flow .rtb{fill:var(--panel);stroke:var(--line);stroke-width:.6}
svg.flow .pulse{fill:var(--gold)}
.notes{margin:2px 0 0}
.notes p{color:var(--faint);font-size:12.5px;line-height:1.55;margin:0 0 6px}
.flowbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.flowbar .seg{flex:1;min-width:0}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="mark">ن</div>
    <h1>The console</h1>
    <p>One key exists. This house holds the readers, the gifts, the guardians and the money.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"/>
    <button class="go" id="enter">Unlock</button>
    <p class="err" id="err"></p>
    <a class="old" href="/admin">Open the full console instead →</a>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="mark">ن</div>
    <h1 id="title">Today</h1>
    <span class="when" id="when"></span>
    <button class="rf" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
  </header>

  <main>
    <section class="surf on" id="s-today"></section>
    <!-- Today's reels: the five reel slots as cards a thumb can share from -->
    <section class="surf" id="s-reels"></section>
    <section class="surf" id="s-posts"></section>
    <section class="surf" id="s-readers"></section>
    <section class="surf" id="s-house"></section>
    <section class="surf" id="s-flow"></section>
    <!-- The seven rooms. They are surfaces exactly like the five above, but
         they are reached from House rather than from the bar, so the bar
         keeps its five buttons. -->
    <section class="surf" id="s-lights"></section>
    <section class="surf" id="s-legacy"></section>
    <section class="surf" id="s-marketing"></section>
    <section class="surf" id="s-journal"></section>
    <section class="surf" id="s-night"></section>
    <section class="surf" id="s-system"></section>
    <section class="surf" id="s-controls"></section>
  </main>

  <nav class="bar" aria-label="Surfaces">
    <button data-s="reels"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Reels<i class="dot" id="dot-reels" hidden></i></button>
    <button data-s="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today<i class="dot" id="dot-today" hidden></i></button>
    <button data-s="posts"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Posts<i class="dot" id="dot-posts" hidden></i></button>
    <button data-s="readers"><svg viewBox="0 0 24 24"><path d="M3 20l5-8 4 5 3-3 6 6"/><circle cx="17" cy="6" r="2"/></svg>Readers<i class="dot" id="dot-readers" hidden></i></button>
    <button data-s="house"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>House<i class="dot" id="dot-house" hidden></i></button>
    <button data-s="flow"><svg viewBox="0 0 24 24"><circle cx="4.5" cy="6" r="2"/><circle cx="4.5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/><path d="M6.6 7.1C10 9 12.6 10.5 16.9 11.7M6.6 16.9C10 15 12.6 13.5 16.9 12.3"/></svg>Flow<i class="dot" id="dot-flow" hidden></i></button>
  </nav>
</div>

<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div id="sheet-in"></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- the small kit ---------- */
var $=function(id){return document.getElementById(id)};
/* a reel's file: the manifest row's own URL once the shelf is on the store, else the file on the site */
var reelUrl=function(c,what){var u=c&&c[what];if(typeof u==="string"&&/^https:\/\//.test(u))return u;return "/reels/"+(c&&c.id||"")+(what==="cover"?"-cover.jpg":".mp4")};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var relock=function(){$("app").classList.remove("on");$("gate").hidden=false;$("err").textContent="The key has expired. Enter it again.";$("enter").disabled=false};
var answer=function(r){if(r.status===401){relock();return{ok:false,status:401,j:{},locked:true}}return r.json().catch(function(){return null}).then(function(j){return{ok:r.ok,status:r.status,j:j}})};
var get=function(u){return fetch(u,{credentials:"same-origin",cache:"no-store"}).then(answer)};
var post=function(u,b){return fetch(u,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(answer).then(function(r){r.j=r.j||{};return r})};
/* the corrections store is the one place the house is asked to forget
   something, and it listens for DELETE, so the kit knows a third verb */
var del=function(u,b){return fetch(u,{method:"DELETE",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(answer).then(function(r){r.j=r.j||{};return r})};
/* every action ends here when the network is gone: the button comes back and the owner is told */
var unreachable=function(b,was){return function(){if(b){b.disabled=false;if(was!=null)b.textContent=was}closeSheet();toast("Could not reach the house.",true)}};
var toastT=null;
function toast(msg,bad){var t=$("toast");t.textContent=msg;t.className="on"+(bad?" bad":"");clearTimeout(toastT);toastT=setTimeout(function(){t.className=""},2600)}
function sheet(html){$("sheet-in").innerHTML=html;$("veil").classList.add("on");$("sheet").classList.add("on");document.body.style.overflow="hidden"}
function closeSheet(){$("veil").classList.remove("on");$("sheet").classList.remove("on");document.body.style.overflow=""}
$("veil").addEventListener("click",closeSheet);
$("sheet-in").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.id==="cl")return closeSheet();
  if(b.dataset.retry){var q=b.dataset.retry.split("|");closeSheet();var row=document.querySelector('#slot-'+q[0]+' [data-retry="'+b.dataset.retry+'"]');return retryChan(q[0],q[1],row||b)}
  var rel=b.dataset.rel||b.dataset.rm;if(rel){var p=rel.split("|");b.disabled=true;post("/api/journal",{action:"comment-state",id:p[0],cid:p[1],state:b.dataset.rel?"approve":"reject"}).then(function(r){closeSheet();toast(r.ok?(b.dataset.rel?"Released.":"Removed."):"It refused.",!r.ok);C.held=null;drawReaders(true)})}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
var ICO={
  post:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  pen:'<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  reddit:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16V8M8.5 11.5L12 8l3.5 3.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 7"/></svg>',
  ring:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>',
  lamp:'<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1.3-1 2.5H9c0-1.2-.3-1.9-1-2.5A6 6 0 0 1 12 3z"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>'
};
var SLOT_WHAT={dawn:"What today is in the Islamic year",reelA:"A reel · morning",lead:"What is coming",reelC:"A reel · noon",light:"The day's card",reelD:"A reel · afternoon",word:"One of 523 words",reelB:"A reel · evening",dusk:"One of 71 chapters of the Path",reelE:"A reel · night"};
var CHIP={sent:["good","sent"],partial:["bad","half sent"],failed:["bad","failed"],due:["bad","owed"],pending:["wait","finishing"],queued:["blue","waiting for you"],skipped:["","nothing to say"]};
function chip(state,at){var c=CHIP[state];return c?'<span class="pill '+c[0]+'">'+c[1]+'</span>':'<span class="pill">'+String(at).padStart(2,"0")+':00</span>'}
function ago(iso){if(!iso)return"";var s=(Date.now()-Date.parse(iso))/1000;if(s<90)return"just now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" d ago"}
function clock(){var d=new Date();$("when").textContent=d.toUTCString().slice(17,22)+" UTC"}
setInterval(clock,30000);

/* ---------- the cache: a surface opened again within a minute is instant ---------- */
var C={};var TTL=60000;
function cached(key,fn,force){var c=C[key];if(!force&&c&&Date.now()-c.at<TTL)return Promise.resolve(c.v);return fn().then(function(v){C[key]={at:Date.now(),v:v};return v})}
/* A network that is not open yet (Pinterest on Trial until its review) is a
   stage, not a fault. A slot whose only unanswered network is one of those
   reads as sent, with the network marked waiting, so the day is not covered
   in "half sent" for something nobody can act on. */
var WAITING={};
function settle(t){WAITING={};var slots=(t&&t.slots)||[];
  /* first pass: which networks are waiting anywhere today */
  slots.forEach(function(s){var r=s.results||{};Object.keys(r).forEach(function(k){if(r[k]&&(r[k].trial||r[k].waiting))WAITING[k]=1})});
  /* second pass: a failure on a waiting network is the same wait in another
     voice (a pin cut by the clock, a card set aside for drift), so it reads as
     waiting too, and a slot whose only unanswered networks are waiting is sent */
  slots.forEach(function(s){var r=s.results||{};var bad=Object.keys(r).filter(function(k){return k!=="reddit"&&r[k]&&!r[k].ok&&!r[k].pending&&!r[k].skipped});
    bad.forEach(function(k){if(WAITING[k]&&!(r[k].trial||r[k].waiting))r[k].waiting=true});
    var waiting=bad.filter(function(k){return r[k].trial||r[k].waiting});
    if(s.state==="partial"&&bad.length&&waiting.length===bad.length){s.state="sent";s.waiting=waiting}});return t}
var today=function(f){return cached("today",function(){return get("/api/social?action=today").then(function(r){return settle(r.j)})},f)};
var visitors=function(f){return cached("visitors",function(){return get("/api/visitors").then(function(r){return r.j})},f)};
var dialsQ=function(f){return cached("dials",function(){return get("/api/social?action=dials").then(function(r){return r.j})},f)};
var tokens=function(f){return cached("tokens",function(){return get("/api/social?action=tokens").then(function(r){return r.j})},f)};
var reddit=function(f){return cached("reddit",function(){return get("/api/social?action=reddit").then(function(r){return r.j})},f)};
var logQ=function(f){return cached("log",function(){return get("/api/social?action=log").then(function(r){return r.j})},f)};
var reelsQ=function(f){return cached("reels",function(){return get("/reels/index.json").then(function(r){return r.j})},f)};
var inbox=function(f){return cached("inbox",function(){return get("/api/inbox?limit=60").then(function(r){return r.j})},f)};
var held=function(f){return cached("held",function(){return post("/api/journal",{action:"queue"}).then(function(r){return r.j})},f)};
var house=function(f){return cached("house",function(){return get("/api/admin-data").then(function(r){return r.j})},f)};
var lantern=function(f){return cached("lantern",function(){return get("/api/admin-data?probe=lantern").then(function(r){return r.j})},f)};
var insights=function(f){return cached("insights",function(){return get("/api/insights?days=14").then(function(r){return r.j})},f)};
/* the six rooms read these, and House reads them too so each room's card on
   the hub can carry one live number instead of a promise of one */
var nightQ=function(f){return cached("night",function(){return get("/api/admin-data?probe=night").then(function(r){return r.j})},f)};
var journalQ=function(f){return cached("journal",function(){return get("/api/journal").then(function(r){return r.j})},f)};
var ovrQ=function(f){return cached("ovr",function(){return get("/api/overrides").then(function(r){return r.j})},f)};
/* every dial the house has, with its default and where its value comes from.
   The public read of this route carries only what a reader may see; all=1 is
   the owner's and is the one the Controls room draws from. */
var settingsQ=function(f){return cached("settings",function(){return get("/api/settings?all=1").then(function(r){return r.j})},f)};
var LIGHT_DAY="";

/* ================= TODAY'S REELS =================
   The five reel slots of the day, read from /api/social?action=today (the
   plan with each reel slot's card named), each a card with its cover, its
   hook, its caption behind a fold with Copy, and one big Share.

   SHARE, ON A PHONE. The file is fetched from /api/reel?id= (same origin,
   video/mp4, streamed) as a Blob, wrapped as a File named <id>.mp4, and
   handed to navigator.share with the caption as text. Two things about it
   are not obvious and both are deliberate:
     - the caption goes on the clipboard at the tap, before anything else,
       because most targets (TikTok, WhatsApp, X) drop `text` when a file
       is attached, and the owner pastes it;
     - the share sheet may only open inside a user gesture, and a 30 MB
       verse over a phone's network can outlast one. So the file is fetched
       once and kept in memory; the share is tried straight after, and if
       the browser refuses it for the gesture having passed, the button
       reads "Share now" and the second tap shares at once.
   On a desk, or where files cannot be shared, the file is downloaded and
   the caption copied, which is the same hand-off by other means.
   After a share that closed cleanly, the console tells the house
   (action=shared) so the slot shows what went out by hand. */
var REEL_FILES={};                /* id -> File, for the life of the page */
var REEL_BUSY={};
function reelDate(t){return (t&&t.date)||new Date().toISOString().slice(0,10)}

    +'<div class="tx"><div class="k"><span>'+String(s.at).padStart(2,"0")+':00</span><span>'+esc(kind)+'</span>'+(r.secs?'<span>'+esc(r.secs)+' s</span>':'')+'</div>'

function drawReels(force){

function copyText(text,b){

function canShareFiles(file){try{return !!(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(x){return false}}
function shareReel(s,b,date){
  var r=s.reel,id=r.id,slot=s.id;
  if(REEL_BUSY[id])return;
  /* the caption first, inside the tap, for the target that drops the text */
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(r.caption||"").catch(function(){})}catch(x){}
  var was=b.textContent;
  var noted=function(){return post("/api/social",{action:"shared",date:date,slot:slot,where:"phone"}).then(function(res){
    var good=res.ok&&res.j&&res.j.ok!==false;toast(good?"Shared. Noted on the record.":"Shared, but the house could not note it.",!good);
    bust();LOADED.reels=true;DRAWN.reels=Date.now();drawReels(true)},function(){toast("Shared, but the house could not be reached to note it.",true)})};
  var handOff=function(file){
    if(canShareFiles(file)){
      return navigator.share({files:[file],text:r.caption||"",title:r.hook||""}).then(noted,function(err){
        b.disabled=false;
        if(err&&err.name==="AbortError"){b.textContent="Share now";toast("Nothing was shared.");return}
        /* the gesture ran out while the file was fetched: the next tap shares at once */
        if(err&&(err.name==="NotAllowedError"||err.name==="InvalidStateError")){b.textContent="Share now";toast("The file is ready. Tap Share now.");return}
        saveFile(file,id+".mp4");b.textContent="Share";toast("The share sheet refused; the file was saved instead and the caption copied.")});

    if(res.status===401){relock();throw new Error("locked")}
    if(!res.ok)throw new Error("the reel could not be fetched ("+res.status+")");
    var total=+res.headers.get("content-length")||0;

    return step();
  }).then(function(blob){
    var file=new File([blob],id+".mp4",{type:"video/mp4"});
    REEL_FILES[id]=file;delete REEL_BUSY[id];
    b.textContent="Sharing…";
    return handOff(file);
  }).then(function(){b.disabled=false;if(b.textContent==="Sharing…")b.textContent="Share now"}).catch(function(e){
    delete REEL_BUSY[id];b.disabled=false;b.textContent=was;
    if(e&&e.message==="locked")return;
    toast((e&&e.message)||"Could not fetch the reel.",true)});
}

/* ---------------------------------------------------------------------------
   THE STEWARD

   One card, and it invents nothing. The paragraph is the server's; the
   findings are the server's, act first, then watch, then good folded into one
   quiet line; and an action exists only where the server sent one, performing
   exactly what it says. A kind of "post" is posted to the route it names with
   the body it carries; a kind of "open" is a link and nothing else.
--------------------------------------------------------------------------- */
var LEVEL_ORDER={act:0,watch:1,good:2};
function stewardFindings(sw){
  var f=(sw&&sw.findings)||[];
  if(!Array.isArray(f))return[];
  return f.slice().sort(function(a,b){return (LEVEL_ORDER[a.level]==null?3:LEVEL_ORDER[a.level])-(LEVEL_ORDER[b.level]==null?3:LEVEL_ORDER[b.level])});
}
/* every slot the steward already speaks for, so the old list says it once */
function stewardCovers(sw){
  var covered={};
  if(!sw||!sw.ok)return covered;
  stewardFindings(sw).forEach(function(f){
    var ev=(f&&f.evidence)||{};
    if(Array.isArray(ev.slots))ev.slots.forEach(function(s){if(s)covered[String(s)]=1});
    if(f.id==="reddit-drafts")covered.reddit=1;
  });
  return covered;
}
/* THE SERVER SAYS WHAT AN ACTION IS, AND THE CONSOLE STILL CHECKS ITS SHAPE.
   A finding is JSON arriving over a route, and this room was posting to
   whatever route it named and rendering whatever href it carried. One wrong
   answer -- a bug upstream, an answer from somewhere else, a store that had
   been written into -- and that is a javascript: URL in a link the owner taps,
   or a POST at a door in another house carrying whatever body came with it.
   So the two are held to a shape before either is drawn: a route is /api/<name>
   with an ordinary query on it and nothing else, and an href is a route of this
   house, a room of this console, or an https address on this very origin.
   Anything else draws no button and says so in the finding, because a button
   quietly missing is a worse lie than a sentence explaining its absence. */
var ROUTE_SHAPE=/^\/api\/[a-z-]+(\?[\w=&%.-]*)?$/;
var HREF_SHAPE=/^\/(api\/|admin2#)[\w?=&#.-]*$/;
function sameOrigin(h){try{var u=new URL(h,location.href);return u.protocol==="https:"&&u.host===location.host}catch(e){return false}}
function actionOk(a){
  if(!a||!a.label)return false;
  if(a.kind==="open")return !!a.href&&(HREF_SHAPE.test(a.href)||(/^https:\/\//.test(a.href)&&sameOrigin(a.href)));
  if(a.kind==="post")return !!a.route&&ROUTE_SHAPE.test(a.route);
  return false;
}
function actionBtn(f,i){
  var a=f&&f.action;if(!a||!a.label)return"";
  if(!actionOk(a))return '<span class="sy">This finding carried an action the console did not recognise, so nothing is offered for it here.</span>';
  if(a.kind==="open")
    return '<a class="btn ghost sm go" href="'+esc(a.href)+'" target="_blank" rel="noopener" data-sopen="'+i+'">'+esc(a.label)+'</a>';
  return '<button class="btn sm go" data-sact="'+i+'">'+esc(a.label)+'</button>';
}
function findingRow(f,i){
  var lvl=LEVEL_ORDER[f.level]==null?"":f.level;
  return '<div class="f '+esc(lvl)+'"><i></i><div class="x"><b>'+esc(f.title||"")+'</b><span class="sy">'+esc(f.say||"")+'</span>'+actionBtn(f,i)+'</div></div>';
}
function stewardCard(sw){
  if(!sw)return"";
  if(sw.ok===false||sw.enabled===false)
    return '<div class="stw"><div class="hd"><span class="lab">The steward</span></div><p class="say" style="font-size:15px;font-family:var(--f-body);color:var(--muted)">'+esc(sw.error||"The house could not be read in one call just now.")+'</p></div>';
  var all=stewardFindings(sw);
  var loud=[],quiet=[];
  all.forEach(function(f,i){(f.level==="good"?quiet:loud).push({f:f,i:i})});
  var para=sw.paragraph||sw.say||"";
  var read=ago(sw.at);
  return '<div class="stw">'
    +'<div class="hd"><span class="lab">'+(sw.lantern?"The Lantern":"From the record")+'</span>'
    +(read?'<span class="rd">read '+esc(read)+'</span>':'')
    +'<button class="btn ghost sm" id="stw-again">Read again</button></div>'
    +(para?'<p class="say">'+esc(para)+'</p>':'<p class="say" style="font-size:15px;font-family:var(--f-body);color:var(--muted)">The house has nothing to say about today.</p>')
    +'<div class="fnd">'
    +loud.map(function(x){return findingRow(x.f,x.i)}).join("")
    +(quiet.length?'<details class="q"><summary>'+quiet.length+' thing'+(quiet.length===1?" is":"s are")+' as they should be</summary><div class="in">'+quiet.map(function(x){return findingRow(x.f,x.i)}).join("")+'</div></details>':"")
    +'</div></div>';
}
/* Read again asks the house for the answer once more, past its ten minutes */
function wireSteward(el,sw){
  var b=el.querySelector("#stw-again");if(!b)return;
  b.onclick=function(){var was=b.textContent;b.disabled=true;b.textContent="Reading…";
    stewardAgain().then(function(){b.disabled=false;b.textContent=was;LOADED.today=true;DRAWN.today=Date.now();drawToday(false)})
      .catch(function(){b.disabled=false;b.textContent=was;toast("Could not reach the house.",true)})};
}
/* an action does exactly what the server said and nothing more */
function stewardClick(e,el,sw){
  var b=e.target.closest&&e.target.closest("[data-sact]");
  if(!b)return !!(e.target.closest&&e.target.closest("[data-sopen],#stw-again"));
  var f=stewardFindings(sw)[+b.dataset.sact];
  /* the same shape check again on the way out, so that a redraw between the
     drawing of a button and the tap on it cannot post to a route this room
     would not have drawn a button for */
  var a=f&&f.action;if(!a||a.kind!=="post"||!actionOk(a))return true;
  var k="steward:"+(f.id||b.dataset.sact);
  if(INFLIGHT[k])return true;
  var was=b.textContent;b.disabled=true;b.textContent="Working…";INFLIGHT[k]=1;
  post(a.route,a.body||{}).then(function(r){delete INFLIGHT[k];
    var good=r.ok&&(!r.j||r.j.ok!==false);
    if(!good){b.disabled=false;b.textContent=was;toast((r.j&&(r.j.error||r.j.why))||"It refused.",true);return}
    /* the finisher answers with what it did, slot by slot; a container still
       processing is not "done", and the toast must not say it is */
    var ran=(r.j&&r.j.ran)||[];var still=ran.filter(function(x){return x.state==="pending"}).length;var fin=ran.filter(function(x){return x.finished}).length;
    var said=(r.j&&r.j.note)||(ran.length?(fin?fin+" published":"")+(fin&&still?", ":"")+(still?still+" still processing at the network; the next hour looks again":""):"")||(a.label+" · done.");
    toast(said,!!still&&!fin);
    bust();stewardAgain().catch(function(){}).then(function(){LOADED.today=true;DRAWN.today=Date.now();drawToday(false)});
  }).catch(function(){delete INFLIGHT[k];unreachable(b,was)()});
  return true;
}

/* ================= POSTS ================= */
var RUNGS=[["off","Off","Nothing is ever sent on a schedule."],["approve","Approve","Every post is written and waits for you."],["auto","Auto","The whole day goes out by itself."]];
function drawPosts(force){
  var el=$("s-posts");
  if(!el.dataset.built){el.innerHTML='<p class="sec">The ladder</p><div class="card"><div class="sk" style="height:44px"></div></div><p class="sec">Today, hour by hour</p>'+skel(4);el.dataset.built="1"}
  return Promise.all([today(force),dialsQ(force),tokens(force),reddit(force),reelsQ(force),logQ(force)]).then(function(a){
    var t=a[0]||{},d=a[1]||{},tk=(a[2]&&a[2].tokens)||{},rd=a[3]||{},re=a[4]||{},lg=a[5]||{};
    var mode=(d.dials&&d.dials.mode)||"off";
    var slots=t.slots||[];
    var old=t.legacy;if(old&&old.state==="sent")slots.forEach(function(s){if(s.id==="light"&&(!s.state||s.state==="due"||s.state==="waiting")){s.state="sent";s.legacy=true}});
    var hijri=t.plan&&t.plan.hijri?t.plan.hijri.d+" "+t.plan.hijri.name+" "+t.plan.hijri.y:"";
    /* a network that joined after a post went out (Pinterest, YouTube) is
       offered on the sent rows, so the day need not wait for tomorrow */
    var LIVE=((d.channels)||[]).filter(function(c){return c.live&&!c.draftOnly});
    var rows=slots.map(function(s){
      var r=s.results||{};var broke=[];
      var isReel=/^reel/.test(s.id);
      /* a card that went as stories only (social.cardsFeed off) has two
         surfaces and no others to offer */
      var storyOnly=Object.keys(r).some(function(k){return r[k]&&r[k].storyOnly});
      var more=(s.state==="sent"||s.state==="partial")?LIVE.filter(function(c){return !r[c.id]&&(isReel||!(c.spec&&c.spec.video==="required"))&&(!storyOnly||c.id==="facebook"||c.id==="instagram")&&!INFLIGHT[s.id+"|"+c.id]}).map(function(c){return '<button class="chan more" data-retry="'+esc(s.id)+'|'+esc(c.id)+'" title="'+esc(c.id)+' was not live when this went out; send it there too">+ '+esc(c.id)+'</button>'}).join(""):"";
      var where=Object.keys(r).filter(function(k){return k!=="reddit"}).map(function(k){var x=r[k]||{};
        /* the owner's own hand (the Reels room's Share) is a note, drawn as one */
        if(k==="phone")return '<span class="chan ok" title="shared from the phone '+esc(ago(x.at))+'">by hand ✓</span>';
        /* a story-only card: the story IS the post, and the chip says so */
        if(x.storyOnly&&x.ok)return '<span class="chan ok" title="went as a story only">'+esc(k)+' story</span>';
        if(x.ok)return '<span class="chan ok" title="'+(x.story?(x.story.ok?'and a story':(x.story.pending?'story still processing':'story: '+esc(x.story.error||x.story.skipped||'refused'))):'')+'">'+esc(k)+(x.story?(x.story.ok?' +story':(x.story.pending?' +story …':'')):'')+'</span>';
        if(x.pending)return '<span class="chan pending">'+esc(k)+' …</span>';
        if(x.trial||x.waiting)return '<span class="chan wait" title="'+esc(x.err||x.error||'not open yet')+'">'+esc(k)+' · waiting</span>';
        if(INFLIGHT[s.id+"|"+k])return '<button class="chan bad" disabled>'+esc(k)+' …</button>';
        broke.push(k);return '<button class="chan bad" data-retry="'+esc(s.id)+'|'+esc(k)+'" title="'+(x.storyOnly?"send the story again":"send this one again")+'">'+esc(k)+(x.storyOnly?' story':'')+' ↻</button>'}).join("")+more;
      var owed=(s.state==="due"||s.state==="failed")&&!INFLIGHT[s.id];
      var acts='<button class="btn ghost sm" data-prev="'+esc(s.id)+'">Preview</button>'
        +(INFLIGHT[s.id]?'<button class="btn sm" disabled>Sending…</button>':'')
        +(owed?'<button class="btn sm" data-send="'+esc(s.id)+'">Post now</button>':'')
        +(s.state==="pending"?'<button class="btn sm" data-finish="1">Finish it</button>':'')
        +(broke.length?'<button class="btn sm" data-fix="'+esc(s.id)+'|'+esc(broke[0])+'">Fix it</button><button class="btn ghost sm" data-why="'+esc(s.id)+'|'+esc(broke[0])+'">What\'s wrong?</button>':'')
        +(s.state==="queued"&&!INFLIGHT[s.id]?'<button class="btn sm" data-send="'+esc(s.id)+'">Post</button>':'');
      return '<div class="slot" id="slot-'+esc(s.id)+'"><div class="h"><code>'+String(s.at).padStart(2,"0")+':00</code><b>'+esc(s.id)+(s.title?' · <span style="font-weight:500;color:var(--text)">'+esc(s.title)+'</span>':'')+'</b>'+chip(s.state,s.at)+'</div>'
        +'<div class="muted small" style="margin-top:2px">'+esc(SLOT_WHAT[s.id]||"")+'</div>'
        +'<div class="b">'+where+'<span class="spacer"></span>'+acts+'</div></div>'});
    var cards=(re&&re.cards)||[];
    var fbL=tk.fb&&tk.fb.daysLeft!=null?tk.fb.daysLeft:null,igL=tk.ig&&tk.ig.daysLeft!=null?tk.ig.daysLeft:null,life=tk.lifeDays||60;
    var tokbar=function(lab,left){return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b style="color:var(--cream)">'+lab+'</b><span class="muted">'+(left==null?"never marked renewed":left+" of "+life+" days left")+'</span></div><div class="bar2"><i class="'+(left!=null&&left<7?"low":"")+'" style="width:'+(left==null?0:Math.max(0,Math.min(100,left/life*100)))+'%"></i></div></div>'};
    var heldR=(rd.held||[]);
    el.innerHTML=
      '<p class="sec">The ladder</p><div class="card"><div class="seg" id="seg">'+RUNGS.map(function(r){return '<button data-mode="'+r[0]+'" class="'+(mode===r[0]?"on":"")+'">'+r[1]+'</button>'}).join("")+'</div><p class="muted small" style="margin:10px 0 0" id="rung-note">'+esc((RUNGS.filter(function(r){return r[0]===mode})[0]||RUNGS[0])[2])+'</p></div>'
      +'<p class="sec">Today, hour by hour</p>'+(hijri?'<p class="muted small" style="margin:-4px 0 10px">'+esc(hijri)+' · Umm al-Qura</p>':'')
      +(Object.keys(WAITING).length?'<p class="muted small" style="margin:-4px 0 12px">'+esc(Object.keys(WAITING).join(", "))+' is waiting on its own review; nothing to do, it resumes by itself.</p>':'')+(rows.join("")||'<div class="empty">The day could not be read.</div>')
      +'<p class="sec">The reels</p><details class="fold" id="reels-fold"><summary>'+cards.length+' rendered<span class="pill">'+["verse","word","name","know","dua","day","light"].map(function(k){var n=cards.filter(function(c){return (c.kind||"light")===k}).length;return n?n+" "+k:""}).filter(Boolean).join(" · ")+'</span></summary><div class="in"><div class="grid" id="reel-grid"></div></div></details>'
      +'<p class="sec">The token clock</p><div class="card">'+tokbar("Facebook",fbL)+tokbar("Instagram",igL)+'<div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost sm" data-renew="fb">Facebook renewed</button><button class="btn ghost sm" data-renew="ig">Instagram renewed</button></div></div>'
      +'<p class="sec" id="anchor-reddit">Reddit · for your hand</p>'+(heldR.length?'<div class="list">'+heldR.map(function(h,i){return '<div class="row tap" data-red="'+i+'"><div class="ic">'+ICO.reddit+'</div><div class="t"><b>'+esc(h.title||h.slot)+'</b><span>'+esc(h.slot)+' · tap to copy the draft</span></div><div class="chev">'+ICO.chev+'</div></div>'}).join("")+'</div>':'<div class="empty">Nothing is waiting.</div>')
      +'<p class="sec">What has gone out</p><details class="fold"><summary>The log<span class="pill">'+((lg.log||[]).length)+'</span></summary><div class="in">'+((lg.log||[]).slice(0,30).map(function(l){return '<div class="small" style="padding:5px 0;border-bottom:1px solid var(--line)"><code style="background:none;border:0;padding:0">'+esc(String(l.at||"").slice(5,16).replace("T"," "))+'</code> '+esc(l.slot||"")+' <span class="'+(l.state==="sent"?"":"muted")+'">'+esc(l.state||"")+'</span></div>'}).join("")||'<div class="empty">Nothing yet.</div>')+'</div></details>';
    /* the reels build only when opened */
    var fold=$("reels-fold");fold.dataset.cards=JSON.stringify(cards.map(function(c){return{id:c.id,hook:c.hook,slot:c.slot,caption:c.caption}}));
    fold.addEventListener("toggle",function(){if(fold.open&&!fold.dataset.built){fold.dataset.built="1";var cs=JSON.parse(fold.dataset.cards);$("reel-grid").innerHTML=cs.map(function(c){return '<div class="reel" data-reel="'+esc(c.id)+'"><img loading="lazy" src="'+esc(reelUrl(c,"cover"))+'" alt=""><b>'+esc(c.hook)+'</b></div>'}).join("")}});
    el.onclick=function(e){
      var b=e.target.closest("button,[data-red],[data-reel]");if(!b)return;
      if(b.dataset.mode)return setMode(b.dataset.mode);
      if(b.dataset.retry){var p=b.dataset.retry.split("|");return retryChan(p[0],p[1],b)}
      if(b.dataset.send)return sendSlot(b.dataset.send,b,!!b.dataset.force);
      if(b.dataset.finish){b.disabled=true;return post("/api/social",{action:"finish-reels"}).then(function(r){toast(r.ok?"Asked Instagram again.":"It refused.",!r.ok);bust();drawPosts(true)}).catch(unreachable(b))}
      if(b.dataset.fix){var q=b.dataset.fix.split("|");return fixChan(q[0],q[1],b)}
      if(b.dataset.why){var w=b.dataset.why.split("|");return whyChan(w[0],w[1])}
      if(b.dataset.prev)return preview(b.dataset.prev);
      if(b.dataset.renew){b.disabled=true;return post("/api/social",{action:"renewed",which:b.dataset.renew}).then(function(r){var good=r.ok&&r.j.ok!==false;toast(good?"Clock reset.":(r.j.why||r.j.error||"It refused."),!good);bust();drawPosts(true)}).catch(unreachable(b))}
      if(b.dataset.red!=null){var h=heldR[+b.dataset.red]||{};return sheet('<h2>'+esc(h.title||"Reddit draft")+'</h2><p class="sub">'+esc(h.slot||"")+' · copy it, then post it yourself where it belongs.</p><div class="msg">'+esc(h.text||h.body||"")+'</div><div class="acts"><button class="btn" id="cp">Copy the draft</button><button class="btn ghost" id="cl">Close</button></div>')
        ,setTimeout(function(){$("cp").onclick=function(){navigator.clipboard.writeText(h.text||h.body||"").then(function(){toast("Copied.")},function(){toast("Could not copy.",true)})};$("cl").onclick=closeSheet},0)}
      if(b.dataset.reel){var c=JSON.parse(fold.dataset.cards).filter(function(x){return x.id===b.dataset.reel})[0]||{};return sheet('<h2 style="font-size:17px">'+esc(c.hook)+'</h2><p class="sub">'+esc(c.slot)+' · '+esc(c.id)+'</p><video src="'+esc(reelUrl(c,"video"))+'" poster="'+esc(reelUrl(c,"cover"))+'" controls playsinline preload="none" style="width:100%;border-radius:12px;background:#05060f;aspect-ratio:9/16;max-height:60svh"></video><details style="margin-top:12px"><summary class="muted small" style="cursor:pointer">The caption</summary><div class="msg small" style="margin-top:8px">'+esc(c.caption||"")+'</div></details>')}
    };
  }).catch(function(e){console.error(e);el.innerHTML='<div class="card"><b style="color:var(--bad)">The posts could not be read.</b><div class="muted small" style="margin-top:6px">'+esc(e&&e.message||e)+'</div></div>'});

function setMode(m){var r=RUNGS.filter(function(x){return x[0]===m})[0];
  sheet('<h2>'+esc(r[1])+'</h2><p class="sub">'+esc(r[2])+'</p><div class="acts"><button class="btn" id="yes">Set it</button><button class="btn ghost" id="no">Leave it</button></div>');
  setTimeout(function(){$("no").onclick=closeSheet;$("yes").onclick=function(){$("yes").disabled=true;post("/api/settings",{"social.mode":m}).then(function(res){closeSheet();if(res.ok){toast("The ladder is on "+r[1].toLowerCase()+".");bust();drawPosts(true)}else toast((res.j&&(res.j.error||(res.j.refused||[]).join("; ")))||"It refused.",true)}).catch(unreachable($("yes")))}},0)}
var INFLIGHT={};
function busy(){return Object.keys(INFLIGHT).length>0}
function sendSlot(id,b){if(INFLIGHT[id])return;var was=b.textContent;b.disabled=true;b.textContent="Sending…";INFLIGHT[id]=1;
  post("/api/social",{action:"send-slot",slot:id}).then(function(r){delete INFLIGHT[id];
    if(!r.ok||(r.j&&r.j.ok===false)){toast((r.j&&r.j.error)||"It refused.",true);b.disabled=false;b.textContent=was;return}
    toast("Sent "+id+".");bust();drawPosts(true)}).catch(function(){delete INFLIGHT[id];unreachable(b,was)()})}
function retryChan(id,ch,b){var k=id+"|"+ch;if(INFLIGHT[k])return Promise.resolve();var was=b.innerHTML;b.disabled=true;b.innerHTML=esc(ch)+" …";INFLIGHT[k]=1;
  return post("/api/social",{action:"retry-channel",slot:id,where:ch}).then(function(r){delete INFLIGHT[k];
    if(!r.ok||!r.j.ok){toast((r.j&&r.j.error)||"It refused.",true);b.disabled=false;b.innerHTML=was;return r}
    toast(r.j.note||"Sent to "+ch+".");bust();drawPosts(true);return r}).catch(function(){delete INFLIGHT[k];unreachable(b)();b.innerHTML=was})}

  get("/api/social?action=diagnose&slot="+encodeURIComponent(id)+"&where="+encodeURIComponent(ch)).then(function(r){var j=r.j||{};

/* ================= READERS ================= */
/* What strangers watch: the last fortnight's posts read back from the
   networks (api/insights). Bars are median reach by kind and by hour, the
   top ten by reach, and only the sentences the numbers support. Nothing here
   is drawn from a bucket of fewer than five; the server says so itself. */
var NET_NAME={instagram:"Instagram",facebook:"Facebook",youtube:"YouTube"};
function insBars(rows,lab){if(!rows.length)return '<div class="empty">Nothing read yet.</div>';var mx=rows.reduce(function(m,r){return Math.max(m,(r.reach&&r.reach.median)||0)},0)||1;
  return '<div class="bars">'+rows.map(function(r){var med=r.reach&&r.reach.median!=null?r.reach.median:null;return '<div class="b"><span class="n" title="'+esc(r.n)+' posts">'+esc(lab(r))+' <span class="faint">'+esc(r.n)+'</span></span><span class="t"><i data-w="'+(med==null?0:Math.round(med/mx*100))+'"></i></span><span class="v">'+(med==null?"·":Math.round(med).toLocaleString())+'</span></div>'}).join("")+'</div>'}
function insHtml(ins){
  if(!ins||ins.ok===false)return '<div class="card"><div class="empty">'+esc((ins&&ins.error)||"The posts could not be read back.")+'</div></div>';

/* ===========================================================================
   THE FLOW

   One picture of where the energy goes, drawn from GET /api/house?action=flow
   and from nothing else. The networks are small source nodes on the left; they
   converge into the posts made, and from there the map follows the server's own
   edges: reach, then views and the arrivals the beacon could attribute, then
   the readers on the site, and from them the pages read, the gifts and the
   du'as. What arrived and the guardians standing sit at the end, because no
   measured step leads to them and inventing one would be a lie.

   THREE RULES.
   1. A stage that could not be read is a hollow node saying "unread". It is
      never a nought, because nought is a number and this is an absence.
   2. An edge carries a rate only when the server sent one. The step from reach
      to the arrivals crosses two grains of time and the server says so; the
      map draws that step dotted and says nothing over it.
   3. The picture is never the only encoding: every number under it is written
      again as a plain list, and the server's notes are printed whole.

   The motion is finite and reader-driven: a dot travels each edge once, on
   load and on Trace, and under prefers-reduced-motion not one is made.
   =========================================================================== */
var F_ORDER=["posts","reach","views","clicks","readers","pages","gifts","duas","given","guardians"];
var F_SHORT={posts:"posts",reach:"reached",views:"views",clicks:"arrivals",readers:"readers",pages:"pages",gifts:"gifts",duas:"du'as"};
var F_DAYS=[7,14,30];
function fnum(v){return Number(v).toLocaleString("en-US",{maximumFractionDigits:2})}
function reduced(){try{return !!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)}catch(e){return false}}

/* the columns, from the server's own edges: a stage sits one step further out
   than the furthest stage that feeds it, and a stage nothing feeds sits at the
   end rather than at the beginning */
function flowDepths(stages,edges){
  var d={},ids={};
  stages.forEach(function(s){d[s.id]=null;ids[s.id]=1});
  if(ids.posts)d.posts=1;
  for(var pass=0;pass<stages.length+2;pass++)
    edges.forEach(function(e){if(d[e.from]!=null&&ids[e.to]!=null){var v=d[e.from]+1;if(d[e.to]==null||v>d[e.to])d[e.to]=v}});
  var max=1;for(var k in d)if(d[k]!=null&&d[k]>max)max=d[k];
  stages.forEach(function(s){if(d[s.id]==null)d[s.id]=max+1});
  return d;
}
/* the geometry. Left to right when there is room for it, top to bottom when
   there is not, and the same numbers either way. */
function flowLayout(stages,nets,edges,wide){
  var depth=flowDepths(stages,edges);
  var cols=[];
  if(nets.length)cols.push(nets.map(function(n){return{net:n.net,label:n.net,value:n.value,unit:"posts",small:true}}));
  var byDepth={};
  stages.forEach(function(s){(byDepth[depth[s.id]]=byDepth[depth[s.id]]||[]).push(s)});
  Object.keys(byDepth).map(Number).sort(function(a,b){return a-b}).forEach(function(k){

/* ---- the paste kit ----
   A piece of outreach is two or three fields going into two or three boxes,
   and it usually wants a small edit first, so what comes back is editable in
   place, counts itself against the channel's limit, and copies field by
   field rather than arriving as one block with "Subject:" glued to the top. */
var KITN=0;
function kitLimit(ch){var c=String(ch||"").toLowerCase();
  if(/(^|\W)x(\W|$)|twitter/.test(c))return 280;
  if(/threads|mastodon/.test(c))return 500;
  if(/instagram/.test(c))return 2200;
  return 0}
function kitBlanks(t){var m=String(t||"").match(/\[[^\]\n]{2,40}\]/g);return m?m.slice(0,6):[]}
function kit(o){
  var lim=kitLimit(o.channel),gaps=kitBlanks((o.subject||"")+" "+(o.body||""));
  var h='<div class="card" data-kit="k'+(++KITN)+'" data-lim="'+lim+'">'
    +'<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><b style="color:var(--cream)">'+esc(o.label||"A draft")+'</b>'
    +(o.channel?'<span class="pill">'+esc(o.channel)+'</span>':'')
    +'<span class="faint small" data-count style="margin-left:auto"></span></div>'
    +(o.note?'<p class="muted small" style="margin:6px 0 0">'+esc(o.note)+'</p>':'');
  if(o.subject!=null)h+='<p class="sec" style="margin:12px 0 4px">'+esc(o.subjectLabel||"Subject")+'</p><input class="fi" data-sub value="'+esc(o.subject)+'"/>';
  h+='<p class="sec" style="margin:12px 0 4px">'+esc(o.bodyLabel||"Message")+'</p>'
    +'<textarea class="fi" data-body rows="'+Math.min(18,Math.max(4,Math.ceil(String(o.body||"").length/64)))+'">'+esc(o.body||"")+'</textarea>';
  if(gaps.length)h+='<p class="small" style="margin:8px 0 0;color:var(--wait)">Fill in before sending: '+esc(gaps.join(" · "))+'</p>';
  h+='<div class="acts">'
    +(o.subject!=null?'<button class="btn ghost sm" data-cp="sub">Copy the '+esc(String(o.subjectLabel||"subject").toLowerCase())+'</button>':'')
    +'<button class="btn ghost sm" data-cp="body">Copy the '+esc(String(o.bodyLabel||"message").toLowerCase())+'</button>'
    +(o.subject!=null?'<button class="btn ghost sm" data-cp="both">Copy both</button>':'')
    +(o.mail?'<button class="btn ghost sm" data-cp="mail">Open in mail</button>':'')
    +'</div></div>';
  return h}
function kitCount(card){
  var body=card.querySelector("[data-body]"),c=card.querySelector("[data-count]"),lim=+card.dataset.lim||0;
  if(!body||!c)return;
  var t=body.value||"",w=t.trim()?t.trim().split(/\s+/).length:0;
  c.textContent=w+" words · "+t.length+" characters"+(lim?" · limit "+lim:"");
  c.style.color=lim&&t.length>lim?"var(--bad)":"";
}
function kitBind(root){if(!root)return;
  root.querySelectorAll("[data-kit]").forEach(function(c){kitCount(c);
    var b=c.querySelector("[data-body]");if(b)b.addEventListener("input",function(){kitCount(c)})})}
function fallbackCopy(text){
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();var done=false;
  try{done=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);return done}
function copyText(text){
  var yes=function(){toast("Copied.")},no=function(){toast("The browser refused the clipboard.",true)};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    return navigator.clipboard.writeText(text).then(yes,function(){fallbackCopy(text)?yes():no()});
  fallbackCopy(text)?yes():no()}
function kitCopy(b){
  var card=b.closest("[data-kit]");if(!card)return;
  var sub=card.querySelector("[data-sub]"),body=card.querySelector("[data-body]");

/* Everything written here appears at /journal the moment it is saved as
   published: no zip, no upload, no deploy. The desk carries no author field
   and no signature, and nothing it sends out can name the writer -- the
   journal is the house's opinion, not a person's, and that is kept absolute
   exactly as the old desk kept it. */
var JW={open:false,editing:null,prev:false,say:"",d:{title:"",dek:"",body:"",tags:"",slug:""}};
function jwWords(){var w=String(JW.d.body||"").split(/\s+/).filter(Boolean).length;
  return w?(w+" words · about "+Math.max(1,Math.round(w/220))+" min"):""}
/* a faithful local echo of the small markup rules the site's own renderer
   uses, so a preview costs nothing and saves no draft */
function jwRender(md){
  return String(md||"").replace(/\r\n?/g,"\n").split(/\n{2,}/).map(function(b){
    b=b.trim();if(!b)return "";
    var inl=function(t){return esc(t)
      .replace(/\*\*([^*]{1,200})\*\*/g,"<strong>$1</strong>")
      .replace(/\*([^*]{1,200})\*/g,"<em>$1</em>")
      .replace(/\[([^\]]{1,120})\]\((https?:\/\/[^\s)]{1,300}|\/[^\s)]{0,200})\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g,"<br>")};
    if(/^---+$/.test(b))return '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">';
    if(/^###\s+/.test(b))return '<p class="ttl" style="font-size:15px">'+inl(b.replace(/^###\s+/,""))+'</p>';
    if(/^##\s+/.test(b))return '<p class="ttl" style="font-size:17px">'+inl(b.replace(/^##\s+/,""))+'</p>';
    if(/^>\s?/.test(b))return '<p class="small" style="border-left:2px solid var(--gold-dim);padding-left:12px;color:var(--muted);margin:10px 0">'+inl(b.split("\n").map(function(l){return l.replace(/^>\s?/,"")}).join("\n"))+'</p>';
    if(/^[-*]\s+/.test(b))return '<ul class="small" style="margin:10px 0;padding-left:18px">'+b.split("\n").filter(function(l){return /^[-*]\s+/.test(l)}).map(function(l){return "<li>"+inl(l.replace(/^[-*]\s+/,""))+"</li>"}).join("")+'</ul>';
    return '<p class="small" style="margin:10px 0;line-height:1.8">'+inl(b)+'</p>';
  }).join("");
}

    var link=LANTERN_LINK[d.verdict];
