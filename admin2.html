      +'<div class="row"><div class="ic" style="color:'+(d.ok?"var(--good)":"var(--bad)")+'">'+(d.ok?ICO.ok:ICO.warn)+'</div><div class="t" style="white-space:normal"><b style="white-space:normal">'+(d.ok?"The lantern is lit.":"The lantern could not be lit.")+'</b><span style="white-space:normal">'+(d.ok
        ?esc(String(d.answered||"").split("/").pop())+' answered "'+esc(d.reply||"")+'" in '+esc(String(d.ms||0))+' ms'
        :'The Codex is still whole: every tile falls back to its written treasury.')+'</span></div></div>'
      +(!d.ok&&d.advice?'<div class="card" style="margin-top:8px"><b style="color:var(--gold)">What to do</b><p class="small" style="margin:6px 0 0">'+esc(d.advice)+'</p>'+(link?'<p class="small" style="margin:8px 0 0"><a href="'+esc(link[1])+'" target="_blank" rel="noopener">'+esc(link[0])+'</a></p>':'')+'</div>':'')
      +'<p class="muted small" style="margin:10px 0 0">OpenRouter lists '+esc(String(d.listed||0))+' free model'+(d.listed===1?"":"s")+' right now'+(d.listErr?' ('+esc(d.listErr)+')':'')+'. The house asks for that list itself every six hours, so a model that disappears is simply never asked for again.</p>'
      +(d.warning?'<p class="small" style="margin:6px 0 0;color:var(--wait)">'+esc(d.warning)+'</p>':'')
      +((d.tried||[]).length?'<div class="list" style="margin-top:10px">'+d.tried.map(function(t){
        return '<div class="row"><div class="t" style="min-width:0"><b style="font-family:var(--f-mono);font-size:12px">'+esc(t.model)+'</b><span>'+esc(String(t.ms||0))+' ms</span></div><div class="r"><span class="pill '+(t.err?"bad":"good")+'">'+esc(t.err||"answered")+'</span></div></div>'}).join("")+'</div>':'')
      +'</div>';
  }).catch(function(){b.disabled=false;b.textContent=was;out.innerHTML='<p class="small" style="margin:12px 0 0;color:var(--bad)">Could not reach the house.</p>'});
}

/* ================= CONTROLS ================= */
/* THE DIALS. The last thing that lived only on the old console: every switch
   this house has, read from GET /api/settings?all=1 and written back with a
   POST carrying nothing but the dials that were moved.

   Four rules it keeps.
   1. Nothing is live until Save. A row that has been touched is marked, the
      bar at the foot counts the marks, and Discard puts every one of them
      back without asking the house anything.
   2. Only what was moved is sent. A dial typed back to the value it already
      holds stops being a change, so a save is never a rewrite of the whole
      table.
   3. A dial the house refuses keeps its mark and says why, in the house's own
      words. Snapping back to the old value as though nothing had happened is
      how an owner comes to distrust a control panel.
   4. Every value is shown as it is: a number is the number, never dressed as
      money and never given a currency.  */
var CTL={dirty:{},refused:{},list:null,by:{},store:true};
function ctlHere(d){return /^set here/.test(String(d&&d.src||""))}
/* where the value comes from, in three words at most: the house's own src,
   with "built in" said as what an owner would call it */
function ctlSrc(d){var s=String(d&&d.src||"");
  if(ctlHere(d))return "set here";
  if(/^env/.test(s))return s;
  return "default"}
function ctlVal(d){return (d.k in CTL.dirty)?CTL.dirty[d.k]:d.value}
function ctlCtl(d){
  var v=ctlVal(d),k=esc(d.k),n=esc(d.n);
  if(d.t==="bool")
    return '<button type="button" class="sw" role="switch" aria-checked="'+(v?"true":"false")+'" data-dial="'+k+'" aria-label="'+n+'"></button>';
  if(d.t==="int"||d.t==="num")
    return '<input class="fi numi" type="number" inputmode="numeric" step="1" min="'+esc(String(d.min==null?0:d.min))+'" max="'+esc(String(d.max==null?999999:d.max))+'" value="'+esc(v==null?"":String(v))+'" data-dial="'+k+'" aria-label="'+n+'"/>';
  if(d.t==="enum"){var o=(d.opts||[]).slice(0,6);
    return '<div class="seg" role="group" aria-label="'+n+'" style="grid-template-columns:repeat('+Math.max(1,o.length)+',1fr)">'
      +o.map(function(x){var on=String(v)===String(x);
        return '<button type="button" data-dial="'+k+'" data-opt="'+esc(x)+'" aria-pressed="'+(on?"true":"false")+'" class="'+(on?"on":"")+'">'+esc(x)+'</button>'}).join("")+'</div>'}
  return '<input class="fi txti" type="text" maxlength="'+esc(String(d.max||200))+'" value="'+esc(v==null?"":String(v))+'" data-dial="'+k+'" aria-label="'+n+'" placeholder="empty means none"/>';
}
function ctlRow(d){
  var chg=(d.k in CTL.dirty),why=CTL.refused[d.k]||"";
  return '<div class="dial'+(chg?" dirty":"")+'" data-row="'+esc(d.k)+'">'
    +'<div class="dt"><b>'+esc(d.n)+'</b><div class="dh">'+esc(d.h||"")+'</div>'
    +'<div class="tags"><span class="src">'+esc(ctlSrc(d))+'</span><span class="src chg"'+(chg?"":" hidden")+'>changed</span></div>'
    +'<div class="why"'+(why?"":" hidden")+'>'+esc(why)+'</div></div>'
    +'<div class="dc">'+ctlCtl(d)+'</div></div>';
}
function ctlBar(){
  var n=Object.keys(CTL.dirty).length;
  return '<div class="savebar" id="ctl-bar"'+(n?"":" hidden")+'>'
    +'<span class="n" id="ctl-n">'+n+' change'+(n===1?"":"s")+'</span> <span class="sp">·</span> '
    +'<button class="btn sm" id="ctl-save">Save</button> <span class="sp">·</span> '
    +'<button class="btn ghost sm" id="ctl-discard">Discard</button></div>';
}
/* the marks are painted rather than redrawn, so a number being typed keeps
   the cursor it is being typed with */
function ctlPaint(){
  var el=$("s-controls");if(!el||!CTL.list)return;
  CTL.list.forEach(function(d){
    var row=el.querySelector('[data-row="'+d.k+'"]');if(!row)return;
    var chg=(d.k in CTL.dirty),v=ctlVal(d),why=CTL.refused[d.k]||"";
    row.classList.toggle("dirty",chg);
    var tag=row.querySelector(".src.chg");if(tag)tag.hidden=!chg;
    var w=row.querySelector(".why");if(w){w.textContent=why;w.hidden=!why}
    if(d.t==="bool"){var sw=row.querySelector(".sw");if(sw)sw.setAttribute("aria-checked",v?"true":"false")}
    if(d.t==="enum")row.querySelectorAll("[data-opt]").forEach(function(b){
      var on=String(b.dataset.opt)===String(v);b.setAttribute("aria-pressed",on?"true":"false");b.classList.toggle("on",on)});
  });
  var n=Object.keys(CTL.dirty).length,bar=$("ctl-bar"),lab=$("ctl-n");
  if(lab)lab.textContent=n+" change"+(n===1?"":"s");
  if(bar)bar.hidden=!n;
}
function ctlSet(d,v){
  /* a dial moved back to what it already holds is not a change */
  if(String(v)===String(d.value))delete CTL.dirty[d.k];
  else CTL.dirty[d.k]=v;
  delete CTL.refused[d.k];
  ctlPaint();
}
function drawControls(force){
  var el=$("s-controls");
  if(!el.dataset.built){el.innerHTML=BACK+'<p class="sec">The dials</p>'+skel(3);el.dataset.built="1"}
  return settingsQ(force).then(function(j){
    j=j||{};
    var ds=(j.dials||[]).filter(function(d){return d&&d.k});
    CTL.store=j.store!==false;CTL.list=ds;CTL.by={};
    ds.forEach(function(d){CTL.by[d.k]=d});
    /* a dial that has gone out of the house since it was touched cannot be
       saved, so its mark goes with it rather than sitting there unsendable */
    Object.keys(CTL.dirty).forEach(function(k){if(!CTL.by[k]){delete CTL.dirty[k];delete CTL.refused[k]}});
    var groups=[],seen={};
    ds.forEach(function(d){var g=d.g||"The house";if(!seen[g]){seen[g]=[];groups.push(g)}seen[g].push(d)});
    var here=ds.filter(ctlHere).length;
    el.innerHTML=BACK
      +'<p class="sec">The dials</p>'
      +'<p class="muted small" style="margin:-6px 0 10px">Every switch this house has, in one place. Nothing is live until you save, and a dial set here overrides what the environment says: put it back to its default and the environment answers for it again.</p>'
      +(CTL.store?'':'<div class="card"><b style="color:var(--bad)">No store is connected, so nothing here can be saved.</b><p class="muted small" style="margin:6px 0 0">Every dial below is showing what the environment or the code says. Add REDIS_URL in Vercel and this room starts working.</p></div>')
      +(ds.length
        ?groups.map(function(g){return '<p class="sec">'+esc(g)+'</p>'+seen[g].map(ctlRow).join("")}).join("")
        :'<div class="empty">No dial came back, so there is nothing to turn here.</div>')
      +(ds.length?'<p class="faint small" style="margin:12px 0 0">'+esc(here+" of "+ds.length+" dials are set here; the rest are what the environment or the code says. A dial reads on the next request, not on the next deploy.")+'</p>':'')
      +ctlBar();
    el.onclick=function(e){
      var b=e.target.closest&&e.target.closest("button");if(!b)return;
      if(b.id==="ctl-save")return ctlSave(b);
      if(b.id==="ctl-discard"){CTL.dirty={};CTL.refused={};return void drawControls(false)}
      var d=CTL.by[b.dataset.dial||""];if(!d)return;
      if(d.t==="bool")return ctlSet(d,b.getAttribute("aria-checked")!=="true");
      if(d.t==="enum"&&b.dataset.opt!=null)return ctlSet(d,b.dataset.opt);
    };
    var typed=function(e){
      var t=e.target,d=CTL.by[(t&&t.dataset&&t.dataset.dial)||""];if(!d)return;
      if(d.t==="int"||d.t==="num"){
        var n=parseFloat(String(t.value).replace(/[\s,]/g,""));
        if(!isFinite(n))return;
        if(d.min!=null&&n<d.min)n=d.min;
        if(d.max!=null&&n>d.max)n=d.max;
        return ctlSet(d,d.t==="int"?Math.round(n):n)}
      if(d.t==="text")ctlSet(d,t.value);
    };
    el.oninput=typed;el.onchange=typed;
  }).catch(function(){el.innerHTML=BACK+'<div class="card" style="margin-top:12px"><b style="color:var(--bad)">The dials could not be read.</b><p class="muted small" style="margin:6px 0 0">Press refresh at the top to ask again.</p></div>'});
}
function ctlSave(b){
  var keys=Object.keys(CTL.dirty);
  if(!keys.length||INFLIGHT.dials)return;
  var body={};keys.forEach(function(k){body[k]=CTL.dirty[k]});
  var was=b.textContent;b.disabled=true;b.textContent="Saving…";INFLIGHT.dials=1;
  post("/api/settings",body).then(function(r){
    delete INFLIGHT.dials;
    var j=r.j||{},refused=Array.isArray(j.refused)?j.refused:[];
    if(r.locked)return;
    if(!r.ok&&!refused.length){b.disabled=false;b.textContent=was;toast(j.error||"It refused.",true);return}
    /* the house names the dial it would not take at the head of its sentence,
       so the reason is filed on that row and the row keeps its mark */
    var kept={};
    refused.forEach(function(line){
      var s=String(line);
      var k=keys.filter(function(x){return s.indexOf(x)===0})[0];
      if(!k)return;
      kept[k]=1;CTL.refused[k]=s.slice(k.length).replace(/^[:\s]+/,"")||"the house would not take this value";
    });
    keys.forEach(function(k){if(!kept[k]){delete CTL.dirty[k];delete CTL.refused[k]}});
    toast(refused.length?"The house refused "+refused.join("; ")+".":"Saved.",refused.length>0);
    C.settings=null;C.house=null;LOADED.house=false;
    drawControls(true);
  }).catch(function(){delete INFLIGHT.dials;unreachable(b,was)()});
}

/* ---------- the gate ---------- */
function unlock(){$("gate").hidden=true;$("app").classList.add("on");try{localStorage.setItem("noor_nocount","1")}catch(e){}
  clock();if(!unlock.tick)unlock.tick=setInterval(clock,30000);bust();var h=(location.hash||"").replace("#","");show(NAMES[h]?h:"today",true)}
function tryKey(){var pw=$("pw").value;if(!pw)return;$("enter").disabled=true;$("err").textContent="";
  post("/api/admin-auth",{password:pw}).then(function(r){if(r.ok&&r.j.ok)unlock();else{$("err").textContent=r.status===501?"The house has no key set (ADMIN_PASSWORD).":"That is not the key.";$("enter").disabled=false}}).catch(function(){$("err").textContent="Could not reach the house.";$("enter").disabled=false})}
$("enter").addEventListener("click",tryKey);$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")tryKey()});
fetch("/api/admin-data",{credentials:"same-origin"}).then(function(r){if(r.ok)unlock()}).catch(function(){});
window.NOOR_CONSOLE={show:show,bust:bust,get cur(){return CUR}};
})();
</script>
