<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>The Console · NOOR</title>
<meta name="theme-color" content="#0B0D16"/>
<link rel="icon" type="image/svg+xml" href="/assets/brand/mark.svg"/>
<link rel="apple-touch-icon" href="/assets/brand/mark-180.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,300&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ===========================================================================
   THE CONSOLE, SECOND HOUSE

   Five surfaces instead of twelve tabs: Home, Ask, Posts, Numbers and More
   (LANTERN.md section 1, 3 October 2026). Home is the owner's cockpit, the
   one place he meets the Lantern; every other room sits behind More, the
   engine room first. The phone gets a bar at the bottom
   where the thumb is; the desk gets a rail on the left. Nothing is fetched
   until its surface is opened, and a surface opened again within a minute is
   instant. Anything irreversible (the ladder) asks from a sheet first; a
   slot in flight is drawn as "Sending…" through every redraw so nothing can
   be pressed twice; a 401 brings the gate back rather than printing guesses
   as facts; the Lantern is never probed on load, only from its Test button.
   It talks to the same endpoints as /admin, which stays exactly as it was.

   The palette is the reel's: ink, a panel a shade lighter, one gold, and a
   cream for the words that matter. Green means went, red means did not, gold
   means the machine is still on it.
   =========================================================================== */
:root{
  --ink:#0B0D16;--panel:#11131F;--panel2:#161A2A;--line:#242B41;--line2:#2E3752;
  --gold:#E9C86A;--gold-dim:#8D7736;--cream:#FFF9E3;
  --text:#DCE3F2;--muted:#94A2C0;--faint:#66738F;
  --good:#8ED49B;--bad:#F08A8A;--wait:#E9C86A;--blue:#7E9BD1;
  --f-disp:'Spectral',Georgia,serif;--f-body:'Inter',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bar:64px;--rail:0px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{background:var(--ink);color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
a{color:var(--gold);text-decoration:none}
code{font-family:var(--f-mono);font-size:.86em;color:var(--gold);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
[hidden]{display:none!important}

/* ---- the gate ---- */
#gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .card{width:min(100%,380px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
#gate .mark{width:44px;height:44px;border-radius:50%;background:#1a1608;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:22px;margin:0 0 16px}
#gate h1{font-family:var(--f-disp);font-weight:500;font-size:24px;color:var(--cream);margin:0 0 6px}
#gate p{color:var(--muted);font-size:14px;margin:0 0 18px}
#gate input{width:100%;font:inherit;font-size:16px;background:var(--ink);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin:0 0 10px}
#gate .go{width:100%;background:var(--gold);color:#1a1608;font-weight:700;border-radius:10px;padding:13px;font-size:15px}
#gate .err{color:var(--bad);font-size:13px;min-height:1.2em;margin:10px 0 0}
#gate .old{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--faint)}

/* ---- the shell ---- */
#app{display:none;min-height:100svh}
#app.on{display:block}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,13,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:12px}
header.top .mark{width:30px;height:30px;border-radius:50%;background:#1a1608;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:16px;flex:0 0 auto}
header.top h1{font-family:var(--f-disp);font-weight:500;font-size:20px;color:var(--cream);margin:0;flex:1;letter-spacing:-.01em}
header.top .when{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}
header.top .rf{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
header.top .rf svg{width:16px;height:16px}
header.top .rf.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:16px 16px calc(var(--bar) + var(--sab) + 24px);max-width:760px;margin:0 auto}
.surf{display:none}.surf.on{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.surf.on{animation:none}}

/* the bar, and the rail it becomes on a desk */
/* the columns are counted from the buttons that are there, so a fifth
   surface can join the four without a rule being edited */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--bar) + var(--sab));padding-bottom:var(--sab);
  background:rgba(17,19,31,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.bar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;position:relative;min-height:44px}
nav.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bar button.on{color:var(--gold)}
nav.bar button .dot{position:absolute;top:10px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
@media(min-width:900px){
  :root{--bar:0px;--rail:216px}
  nav.bar{top:0;bottom:0;left:0;right:auto;width:var(--rail);height:auto;padding:24px 12px;border-top:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:4px;align-items:stretch;justify-content:flex-start}
  nav.bar::before{content:"NOOR";font-family:var(--f-disp);font-size:18px;color:var(--gold);letter-spacing:.2em;padding:6px 14px 18px}
  nav.bar button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;border-radius:10px;font-size:13px;letter-spacing:.04em;text-transform:none}
  nav.bar button.on{background:rgba(233,200,106,.1)}
  nav.bar button .dot{position:static;margin-left:auto;border:0}
  header.top,main{margin-left:var(--rail)}
  header.top{padding-left:28px;padding-right:28px}
  main{padding:24px 28px 60px;max-width:calc(760px + var(--rail))}
}

/* ---- the pieces ---- */
.sec{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);margin:26px 0 10px}
.sec:first-child{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.card.tap{cursor:pointer;transition:border-color .15s}
.card.tap:active{border-color:var(--line2)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero .n{font-family:var(--f-disp);font-size:52px;font-weight:600;line-height:1;color:var(--cream);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding-bottom:8px}
.hero .d{font-family:var(--f-mono);font-size:12px;padding-bottom:9px}
.hero .d.up{color:var(--good)}.hero .d.dn{color:var(--bad)}
.strip{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.strip .s{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:52px;padding:8px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.strip .s b{font-size:11px;color:var(--text);font-weight:600}
.strip .s span{font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.strip .s i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.strip .s.sent i{background:var(--good)}.strip .s.partial i,.strip .s.failed i,.strip .s.due i{background:var(--bad)}
.strip .s.pending i{background:var(--wait)}.strip .s.queued i{background:var(--blue)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.row.tap{cursor:pointer}.row.tap:active{border-color:var(--line2)}
.row .ic{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--gold)}
.row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .t{flex:1;min-width:0}
.row .t>b{display:block;color:var(--cream);font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t>span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex:0 0 auto;text-align:right}
.row .chev{color:var(--faint);flex:0 0 auto}
.row .acts2{display:flex;gap:6px;flex:0 0 auto}
.row.hold .t.tap{cursor:pointer}
@media(max-width:560px){.row.hold{flex-wrap:wrap}.row.hold .acts2{flex:1 0 100%;padding-left:46px}.row.hold .acts2 .btn{flex:1}}
.fold summary .pill{max-width:46%;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;border-radius:100px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:#2b4a37}.pill.bad{color:var(--bad);border-color:#4a2b2b}.pill.wait{color:var(--wait);border-color:#4a3f1f}.pill.blue{color:var(--blue);border-color:#2b3a5c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:13.5px;background:var(--gold);color:#1a1608}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--text)}
.btn.danger{background:none;border:1px solid #4a2b2b;color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{min-height:34px;padding:0 12px;font-size:12.5px;border-radius:8px}
.chan{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;min-height:30px;padding:0 11px;border-radius:100px;border:1px solid transparent}
.chan.ok{color:var(--good)}.chan.pending{color:var(--wait)}.chan.wait{color:var(--faint);border-color:var(--line)}
.chan.bad{color:var(--bad);border-color:rgba(240,138,138,.35);cursor:pointer}
.chan.bad:active{background:rgba(240,138,138,.12)}
.chan.more{color:var(--blue);border-color:rgba(126,155,209,.35);cursor:pointer;background:none}
.chan.more:active{background:rgba(126,155,209,.12)}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.slot .h{display:flex;align-items:baseline;gap:10px}
.slot .h code{font-size:11px;background:none;border:0;color:var(--gold);padding:0}
.slot .h b{color:var(--cream);font-weight:600;font-size:14.5px;flex:1;min-width:0}
.slot .h .pill{margin-left:auto}
.slot .b{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .b .spacer{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{padding:10px 6px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--gold);box-shadow:0 1px 0 var(--line)}
.bar2{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:6px 0 2px}
.bar2 i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar2 i.low{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.reel{border-radius:10px;overflow:hidden;background:#05060f;aspect-ratio:9/16;position:relative;cursor:pointer;border:1px solid var(--line)}
.reel img{width:100%;height:100%;object-fit:cover;display:block}
.reel b{position:absolute;left:8px;right:8px;bottom:8px;font-size:11px;line-height:1.3;color:var(--cream);text-shadow:0 1px 4px #000;font-weight:600}
details.fold{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:0 0 12px}
details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;color:var(--cream);font-weight:600;font-size:14.5px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--gold);font-size:12px;transition:transform .18s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary .pill{margin-left:auto}
details.fold>.in{padding:0 16px 16px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.stat{grid-template-columns:repeat(4,1fr)}}
.stat .c{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .c .v{font-family:var(--f-disp);font-size:26px;font-weight:600;color:var(--cream);line-height:1.1;font-variant-numeric:tabular-nums}
.stat .c .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:4px}
.stat .c .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
svg.chart{width:100%;height:150px;display:block}
.bars .b{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.bars .b .n{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .b .t{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bars .b .t i{display:block;height:100%;background:var(--gold);border-radius:3px;width:0;transition:width .5s ease}
.bars .b .v{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right}
.msg{overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px;color:var(--text);line-height:1.6}
.link{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);margin:0 0 8px}
.link b{color:var(--cream);font-weight:600;display:block;font-size:14px}
.link span{color:var(--muted);font-size:12.5px;display:block}
.link .chev{margin-left:auto;color:var(--faint)}
.sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;min-height:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{color:var(--faint);font-size:13.5px;padding:8px 2px}

/* ---- the rooms: House is the hub, each room is a surface of its own ---- */
.back{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px 0 10px;border-radius:100px;
  border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600}
.back:active{border-color:var(--line2);color:var(--text)}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.rooms{grid-template-columns:repeat(3,1fr)}}
.rooms .card{margin:0;display:flex;flex-direction:column;gap:3px;min-height:112px;text-align:left;width:100%}
.rooms .card b{color:var(--cream);font-weight:600;font-size:14px}
.rooms .card .w{color:var(--faint);font-size:11.5px;line-height:1.35}
.rooms .card .v{font-family:var(--f-disp);font-size:23px;font-weight:600;color:var(--cream);line-height:1.1;margin-top:auto;font-variant-numeric:tabular-nums}
.ttl{font-family:var(--f-disp);font-weight:500;font-size:19px;color:var(--cream);letter-spacing:-.01em;margin:8px 0 0}
.fi{width:100%;font:inherit;font-size:16px;background:var(--ink);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.fi::placeholder{color:var(--faint)}
textarea.fi{font-size:14px;line-height:1.65;resize:vertical}
select.fi{-webkit-appearance:none;appearance:none}
.frm{display:grid;gap:8px}
@media(min-width:560px){.frm.two{grid-template-columns:1fr 1fr}.frm.two .full{grid-column:1/-1}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts .btn{flex:1 1 auto}
@media(min-width:560px){.acts .btn{flex:0 0 auto}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv>b{color:var(--muted);font-weight:600;white-space:nowrap}
.kv>span{color:var(--text);min-width:0;overflow-wrap:anywhere}
.mon{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:76px;margin:12px 0 0}
.mon i{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.mon i u{display:block;background:var(--line2);border-radius:2px 2px 0 0}
.mon i.has u{background:var(--gold-dim)}
.mon i.now u{background:var(--gold)}
.mon i b{font-size:9px;font-weight:600;color:var(--faint);text-align:center}
.tog{cursor:pointer;min-height:30px;display:inline-flex;align-items:center}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46svh;overflow:auto;margin-bottom:10px}
.bub{border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line)}
.bub.me{background:var(--panel2);align-self:flex-end;max-width:88%}
.bub.it{background:var(--ink);color:var(--text)}
.bub.warn{border-color:#4a2b2b;color:var(--bad)}
.dif{display:grid;gap:6px;margin-top:10px;font-size:13.5px;overflow-wrap:anywhere}
.dif .was{color:var(--bad);text-decoration:line-through}
.dif .now{color:var(--good)}
.seg.two{grid-template-columns:repeat(2,1fr)}

/* ---- the dials: one row a switch, and a bar that counts what is unsaved ----
   The row is the whole sentence: what the dial is, what it does, where its
   value comes from, and the control itself. On a phone the control drops
   under the words rather than squeezing them, which is why the row wraps. */
.dial{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin:0 0 8px}
.dial.dirty{border-color:var(--gold-dim)}
.dial .dt{flex:1 1 210px;min-width:0}
.dial .dt>b{display:block;color:var(--cream);font-weight:600;font-size:14.5px}
.dial .dh{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:3px}
.dial .tags{margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.dial .src{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}
.dial .src.chg{color:var(--gold)}
.dial .why{color:var(--bad);font-size:12.5px;line-height:1.5;margin-top:7px}
.dial .dc{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:8px;max-width:100%}
.dial .dc .seg{min-width:180px;max-width:100%}
/* the 16px stays: anything smaller and a phone zooms the page on focus */
.dial input.fi{padding:8px 10px}
.dial input.numi{width:110px;text-align:center;font-family:var(--f-mono)}
.dial input.txti{width:min(260px,62vw)}
/* a switch that is a button, so the tab key reaches it and a reader is told
   what state it is in rather than what colour it is */
.sw{width:50px;height:29px;border-radius:100px;border:1px solid var(--line2);background:var(--panel2);position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--faint);
  transition:transform .16s ease,background .16s ease}
.sw[aria-checked="true"]{background:rgba(233,200,106,.2);border-color:var(--gold-dim)}
.sw[aria-checked="true"]::after{transform:translateX(21px);background:var(--gold)}
@media(prefers-reduced-motion:reduce){.sw::after{transition:none}}
.savebar{position:sticky;bottom:calc(var(--bar) + var(--sab) + 10px);z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--panel2);border:1px solid var(--gold-dim);border-radius:12px;padding:10px 12px;margin:16px 0 0}
.savebar .n{font-size:13.5px;font-weight:600;color:var(--cream)}
.savebar .sp{color:var(--faint)}
@media(min-width:900px){.savebar{bottom:16px}}

/* ---- Today's reels: five cards, one thumb ----
   The cover is small and the button is big, because the point of the room
   is the Share button. The caption sits folded under the hook so a card is
   one screen tall on a phone; Copy is beside it for the target that drops
   the text (most of them do when a file is attached). */
.rl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.rl .top{display:flex;gap:12px;align-items:flex-start}
.rl .cv{flex:0 0 72px;width:72px;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:#05060f;border:1px solid var(--line)}
.rl .cv img{width:100%;height:100%;object-fit:cover;display:block}
.rl .tx{flex:1;min-width:0}
.rl .tx .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rl .tx b{display:block;font-family:var(--f-disp);font-weight:500;font-size:17px;line-height:1.35;color:var(--cream);margin-top:4px;overflow-wrap:anywhere}
.rl .tx .st{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rl details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.rl details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-height:36px}
.rl details>summary::-webkit-details-marker{display:none}
.rl details>summary::before{content:"▸";color:var(--gold);font-size:12px;transition:transform .18s}
.rl details[open]>summary::before{transform:rotate(90deg)}
.rl details>summary .btn{margin-left:auto}
.rl .cap{margin-top:8px;font-size:13.5px}
.rl .share{width:100%;min-height:52px;font-size:15.5px;margin-top:12px;border-radius:12px}
.rl .share[disabled]{opacity:.75}
.rl .hint{color:var(--faint);font-size:12px;line-height:1.5;margin:8px 0 0;text-align:center}
.rl .hand{color:var(--good);font-family:var(--f-mono);font-size:10.5px}

/* ---- sheets: every action is one ---- */
#veil{position:fixed;inset:0;background:rgba(5,6,15,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding:8px 18px calc(18px + var(--sab));max-height:88svh;overflow:auto;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
#sheet:not(.on){visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s}
#sheet.on{transform:none;visibility:visible}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 14px}
#sheet h2{font-family:var(--f-disp);font-weight:500;font-size:20px;color:var(--cream);margin:0 0 4px}
#sheet .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
#sheet .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#sheet .acts .btn{flex:1 1 auto}
@media(min-width:900px){#sheet{left:calc(var(--rail) + 50% - 300px);right:auto;width:600px;bottom:24px;border-radius:18px;border-bottom:1px solid var(--line);transform:translateY(20px);opacity:0;pointer-events:none}
  #sheet.on{transform:none;opacity:1;pointer-events:auto}}
#toast{position:fixed;left:50%;bottom:calc(var(--bar) + var(--sab) + 16px);transform:translate(-50%,10px);z-index:50;background:var(--cream);color:#1a1608;
  font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#F08A8A}
@media(min-width:900px){#toast{left:calc(var(--rail) + 50%);bottom:24px}}
.diag{font-size:13.5px}.diag .said{margin:0 0 10px;padding:8px 12px;border-left:2px solid rgba(240,138,138,.5);background:rgba(240,138,138,.07);font-style:italic;color:var(--text)}
.diag ul{margin:4px 0 12px;padding-left:18px}.diag li{margin:3px 0}.diag .ok{color:var(--good)}.diag .no{color:var(--bad)}
.diag h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);margin:12px 0 4px}

/* ---- HOME: the living cockpit (LANTERN.md sections 1, 2, 7 and 10) ----
   One picture first: the Lantern at the centre, its goals as rings of light
   around it, and the day moving across a horizon beneath. Everything the owner
   acts on is reachable from that picture, and every other part keeps the
   order section 1 names. The light is gold and gold only; each goal wears
   its own colour, given in a fixed order (the goals' own order, never their
   rank or state) from the palette of Islamic tilework and Mamluk enamel,
   muted so the drawing reads as one calm piece with the gold: lapis,
   emerald, pearl (the violet sheen of mother of pearl), saffron, turquoise
   and pomegranate, then two spares, olive and terracotta. No alarm red: red
   on this console means behind or failed, never a goal. Checked for colour
   blindness on this dark ground with the dataviz validator
   (validate_palette.js --mode dark, on #0B0D16, #11131F and #1a1a19): every
   adjacent pair 13.1 or more apart under protan and deutan simulation, 19.1
   or more under normal vision (19.3 among the six a day usually holds),
   every step 3:1 or better on the ground. A colour never speaks alone: each
   goal's row names its ring with its words, its numbers and its state.
   Motion is transform and opacity only, through the Web Animations API, and
   every loop stops while the page or Home is hidden. With reduced motion
   there is no loop, no count and no travel: a change simply appears. Every
   control is at least 44px tall; a desk of 1200px or more becomes a cockpit
   of three zones. */
#s-home{--g1:#4169B5;--g2:#2E8C60;--g3:#9D85C9;--g4:#BC8A2C;--g5:#2AA6B3;--g6:#A44C6E;--g7:#959B3D;--g8:#A0522F;--ember:#E07A52}
.sro{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hx{display:block}
.hz>*{margin-bottom:12px}
.hsec{display:flex;align-items:center;gap:8px;margin:26px 0 10px;min-height:28px}
.hsec h2{margin:0;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim)}
.hsec .cnt{font-family:var(--f-mono);font-size:10.5px;font-weight:500;min-width:22px;height:20px;padding:0 7px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.hsec .cnt.hot{background:rgba(233,200,106,.12);border-color:rgba(233,200,106,.45);color:var(--gold)}
.hsec .r{margin-left:auto;display:flex;gap:8px}
.hsec .r .btn{min-height:44px}
.hlink{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 2px 0 8px;color:var(--gold);font-weight:600;font-size:13px}
.hlink .chev{display:flex;color:var(--gold-dim)}
#s-home .btn{min-height:44px;position:relative;overflow:hidden}
.btn .bfill{position:absolute;inset:0;background:rgba(255,249,227,.22);transform:scaleX(0);transform-origin:left center;pointer-events:none}
.btn .wk{display:inline-flex;align-items:center;gap:8px}
.btn .wk i{display:block;width:16px;height:2px;border-radius:1px;background:currentColor;opacity:.7}
.hic{width:32px;height:32px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--gold);position:relative}
.hic svg,.hm svg,.heng svg,.link .hic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hic.owner{color:var(--blue)}.hic.machine{color:var(--muted)}.hic.bad{color:var(--bad)}.hic.good{color:var(--good)}
.hic .gd{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--gc);border:2px solid var(--panel)}
.hm{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.hm svg{width:14px;height:14px;margin-top:2px;color:var(--gold-dim);flex:0 0 auto}
.hm em{font-style:normal;color:var(--faint)}
.gdot{display:inline-block;flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--gc,var(--faint));margin-top:4px;box-shadow:0 0 0 3px rgba(255,255,255,.04),0 0 10px var(--gc,transparent)}
.hcf{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13.5px;line-height:1.5;color:var(--text)}
.hcf q{display:block;margin:0 0 6px;color:var(--cream);font-style:italic;quotes:none}
.hcf .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hcf .acts .btn{flex:1 1 auto}
.hcalm{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.hcalm b{display:block;color:var(--cream);font-weight:600;font-size:14.5px}
.hcalm span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.hfail{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid rgba(240,138,138,.32);border-radius:16px;padding:14px 16px;margin:0}
.hfail b{display:block;color:var(--cream);font-weight:600;font-size:14px;line-height:1.4}
.hfail span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.hfail .acts{margin-top:10px}
.state{display:inline-flex;align-items:center;gap:9px;min-height:34px;padding:0 14px 0 12px;border-radius:100px;font-size:13px;font-weight:600;
  border:1px solid var(--line2);color:var(--muted);background:var(--panel2);white-space:nowrap}
.state i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.state.good{color:var(--good);border-color:#2b4a37;background:rgba(142,212,155,.07)}
.state.wait{color:var(--wait);border-color:#4a3f1f;background:rgba(233,200,106,.07)}
.state.gold{color:var(--gold);border-color:#5a4a1f;background:rgba(233,200,106,.09)}
.state.bad{color:var(--bad);border-color:#4a2b2b;background:rgba(240,138,138,.08)}
/* needs-you is one sign: the state chip itself, a gold button that brings the desk up */
.state.jump{min-height:44px;gap:8px;padding:0 13px 0 14px;cursor:pointer;color:var(--cream);font-family:inherit;border-color:rgba(233,200,106,.6);
  background:linear-gradient(180deg,rgba(60,48,18,.94),rgba(36,29,12,.94));box-shadow:0 0 0 4px rgba(233,200,106,.08),0 8px 24px -8px rgba(233,200,106,.45)}
.state.jump i{background:var(--gold);box-shadow:0 0 8px rgba(233,200,106,.8)}
.state.jump .w{white-space:nowrap}
.state.jump b{color:var(--gold);font-family:var(--f-disp);font-size:16px;font-weight:600;line-height:1;margin-right:1px}
.state.jump svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.state.jump:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* the face of the cockpit: the greeting, the drawing, the state and the day */
.hface{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;border:1px solid rgba(233,200,106,.15);padding:18px 16px 6px;
  background:radial-gradient(70% 44% at 50% 38%,rgba(233,200,106,.12),rgba(233,200,106,0) 72%),
    radial-gradient(90% 60% at 0% 0%,rgba(126,155,209,.11),rgba(126,155,209,0) 62%),
    radial-gradient(80% 50% at 100% 100%,rgba(144,133,233,.08),rgba(144,133,233,0) 62%),
    linear-gradient(180deg,#14172B 0%,#0F1121 62%,#0C0E1A 100%);
  box-shadow:inset 0 1px 0 rgba(255,249,227,.06),0 24px 60px -30px rgba(0,0,0,.9)}
.hface::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:linear-gradient(180deg,rgba(255,249,227,.035),rgba(255,249,227,0) 22%)}
.hg{position:relative;z-index:2;display:flex;align-items:flex-start;gap:12px}
.hg .who{flex:1;min-width:0}
.hg .sal{margin:0;font-family:var(--f-disp);font-weight:500;font-size:25px;line-height:1.12;color:var(--cream);letter-spacing:-.01em}
.hg .dt{margin:6px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45}
.hg .dt .hj{color:var(--gold-dim)}
.hg .upd{flex:0 0 auto;margin-top:5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;color:var(--faint);white-space:nowrap}
.orb{position:relative;width:min(300px,100%);aspect-ratio:1/1;margin:8px auto 0;z-index:1}
.orb .lat{position:absolute;inset:-30%;opacity:.11;pointer-events:none;will-change:transform;-webkit-mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,.55) 46%,transparent 68%);mask-image:radial-gradient(circle,#000 22%,rgba(0,0,0,.55) 46%,transparent 68%)}
.orb .lat svg{display:block;width:100%;height:100%}
.orb .light{position:absolute;inset:0;pointer-events:none;will-change:transform,opacity}
.orb .halo{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.34) 0%,rgba(233,200,106,.15) 28%,rgba(233,200,106,.05) 52%,rgba(233,200,106,0) 70%)}
.orb .core{position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle,#FFFBEA 0%,#F7E19A 20%,rgba(233,200,106,.58) 40%,rgba(233,200,106,.14) 62%,rgba(233,200,106,0) 74%)}
.orb .star{position:absolute;inset:43.5%}
.orb .star svg{display:block;width:100%;height:100%}
.orb .rip{position:absolute;inset:38%;border-radius:50%;border:2px solid rgba(250,222,150,.95);box-shadow:0 0 22px rgba(233,200,106,.45),inset 0 0 14px rgba(233,200,106,.3);opacity:0;pointer-events:none;will-change:transform,opacity}
.orb svg.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rings .tr{fill:none;stroke-opacity:.16;stroke-linecap:round}
.rings .nw{fill:none}
.rings .pj{fill:none;stroke-opacity:.34}
.rings .hl{fill:none;stroke-opacity:.22;opacity:0;stroke-linecap:round}
.rings .tg{stroke:#FFF9E3;stroke-opacity:.62;stroke-width:1.6;stroke-linecap:round;fill:none}
.rings .hit{fill:none;stroke:transparent;pointer-events:stroke;cursor:pointer}
.rings .rg{outline:none}
.rings .rg:focus-visible .hit{stroke:rgba(255,249,227,.16)}
.rings .rg.nodata .tr{stroke-dasharray:2 7;stroke-opacity:.34}
.orb.paused .light{transform:scale(.6)}
.orb.paused .halo{opacity:.35;background:radial-gradient(circle,rgba(240,150,100,.30) 0%,rgba(224,122,82,.12) 32%,rgba(224,122,82,0) 66%)}
.orb.paused .core{background:radial-gradient(circle,#FFE2C4 0%,#F0A36E 20%,rgba(224,122,82,.55) 40%,rgba(224,122,82,.12) 62%,rgba(224,122,82,0) 74%)}
.orb.paused .star{opacity:.45}
.orb.paused svg.rings{filter:grayscale(1);opacity:.5}
.orb.dim .light{opacity:.35}
/* the state and Pause stand in the opening at the foot of the rings, under the light */
.hst2{position:relative;z-index:2;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-top:-30px}
.hst2 .sp{flex:1 1 auto}
.hst2 .btn{min-height:44px;padding:0 18px;font-size:13px}
.hface .pz{position:relative;z-index:2;margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.hface .hcf{position:relative;z-index:2}
/* the day across the horizon */
.hzn{position:relative;z-index:2;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,249,227,.07)}
.hzn .hh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hzn .hh b{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim)}
.hzn .hh span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.hzn .hh span.bad{color:var(--ember)}
.hzn .ln{position:relative;height:58px;margin:2px 8px 0;cursor:pointer;touch-action:manipulation;outline:none;border-radius:10px}
.hzn .ln:focus-visible{box-shadow:0 0 0 2px rgba(233,200,106,.55)}
.hzn .rail{position:absolute;left:0;right:0;top:26px;height:2px;border-radius:1px;background:rgba(255,249,227,.10)}
.hzn .past{position:absolute;left:0;right:0;top:26px;height:2px;border-radius:1px;transform-origin:left center;
  background:linear-gradient(90deg,rgba(233,200,106,.15),rgba(233,200,106,.75))}
.hzn .pt{position:absolute;top:20px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:1.5px solid var(--faint);background:#0E1020;pointer-events:none}
.hzn .pt.sent{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,200,106,.12),0 0 14px rgba(233,200,106,.65)}
.hzn .pt.partial{background:linear-gradient(90deg,var(--gold) 50%,#0E1020 50%);border-color:var(--gold);box-shadow:0 0 10px rgba(233,200,106,.35)}
.hzn .pt.failed{background:var(--ember);border-color:var(--ember);box-shadow:0 0 12px rgba(224,122,82,.7)}
.hzn .pt.due{border-color:var(--gold);border-width:2px}
.hzn .pt.later{border-color:#7A86A3}
.hzn .pt.skipped{border-color:var(--line2);background:#0E1020}
.hzn .pt.skipped::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:1.5px;margin-top:-.75px;background:var(--muted);transform:rotate(-35deg)}
.hzn .pt.sel{box-shadow:0 0 0 4px rgba(255,249,227,.22),0 0 0 6px rgba(255,249,227,.08)}
.hzn .pt.sent.sel{box-shadow:0 0 0 4px rgba(255,249,227,.28),0 0 16px rgba(233,200,106,.7)}
.hzn .tk{position:absolute;top:42px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.02em;color:var(--faint);transform:translateX(-50%);pointer-events:none}
.hzn .now{position:absolute;left:0;top:4px;bottom:20px;width:100%;pointer-events:none}
.hzn .now::before{content:"";position:absolute;left:-.75px;top:8px;bottom:0;width:1.5px;border-radius:1px;background:linear-gradient(180deg,rgba(255,249,227,.95),rgba(255,249,227,.15))}
.hzn .now i{position:absolute;left:0;top:0;transform:translateX(-50%);font-style:normal;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream);line-height:1}
.hzn .cap{display:flex;align-items:center;gap:6px 10px;min-height:44px;margin:0 0 2px;font-size:13px;line-height:1.4;color:var(--text)}
.hzn .cap .t{flex:1;min-width:0;overflow-wrap:anywhere}
.hzn .cap .t em{font-style:normal;color:var(--faint)}
.hzn .cap a{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--gold);font-weight:600;font-size:12.5px}
.hzn .cap a .chev{display:flex;color:var(--gold-dim)}
.hzn .none{margin:8px 0 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
/* the goals, under the drawing: each ring by its name, its numbers, its
   state and a thin bar in its colour; a tap opens the goal at length */
.lgd{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px}
.lgd .lr{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:52px;padding:10px 10px 11px;border-radius:12px;text-align:left}
.lgd .lr .sw{margin-top:1px;flex:0 0 auto}
.lgd .tx{flex:1;min-width:0}
.lgd .l2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.lgd .lr:hover,.lgd .lr.on,.lgd .lr:focus-visible{background:var(--panel2)}
.lgd .sw,.gsh .sw{width:18px;height:18px;display:block}
.lgd .nm{display:block;font-size:13.5px;line-height:1.35;color:var(--text);overflow-wrap:anywhere}
.lgd .nv{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.lgd .nv b{color:var(--cream);font-weight:500}
.lgd .lbar{position:relative;display:block;height:3px;margin:10px 0 1px;border-radius:2px;overflow:hidden;background:rgba(255,249,227,.07)}
.lgd .lbar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:2px;background:var(--gc);transform-origin:left center}
.lgd .lbar s{position:absolute;top:0;bottom:0;background:var(--gc);opacity:.36}
.lgd .lbar.none{background:repeating-linear-gradient(90deg,rgba(255,249,227,.16) 0 2px,transparent 2px 7px)}
/* the brief */
.brief{border-radius:18px;padding:18px 18px 0;margin:0;background:linear-gradient(180deg,rgba(233,200,106,.045),rgba(233,200,106,0) 120px),var(--panel)}
.brief .lab{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim)}
.brief .at{margin-top:3px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--faint)}
.brief .lab .old{color:var(--wait)}
.brief .lab button{margin-left:auto;font-family:var(--f-body);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--gold);font-weight:600;min-height:44px;margin-top:-12px;margin-bottom:-12px;padding:0 2px}
.brief .say{margin:12px 0 0;font-family:var(--f-disp);font-size:18.5px;line-height:1.6;color:var(--cream);font-weight:500;overflow-wrap:anywhere}
.brief .say+.say{margin-top:10px}
.brief .none{margin:12px 0 4px;color:var(--muted);font-size:14px;line-height:1.55}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 0}
.kpis.n1{grid-template-columns:minmax(0,1fr)}.kpis.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;min-width:0}
.kpi .v{font-family:var(--f-disp);font-size:25px;font-weight:600;line-height:1.1;color:var(--cream);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kpi .l{margin-top:5px;font-size:10px;line-height:1.35;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;overflow-wrap:anywhere}
.kpi .d{margin-top:7px;font-family:var(--f-mono);font-size:11px;line-height:1.3}
.kpi .d.up{color:var(--good)}.kpi .d.dn{color:var(--bad)}.kpi .d.na{color:var(--faint)}
.kpi .spk{position:relative;height:26px;margin:9px 2px 0}
.kpi .spk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kpi .spk path{fill:none;stroke:rgba(233,200,106,.7);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.kpi .spk i{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(233,200,106,.8)}
.kpi .spk .cv{position:absolute;top:-4px;bottom:-4px;left:-4px;right:-6px;background:var(--panel2);transform-origin:right center}
.kpi .spk.nil{height:auto;font-size:10.5px;color:var(--faint);font-family:var(--f-mono)}
.brief .cap{margin:8px 0 0;font-size:11.5px;color:var(--faint)}
.brief .go{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;margin:14px 0 0;border-top:1px solid var(--line);color:var(--gold);font-weight:600;font-size:13.5px;text-align:left}
.brief .go .chev{margin-left:auto;color:var(--gold-dim);display:flex}
/* the desk */
.dcs{display:flex;flex-direction:column;gap:10px}
.dc{position:relative;border:1px solid rgba(233,200,106,.38);border-radius:16px;padding:16px;
  background:linear-gradient(180deg,rgba(233,200,106,.06),rgba(233,200,106,0) 80px),var(--panel)}
/* a card that is hovered or focused on a desk is ringed in its goal's colour: an opacity, nothing else */
.dc::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1.5px solid var(--gc,var(--gold));box-shadow:0 0 18px -6px var(--gc,var(--gold));opacity:0;transition:opacity .25s;pointer-events:none}
.dc.lit::after{opacity:1}
.dc .k{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:11.5px;color:var(--faint)}
.dc h3{margin:10px 0 0;font-size:16px;line-height:1.4;font-weight:600;color:var(--cream);overflow-wrap:anywhere}
.dc .why{margin:5px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere}
.dc .meta{margin:10px 0 0;display:flex;flex-direction:column;gap:5px}
.dc .opts,.dc .drf{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dc .opts .btn,.dc .drf .btn{flex:1 1 auto}
.dc .drf{margin-top:12px}
.dc .dft{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px dashed var(--line2);font-size:12.5px;color:var(--muted);line-height:1.5}
.dc .dft b{color:var(--text);font-weight:600}
.dc .warn{margin:10px 0 0;font-size:12.5px;color:var(--wait)}
ol.hsteps{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--text)}
ol.hsteps li{margin:3px 0;overflow-wrap:anywhere}
.drafttx{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.6;color:var(--text);max-height:46svh;overflow:auto}
/* Done and Ideas: one card each, rows divided by a hairline */
.hlist{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:2px 16px}
.hday{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:14px 0 2px}
.hrow{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.hlist>.hrow:first-child,.hday+.hrow{border-top:0}
.hrow .x{flex:1;min-width:0}
.hrow .x b{display:block;color:var(--cream);font-weight:600;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.hrow .x .dd{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:2px;overflow-wrap:anywhere}
.hrow .x .m{display:block;color:var(--faint);font-size:11.5px;line-height:1.45;margin-top:4px;overflow-wrap:anywhere}
.hrow .x .m .no{color:var(--bad)}
.hrow .x .m.g{margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .u{flex:0 0 auto;align-self:center}
.hrow .u .btn{min-height:44px;padding:0 14px}
.hrow .hcf{margin-top:10px}
.hrow .glw{position:absolute;inset:2px -10px;border-radius:12px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(233,200,106,.20),rgba(233,200,106,.06) 70%,rgba(233,200,106,0));box-shadow:inset 2px 0 0 rgba(233,200,106,.75)}
.hrow.fresh .nl{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);vertical-align:1px}
@media(prefers-reduced-motion:reduce){.hrow.fresh .glw{opacity:.6}}
.hmore{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;font-size:13px}
/* Next: a timeline on a thin line of light */
.tl{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 16px 8px 40px}
.tl::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;border-radius:1px;
  background:linear-gradient(180deg,rgba(233,200,106,.75),rgba(233,200,106,.28) 45%,rgba(233,200,106,.06))}
.tl .hday{position:relative;padding:16px 0 2px}
.tl .hday::before{content:"";position:absolute;left:-24px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--gold-dim)}
.tl .hday.now::before{border-color:var(--gold);box-shadow:0 0 10px rgba(233,200,106,.6)}
.hnx{position:relative;padding:12px 0 13px;border-top:1px solid var(--line)}
.tl>.hnx:first-child,.hday+.hnx{border-top:0}
.hnx::before{content:"";position:absolute;left:-21px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--gc,var(--gold-dim));box-shadow:0 0 8px var(--gc,transparent)}
.hnx.blocked::before{background:var(--ember);box-shadow:0 0 8px rgba(224,122,82,.6)}
.hnx b{display:block;color:var(--cream);font-weight:600;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.hnx .why{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}
.hnx .meta{margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.hnx .bl{margin:8px 0 0;font-size:12.5px;color:var(--wait);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.hnx .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hnx .acts .btn{flex:1 1 auto;white-space:nowrap;padding:0 14px}
.btn.ghost.gold{color:var(--gold);border-color:var(--gold-dim)}
.hcal{padding:4px 0 6px}
.hcal .c{position:relative;display:flex;gap:12px;align-items:baseline;padding:7px 0;font-size:13.5px;color:var(--text);overflow-wrap:anywhere}
.hcal .c::before{content:"";position:absolute;left:-20px;top:13px;width:4px;height:4px;border-radius:50%;background:var(--gold-dim)}
.hcal .c code{flex:0 0 76px;background:none;border:0;padding:0;color:var(--gold-dim);font-size:11px}
.tl .empty{padding:12px 0;color:var(--muted);font-size:13px}
/* ideas */
.hidea{position:relative;padding:16px 0;border-top:1px solid var(--line)}
.hidea:first-child{border-top:0}
.hidea .k{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hidea b{display:block;margin-top:8px;color:var(--cream);font-weight:600;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.hidea .why{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.hidea .hm{margin-top:8px}
.hidea .hstl{margin:10px 0 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.hidea ol.hsteps{margin-top:4px}
.hidea .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hidea .acts .btn{flex:1 1 auto}
.hidea.aside{opacity:.66}
.hidea.went .k .pill.gold{box-shadow:0 0 12px rgba(233,200,106,.35)}
.hidea .lay{position:absolute;inset:4px -10px;border-radius:14px;pointer-events:none;opacity:0;background:radial-gradient(120% 90% at 20% 0%,rgba(233,200,106,.22),rgba(233,200,106,0) 70%);box-shadow:inset 0 0 0 1px rgba(233,200,106,.4)}
.hidea .whr{margin:10px 0 0;font-size:12.5px;color:var(--gold);display:flex;gap:8px;align-items:flex-start}
/* keeping the lamp lit: a glass lamp hanging in its niche, its light rising */
.lamp{background:radial-gradient(90% 70% at 18% 30%,rgba(233,200,106,.09),rgba(233,200,106,0) 60%),var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.lamp .top{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:center}
.lamp .lp{position:relative;width:100px;height:117px}
.lamp .lp svg{display:block;width:100%;height:100%;overflow:visible}
.lamp .fl{transform-box:fill-box;transform-origin:50% 100%}
.lamp .glo{transform-box:fill-box;transform-origin:50% 50%}
.lamp.cold .lp{opacity:.55}
.lamp .big{font-family:var(--f-disp);font-size:34px;font-weight:600;line-height:1;color:var(--cream);font-variant-numeric:tabular-nums}
.lamp .bl2{margin-top:4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.lamp .dl{margin-top:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lamp .dl.up{color:var(--good)}.lamp .dl.dn{color:var(--bad)}
.lamp .cov{margin:12px 0 0;font-size:13.5px;line-height:1.5;color:var(--text)}
.lamp .rows{margin:10px 0 0;border-top:1px solid var(--line)}
.lamp .rw{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.lamp .rw b{color:var(--cream);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lamp .rw b small{color:var(--faint);font-weight:400;font-size:11.5px}
.lamp .did{margin:10px 0 0}
.lamp .spk2{position:relative;height:24px;margin:8px 0 0}
.lamp .spk2 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lamp .spk2 path{fill:none;stroke:rgba(233,200,106,.6);stroke-width:1.5;vector-effect:non-scaling-stroke}
.lamp .say{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.lamp .say.warn{color:var(--wait)}
/* the Lantern's mail (LANTERN.md 11.4): today's numbers, the first ten
   letters he approves, the outreach toward fifty places, the last few
   things it did, and the door to the Mail room */
.mailc{background:linear-gradient(180deg,rgba(126,155,209,.06),rgba(126,155,209,0) 110px),var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 16px 0}
.mailc.setup,.mailc.fail{padding-bottom:16px}
.mailc .mtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mailc .mtop .state{min-height:30px;font-size:12.5px;white-space:normal}
.mnums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:14px 0 0}
.mn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;text-align:center;min-width:0}
.mn b{display:block;font-family:var(--f-disp);font-size:22px;font-weight:600;line-height:1.1;color:var(--cream);font-variant-numeric:tabular-nums}
.mn span{display:block;margin-top:4px;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;line-height:1.25}
/* on a phone a tile is narrow: the words stay whole, in small letters */
@media(max-width:519px){.mn span{text-transform:none;letter-spacing:0;font-size:10.5px;font-weight:500}}
.mn.hot{border-color:rgba(233,200,106,.38)}.mn.hot b{color:var(--gold)}
.mten,.mout{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.pips{display:grid;grid-template-columns:repeat(10,8px);gap:4px;flex:0 0 auto}
.pips i{display:block;width:8px;height:8px;border-radius:50%;border:1px solid var(--gold-dim)}
.pips i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(233,200,106,.5)}
.mten p,.mout p{margin:0;flex:1;min-width:0;font-size:13px;line-height:1.45;color:var(--text)}
.mten p b,.mout p b{color:var(--cream);font-weight:600}
.mout p span{display:block;color:var(--muted);font-size:12.5px}
.mout svg{width:44px;height:44px;flex:0 0 auto;overflow:visible}
.mlast{margin:12px 0 0;padding:4px 0 0;border-top:1px solid var(--line)}
.mlast .ml{display:flex;gap:10px;align-items:baseline;padding:6px 0;font-size:13px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.mlast .ml code{flex:0 0 auto;min-width:52px;background:none;border:0;padding:0;color:var(--gold-dim);font-size:11px}
.mailc .go{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;margin:12px 0 0;border-top:1px solid var(--line);color:var(--gold);font-weight:600;font-size:13.5px;text-align:left}
.mailc .go .chev{margin-left:auto;color:var(--gold-dim);display:flex}
.mailc .hcalm{background:none;border:0;padding:0}
.mailc .acts{margin-top:14px}
.mailc .acts .btn{flex:1 1 auto}
/* round six: the day's pace under the outreach, one quiet line (a gentle
   warning when it is braked), and the day the outreach was started */
.mpace{margin:8px 0 0 56px}
.mpace p{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.mpace p+p{margin-top:4px}
.mpace .mpw{display:flex;gap:7px;align-items:flex-start;color:var(--wait)}
.mpace .mpw svg{width:14px;height:14px;margin-top:2px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mpace .mst{color:var(--faint)}
/* the one time start: a gold button with the lamp, and what it does, once */
.mstart{margin:14px 0 0;padding:14px;border-radius:14px;border:1px solid rgba(233,200,106,.34);
  background:radial-gradient(110% 90% at 0% 0%,rgba(233,200,106,.12),rgba(233,200,106,0) 62%),var(--panel2)}
#s-home .mstart .ostart{width:100%;min-height:50px;font-size:14.5px;gap:10px;box-shadow:0 0 0 4px rgba(233,200,106,.08),0 10px 26px -12px rgba(233,200,106,.55)}
.mstart .ostart svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mstart p{margin:10px 2px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.mstart-why{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--faint);overflow-wrap:anywhere}
/* the run, live, inside the card: three steps on a thin line of light, each
   with its state, its seconds and what it found; nothing covers the Home */
.orun{position:relative;margin:14px 0 0;padding:14px 14px 10px;border-radius:14px;border:1px solid rgba(233,200,106,.3);
  background:radial-gradient(120% 80% at 0% 0%,rgba(233,200,106,.09),rgba(233,200,106,0) 60%),var(--panel2)}
.orun .orh{display:flex;gap:10px;align-items:flex-start}
.orun .orh .hic{width:30px;height:30px;background:rgba(233,200,106,.1)}
.orun:focus{outline:none}
.orun:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.orun .orh .ort{min-width:0}
.orun .orh b{display:block;color:var(--cream);font-weight:600;font-size:14.5px;line-height:1.35}
.orun .orh .ort span{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.ors{list-style:none;margin:14px 0 0;padding:0}
.ost{position:relative;display:flex;gap:12px;padding:0 0 14px}
.ost:last-child{padding-bottom:4px}
.ost:not(:last-child)::before{content:"";position:absolute;left:8px;top:22px;bottom:2px;width:2px;border-radius:1px;background:rgba(255,249,227,.08)}
.ost[data-state="done"]:not(:last-child)::before{background:linear-gradient(180deg,rgba(233,200,106,.7),rgba(233,200,106,.25))}
.osd{position:relative;flex:0 0 18px;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center}
.osd i{position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(233,200,106,.75);opacity:0;pointer-events:none}
.osd svg{width:11px;height:11px;stroke:#1a1608;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.ost[data-state="work"] .osd{border-color:var(--gold);background:radial-gradient(circle,#FFF6D6 0%,#F2D27A 42%,rgba(233,200,106,.25) 78%);box-shadow:0 0 12px rgba(233,200,106,.55)}
.ost[data-state="done"] .osd{border-color:var(--gold);background:var(--gold)}
.ost[data-state="done"] .osd svg{display:block}
.ost[data-state="fail"] .osd{border-color:var(--ember);background:rgba(224,122,82,.25)}
.osx{flex:1;min-width:0}
.osh{display:flex;align-items:baseline;gap:10px;min-height:20px}
.osh b{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.ost[data-state="work"] .osh b,.ost[data-state="done"] .osh b,.ost[data-state="fail"] .osh b{color:var(--cream)}
.ose{flex:0 0 auto;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;color:var(--faint);white-space:nowrap}
.ost[data-state="work"] .ose{color:var(--gold-dim)}
.osl{list-style:none;margin:3px 0 0;padding:0}
.osl li{font-size:12.5px;line-height:1.5;color:var(--muted);padding:2px 0;overflow-wrap:anywhere}
.osl li.ok{color:var(--text)}
.osl li.warn{color:var(--wait)}
.osv{margin:3px 0 0;font-size:12.5px;line-height:1.5;color:var(--text);overflow-wrap:anywhere}
.osv:empty{display:none}
.osv em{font-style:normal;color:var(--faint)}
.olt{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.olt li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45;color:var(--text)}
.olt li i{flex:0 0 7px;width:7px;height:7px;border-radius:50%;border:1px solid var(--gold-dim);transform:translateY(-1px)}
.olt li[data-ls="read"] i{background:rgba(233,200,106,.45)}
.olt li[data-ls="done"] i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(233,200,106,.55)}
.olt li[data-ls="no"] i{border-color:var(--faint);background:none}
.olt li span{flex:1;min-width:0;overflow-wrap:anywhere}
.olt li em{flex:0 0 auto;font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.olt li[data-ls="done"] em{color:var(--gold-dim)}
.orf{margin:4px 0 6px;padding:10px 12px;border-radius:10px;border-left:2px solid rgba(240,138,138,.6);background:rgba(240,138,138,.07);font-size:13px;line-height:1.5;color:var(--text);overflow-wrap:anywhere}
.orf .acts,.ore .acts,.olh .acts{margin-top:8px}
.ore{margin:2px 0 6px;padding:10px 12px;border-radius:10px;border:1px solid rgba(233,200,106,.3);background:rgba(233,200,106,.06);font-size:13px;line-height:1.5;color:var(--cream);overflow-wrap:anywhere}
.olh{margin:6px 0 0;padding:10px 12px;border-radius:10px;background:rgba(126,155,209,.08);border:1px solid rgba(126,155,209,.28);font-size:13px;line-height:1.5;color:var(--text)}
.olh .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(180deg)}
/* the Lantern's voice on Telegram (round four): while it is not linked, why
   it matters and the way to link it; once linked, one quiet line */
.hvoice{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 16px;text-align:left}
.hvoice .x{flex:1;min-width:0}
.hvoice .x b{display:block;color:var(--cream);font-weight:600;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.hvoice .x span{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:2px}
.hvoice .btn{flex:0 0 auto;min-height:44px;padding:0 14px}
.hvoice.line{min-height:52px;border-style:dashed;border-color:var(--line2);background:none;padding:6px 12px 6px 14px}
.hvoice.line .x b{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--text)}
.hvoice.line .x b em{font-style:normal;color:var(--wait)}
.hvoice.line .chev{color:var(--faint);display:flex}
.hvoice .hic{width:34px;height:34px}
/* the mail sheet: a message the judge sorted on its own */
.mjudge{margin:8px 0 0;padding:6px 10px;border-left:2px solid var(--gold-dim);background:var(--panel2);border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
/* a letter waiting for his yes: the whole email, as text, never markup */
.dc .ltr,.msh .ltr{margin:12px 0 0;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,rgba(255,249,227,.035),rgba(255,249,227,0) 70px),var(--ink)}
.dc .ltr .lh,.msh .ltr .lh{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45}
.dc .ltr .lk,.msh .ltr .lk{flex:0 0 58px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.dc .ltr .lv,.msh .ltr .lv{flex:1;min-width:0;color:var(--text);overflow-wrap:anywhere}
.dc .ltr .lv .ad,.msh .ltr .lv .ad{display:inline-block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.dc .ltr .lv.sj,.msh .ltr .lv.sj{color:var(--cream);font-weight:600}
.dc .ltr .lt,.msh .ltr .lt{padding:12px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;color:var(--text)}
.dc .ften{color:var(--gold-dim)}
/* a sent email in Done: no Undo (an email cannot be unsent), its door to Gmail */
.hrow .u .hlink{padding:0 4px;font-size:12.5px}
/* ask, and the door to the engine room */
.hask{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.hask .lant-in textarea{min-height:48px}
.hask .lant-in .go{min-height:48px}
.hask .sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hask .sugs button{min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:22px;padding:0 15px;font-size:12.5px;color:var(--text);text-align:left;line-height:1.35}
.hask .sugs button:active{border-color:var(--line2)}
.heng{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;margin:6px 0 0;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);text-align:left}
.heng .hic{background:none;border:1px solid var(--line);color:var(--muted)}
.heng b{display:block;color:var(--text);font-weight:600;font-size:14px}
.heng span.s{display:block;font-size:12px;color:var(--faint);line-height:1.45;margin-top:2px}
.heng span.s.live{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.heng .chev{margin-left:auto;color:var(--faint);display:flex}
#s-home.failed .hdata{display:none}
/* the light that travels to Done */
.hfly{position:fixed;z-index:45;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#FFFBEA 0%,#F2D27A 40%,rgba(233,200,106,0) 72%);box-shadow:0 0 18px 6px rgba(233,200,106,.55)}
/* a goal at length, in its sheet (a panel on a desk) */
.gsh .gh{display:flex;gap:10px;align-items:flex-start}
.gsh .gh .sw{width:22px;height:22px;margin-top:2px}
.gsh .tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.gsh .gn{margin:12px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gsh .gn b{font-family:var(--f-disp);font-size:24px;color:var(--cream);font-weight:600;margin-right:4px}
.gsh .ch{position:relative;margin:14px 0 4px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 6px 4px}
.gsh .ch svg{display:block;width:100%;overflow:visible}
.gsh .ch .gl{stroke:rgba(255,255,255,.06);stroke-width:1}
.gsh .ch .yl{fill:var(--faint);font-family:var(--f-mono);font-size:10px}
.gsh .ch .xl{fill:var(--faint);font-family:var(--f-mono);font-size:10px}
.gsh .ch .hs{fill:none;stroke:var(--gc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gsh .ch .pjl{fill:none;stroke:var(--gc);stroke-width:2;stroke-dasharray:5 5;opacity:.55}
.gsh .ch .tgl{stroke:#FFF9E3;stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:3 4}
.gsh .ch .tgt{fill:#FFF9E3;fill-opacity:.75;font-family:var(--f-mono);font-size:10px}
.gsh .ch .tdl{stroke:rgba(255,249,227,.35);stroke-width:1}
.gsh .ch .tdt{fill:var(--cream);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em}
.gsh .ch .lp{fill:var(--gc);stroke:var(--panel2);stroke-width:2}
.gsh .ch .xh{stroke:rgba(255,249,227,.4);stroke-width:1;opacity:0}
.gsh .ch .xd{fill:var(--cream);opacity:0}
/* the reading under the pointer: drawn inside the plot, above its point, or under it near the top */
.gsh .ch .tipg{pointer-events:none;opacity:0}
.gsh .ch .tipb{fill:var(--ink);stroke:var(--line2);stroke-width:1}
.gsh .ch .tipt{fill:var(--cream);font-family:var(--f-mono);font-size:11px}
.gsh .ch .nil{padding:24px 12px;color:var(--muted);font-size:13px;text-align:center}
.gsh .gp{margin:10px 0 0;font-size:14px;line-height:1.55;color:var(--text)}
.gsh h3{margin:18px 0 6px;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim)}
.gsh .sv{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--text)}
.gsh .sv:first-of-type{border-top:0}
.gsh .sv em{font-style:normal;color:var(--faint);font-family:var(--f-mono);font-size:11px;flex:0 0 auto;min-width:64px}
.gsh table{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:11.5px}
.gsh td{padding:4px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.gsh td+td{text-align:right;color:var(--cream)}
#sheet.wide .gsh .ch{margin-left:0;margin-right:0}
/* the toast that carries an Undo */
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:5px 5px 5px 16px;text-align:left;width:min(calc(100% - 32px),440px);justify-content:space-between}
#toast .tact{min-height:44px;padding:0 16px;border-radius:8px;background:#1a1608;color:var(--cream);font-weight:700;font-size:13px;flex:0 0 auto}
@media(prefers-reduced-motion:reduce){#sheet,#veil,#toast{transition:none!important}#s-home *,#s-home *::before,#s-home *::after,#s-mail *,#s-mail *::before,#s-mail *::after{transition:none!important;animation:none!important}}
@media(min-width:600px){.orb{width:min(340px,100%)}}
@media(min-width:900px){#sheet.wide{left:calc(var(--rail) + 50% - 380px);width:760px}}
@media(min-width:1200px){
  body[data-surf="home"] main{max-width:calc(1240px + var(--rail))}
  #s-home.desk .hx{display:grid;grid-template-columns:392px minmax(0,1fr) 300px;gap:0 24px;align-items:start}
  #s-home.desk .hz>.hdata:first-child>.hsec:first-child,#s-home.desk .hz>section:first-child>.hsec:first-child{margin-top:2px}
  .orb{width:min(360px,100%)}
  .hface{padding:20px 18px 8px}
}
/* the tabs inside Posts and Numbers, and the scorecard door above Numbers */
.tabs{margin:0 0 16px}
.tabs button{min-height:44px;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs .tn{font-family:var(--f-mono);font-size:10.5px;min-width:20px;height:18px;padding:0 6px;border-radius:100px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.tabs .tn:empty{display:none}
/* ---- THE MAIL ROOM (LANTERN.md 11.4): the switch with the caps, then the
   inbox the Lantern handled, the places it writes to, and do not contact.
   Every tap target is a thumb's size; an address is shown here as text and
   never put in a link. */
#s-mail .back{min-height:44px}
#s-mail .btn{min-height:44px}
.msw{background:linear-gradient(180deg,rgba(233,200,106,.05),rgba(233,200,106,0) 90px),var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 16px 16px;margin:12px 0 0}
.msw.off{background:var(--panel)}
.mswb{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;text-align:left}
.mswb .mswt{flex:1;min-width:0}
.mswb .mswt b{display:block;color:var(--cream);font-weight:600;font-size:15px;line-height:1.35}
.mswb .mswt span{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.mswb .sw{display:block}
.mswb .sw::after{transition:transform .16s ease}
.mswb[aria-checked="true"] .sw{background:rgba(233,200,106,.2);border-color:var(--gold-dim)}
.mswb[aria-checked="true"] .sw::after{transform:translateX(21px);background:var(--gold)}
.msw .hcf{margin-top:8px}
.msw .mnone{display:flex;gap:12px;align-items:flex-start;padding:10px 0 0}
.msw .mnone b{display:block;color:var(--cream);font-weight:600;font-size:15px}
.msw .mnone span{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:2px}
.mcaps{margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.55}
.mcaps b{color:var(--text);font-weight:600}
.msw .mnums{margin-top:12px}
.msw .mten{margin-top:12px}
#s-mail .tabs{margin:16px 0 14px}
#s-mail .seg button{padding:10px 4px}
.mfil{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
/* on a phone a row of filters is one line that slides under the thumb, its far edge fading */
@media(max-width:599px){.mfil.slide{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:24px;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
  .mfil.slide::-webkit-scrollbar{display:none}.mfil.slide button{flex:0 0 auto;white-space:nowrap}}
.mfil button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.mfil button.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(233,200,106,.08)}
.mfil button .n{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.mfil button.on .n{color:var(--gold-dim)}
.mfil select.fi{width:auto;min-width:0;max-width:100%;min-height:44px;padding:8px 34px 8px 12px;font-size:16px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
#s-mail .list>.row{width:100%;text-align:left}
#s-mail .row .t>b{white-space:normal;overflow-wrap:anywhere}
#s-mail .row .r .pill{margin-left:6px}
.mstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 12px}
.mstrip .mn b{font-size:20px}
.mprog{position:relative;height:4px;border-radius:2px;background:rgba(255,249,227,.08);overflow:hidden;margin:0 0 14px}
.mprog i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:2px;background:var(--gc,var(--gold));transform-origin:left center}
.mdadd{display:flex;gap:8px;align-items:stretch;margin:0 0 12px}
.mdadd .fi{flex:1;min-width:0;min-height:44px}
.mdadd .btn{flex:0 0 auto}
.mdrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px}
.mdrow .mdt{display:flex;align-items:center;gap:10px}
.mdrow .mdt .t{flex:1;min-width:0}
.mdrow .mdt .t b{display:block;color:var(--cream);font-weight:600;font-size:14px;font-family:var(--f-mono);overflow-wrap:anywhere}
.mdrow .mdt .t span{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.mdrow .hcf{margin-top:10px}
/* a thread or a place at length, in its sheet */
.msh h3{margin:18px 0 6px;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim)}
.msh .msg{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.msh .kv{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.msh .kv:first-of-type{border-top:0}
.msh .kv em{flex:0 0 112px;font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.msh .kv span,.msh .kv a{flex:1;min-width:0;overflow-wrap:anywhere}
.msh .kv a{display:inline-flex;align-items:center;gap:5px;min-height:44px}
.msh .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.msh .ad{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.msh .btn{min-height:44px}
.msh .hist{margin:0;padding:0;list-style:none}
.msh .hist li{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.msh .hist li:first-child{border-top:0}
.msh .hist code{flex:0 0 auto;background:none;border:0;padding:0;color:var(--gold-dim);font-size:11px;min-width:64px}
/* round six: the day's pace at the top of the room, in place of the old caps */
.mpc{margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.mpc .mpct{margin:0;font-size:13.5px;line-height:1.5;color:var(--text)}
.mpc .mpct b{color:var(--cream);font-weight:600}
.mpc .mprog{margin:8px 0 8px}
.mpc .mprog s{position:absolute;top:0;bottom:0;background:var(--gold);opacity:.32;transform-origin:left center;text-decoration:none}
.mpc .mpcl{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere}
.mpc .mpcw{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere;display:flex;gap:7px;align-items:flex-start}
.mpc .mpcw.warn{color:var(--wait)}
.mpc .mpcw svg{width:14px;height:14px;margin-top:2px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* a place's row: its letter set for later, or an address that bounced */
#s-mail .row .t>span.mrw{white-space:normal;color:var(--blue);font-size:12px;margin-top:1px}
#s-mail .row .t>span.mrw.bad{color:var(--wait)}
#s-mail .row .r .pill+.pill{margin-left:4px}
.msh .mnote{margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--text);overflow-wrap:anywhere}
.msh .mnote.later{color:var(--blue)}
.msh .mnote.bad{color:var(--wait)}
.msh .mnote.done{color:var(--good)}
/* the inbox that moves: what needs him, what is done; the calm when nothing waits */
.mcalm{margin:0 0 4px}
.msh .mfail{margin:12px 0 0;padding:9px 12px;border-radius:10px;border-left:2px solid rgba(240,138,138,.6);background:rgba(240,138,138,.07);font-size:13px;line-height:1.5;color:var(--text);overflow-wrap:anywhere}
.msh .mwrite{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:10px 12px;border-radius:10px;background:rgba(233,200,106,.07);border:1px solid rgba(233,200,106,.3);font-size:13px;color:var(--cream)}
.msh .mwrite i{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(233,200,106,.7)}
.msh .msaid{margin:12px 0 0;font-size:13px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.msh .hcf{margin-top:14px}
.msh .acts a.btn{text-decoration:none}
.link.door{cursor:pointer;width:100%;text-align:left;min-height:58px}
.link .hic{margin:0;display:flex}
.link.door b{font-size:14.5px}
main [id]{scroll-margin-top:calc(76px + var(--sat))}

/* ---- the flow: one map of where the energy goes ----
   The drawing is magnitude and never status, so not one of the good, bad or
   waiting tones is used in it: the widths carry the size, gold marks the
   heaviest step and the travelling dots, and everything else is a line. */
.map{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;margin:0 0 12px}
svg.flow{width:100%;height:auto;display:block}
svg.flow .node{cursor:pointer}
svg.flow .nb{fill:var(--panel2);stroke:var(--line2);stroke-width:1}
svg.flow .node:hover .nb,svg.flow .node:focus-visible .nb{stroke:var(--gold-dim)}
svg.flow .node:focus-visible{outline:none}
/* an unread node is drawn hollow but is still a thing a thumb can hit, so its
   ground is transparent rather than absent */
svg.flow .node.unread .nb{fill:transparent;stroke:var(--line2);stroke-dasharray:4 4}
svg.flow .nl{fill:var(--muted);font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.02em}
svg.flow .nv{fill:var(--cream);font-family:var(--f-disp);font-weight:600;font-variant-numeric:tabular-nums}
svg.flow .nu{fill:var(--faint);font-family:var(--f-mono);font-size:9px;letter-spacing:.04em}
svg.flow .node.unread .nv{fill:var(--faint);font-family:var(--f-mono);font-size:12px;font-weight:400}
svg.flow .ed{fill:none;stroke:var(--line2);stroke-linecap:round}
svg.flow .ed.big{stroke:var(--gold);opacity:.72}
svg.flow .ed.none{stroke:var(--line2);stroke-width:1.5;stroke-dasharray:3 5;opacity:.85}
svg.flow .rt{fill:var(--muted);font-family:var(--f-mono);font-size:10px;letter-spacing:.01em}
svg.flow .rtb{fill:var(--panel);stroke:var(--line);stroke-width:.6}
svg.flow .pulse{fill:var(--gold)}
.notes{margin:2px 0 0}
.notes p{color:var(--faint);font-size:12.5px;line-height:1.55;margin:0 0 6px}
.flowbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.flowbar .seg{flex:1;min-width:0}

/* ---- the Observatory: every number the house keeps, side by side ----
   No chart here needs a second hue to tell its series apart. A weekday by
   hour grid is one sequential blue, validated as a ramp (node
   scripts/validate_palette.js --ordinal, the four steps below, worst
   adjacent step 0.06+ of lightness, the darkest step still 2.13:1 on this
   card's own background). Every trend that would otherwise need four
   colours for four networks is drawn as four small panels instead, one
   line each, the gold the reel's own sparkline already wears -- the
   network's name is the label, never its hue. Only state (sent, failed,
   waiting) uses colour to mean something, and that palette (--good,
   --bad, --gold as "waiting") is the one the rest of this console already
   uses for the same three meanings, each always beside its own word. */
.viz{padding:16px 18px}
.viz .vh{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.viz .vh b{font-family:var(--f-disp);font-size:15px;color:var(--cream);flex:1;min-width:120px}
.viz .vh .vs{width:100%;order:3;font-size:11.5px;color:var(--faint)}
.viz .tv{flex:0 0 auto}
.viz .vzc{overflow-x:auto}
.viz .vtb[hidden]{display:none}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
