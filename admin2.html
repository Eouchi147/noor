table.dt th{text-align:left;color:var(--faint);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-bottom:1px solid var(--line)}
table.dt td{padding:5px 8px;border-bottom:1px solid var(--line);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt tr:last-child td{border-bottom:0}

/* THE HERO TILES: the three or four headline numbers, big, one row, never
   sharing a grid with the per-network scoreboard below it -- the two used to
   sit in one six-wide grid and eight tiles wrapped into an uneven two-row
   mess with orphans at 1280. Two columns under 560px, four from there up,
   which is exactly the count the hero ever carries so the row never wraps. */
.otiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 4px}
@media(min-width:560px){.otiles{grid-template-columns:repeat(4,1fr)}}
.otiles.n3{grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){.otiles.n3{grid-template-columns:repeat(3,1fr)}}
.otile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.otile .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.otile .v{font-family:var(--f-disp);font-size:28px;font-weight:600;color:var(--cream);line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.otile .d{font-family:var(--f-mono);font-size:11px;margin-top:3px}
.otile .d.up{color:var(--good)}.otile .d.dn{color:var(--bad)}.otile .d.na{color:var(--faint)}
.otile svg.spk{width:100%;height:26px;display:block;margin-top:8px}

/* THE SCOREBOARD: one row a network, name then posts then reach-or-views
   then engagement then the week's move then the 30-day line, in that fixed
   order every row -- a real scoreboard's own promise, that the eye can drop
   straight down one column without re-reading a label. A network with
   nothing posted and nothing to compare against says so in words, `.empty`,
   rather than rendering four dashes that read as a chart still loading. */
.scoreboard{display:flex;flex-direction:column;gap:6px;margin:16px 0 4px}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
.srow .sname{font-family:var(--f-disp);font-size:14px;font-weight:600;color:var(--cream);width:100px;flex:0 0 auto}
.srow .sstat{width:78px;flex:0 0 auto}
.srow .sstat .sl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.srow .sstat .sv{font-family:var(--f-mono);font-size:13.5px;color:var(--text);font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}
.srow .schip{width:74px;flex:0 0 auto}
.srow .schip .d{font-family:var(--f-mono);font-size:12px}
.srow .sspark{flex:1 1 100px;min-width:80px;max-width:190px}
.srow .sspark svg.spk{width:100%;height:24px;display:block}
.srow.empty .snote{font-size:12.5px;color:var(--faint)}
@media(max-width:480px){.srow{padding:10px 13px}.srow .sname{width:100%}}

.notesc p{color:var(--text);font-size:13px;line-height:1.6;margin:0 0 8px;padding-left:14px;position:relative}
.notesc p::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--gold-dim)}

.panelgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.panelgrid.n2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:560px){.panelgrid.n4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.panelgrid.n4{grid-template-columns:repeat(4,1fr)}}
/* the small multiples carry no box of their own: they already sit inside
   one viz card, so a second bordered, filled panel around each of the four
   would be a card drawn inside a card, four times over. A hairline top rule
   is enough to say "this one is separate" without saying it four times */
.trendp{border-top:1px solid var(--line);padding:10px 0 0}
.trendp b{display:block;font-family:var(--f-disp);font-size:12.5px;color:var(--cream);margin:0 0 6px}
.trendp svg{width:100%;height:96px;display:block;overflow:visible}
.trendp .pk{fill:var(--faint)}
.trendp .pt{fill:var(--gold);opacity:0;transition:opacity .1s}
.trendp .pt:hover,.trendp .pt:focus-visible{opacity:.3;outline:none}
@media(prefers-reduced-motion:reduce){.trendp .pt{transition:none}}

/* THE HEATMAP: 08, 11, 14, 17, 19, 21 UTC -- the six reel hours read from
   the schedule itself, never the three or however many hours happened to
   have a number this month. A 2px gap between rounded cells (the skill's
   own anatomy: cells are marks, not a seamless fill) and a cell big enough
   at six columns to read on a phone without the tooltip. */
.heat{display:grid;gap:2px;grid-auto-rows:36px}
.heat .hd{font-family:var(--f-mono);font-size:10px;color:var(--faint);display:flex;align-items:center;justify-content:center}
.heat .cell{border-radius:5px;cursor:pointer;min-width:32px}
.heat .cell:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.heat .rowlab{font-size:10.5px;color:var(--muted);display:flex;align-items:center;padding-right:4px;white-space:nowrap}
.heatscale{display:flex;align-items:center;gap:4px;margin-top:10px;font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.heatscale i{width:16px;height:10px;border-radius:2px;display:inline-block}

.bars.floor .b.low{opacity:.45}
.bars .b .n .nn{display:block}
.bars .b .n .sub{display:block;font-size:10px;color:var(--faint)}
/* THE METERS (library coverage): each row is its own corpus's own share, so
   the value needs both the raw count and the percent on one line -- "304 of
   350" was wrapping onto three lines in a 40px column built for a plain
   number. A wider, fixed-width value column and tabular figures fix it; the
   percent sits beside the count rather than under it. */
.bars.meter .b{grid-template-columns:112px 1fr 130px}
.bars.meter .b .v{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bars.meter .b .v .pct{color:var(--gold-dim);font-weight:600;min-width:34px;text-align:right}
@media(max-width:420px){.bars.meter .b{grid-template-columns:94px 1fr 112px;gap:6px}}

.fungrid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.fungrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.fungrid{grid-template-columns:repeat(4,1fr)}}
.funp{border-top:1px solid var(--line);padding:10px 0 0}
.funp b{display:block;font-family:var(--f-disp);font-size:12.5px;color:var(--cream);margin:0 0 8px}
.funp .st{display:flex;align-items:center;gap:8px;margin:4px 0}
.funp .st .sl{width:64px;font-size:10.5px;color:var(--faint);flex:0 0 auto}
.funp .st .tk{flex:1;height:14px;background:var(--panel2);border-radius:4px;overflow:hidden}
.funp .st .tk i{display:block;height:100%;background:var(--gold);border-radius:4px}
.funp .st .sv{width:52px;text-align:right;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);flex:0 0 auto}

.cal{display:flex;flex-wrap:wrap;gap:3px}
.cal .d{width:20px;height:20px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.cal .d:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.cal .d.sent{background:var(--good);border-color:var(--good)}
.cal .d.partial{background:var(--gold);border-color:var(--gold)}
.cal .d.failed{background:var(--bad);border-color:var(--bad)}
.cal .d.pending{background:var(--blue);border-color:var(--blue)}
.cal .d.none{opacity:.5}
.cal .d.dup::after{content:"";position:absolute}
.calwrap{position:relative}
.callg{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}
.callg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

#obs-tip{position:fixed;z-index:60;background:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .1s;max-width:220px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#obs-tip.on{opacity:1}
#obs-tip b{color:var(--cream);font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.bars .t i,#obs-tip{transition:none}}

/* ---- The Lantern: a chat column, a thinking stream that folds when the
   run is done, an artifacts area, an actions ledger with Undo, the models
   status. No new colour: gold for the one thing that matters (Send, a
   working step), the same good/bad/wait triad every other room wears. */
.lant-starters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.lant-starters button{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12.5px;color:var(--text)}
.lant-starters button:active{border-color:var(--line2)}
.lant-in{display:flex;gap:8px;align-items:flex-end}
.lant-in textarea{flex:1;font:inherit;font-size:14px;background:var(--ink);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;resize:vertical;min-height:44px;max-height:180px}
.lant-in .go{flex:0 0 auto;background:var(--gold);color:#1a1608;font-weight:700;border-radius:10px;padding:12px 16px;font-size:14px}
.lant-in .go:disabled{opacity:.5}
.lant-thread{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:70vh;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.lant-turn{display:flex;flex-direction:column;gap:8px}
.lant-msg{border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.55;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.lant-msg.user{background:var(--panel2);border:1px solid var(--line);color:var(--cream);align-self:flex-end}
.lant-msg.assistant{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.lant-msg .note{margin-top:8px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:6px}
.lant-think{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0}
.lant-think summary{padding:11px 14px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--gold-dim);letter-spacing:.04em;text-transform:uppercase;list-style:none;display:flex;align-items:center;gap:8px}
.lant-think summary::-webkit-details-marker{display:none}
.lant-think summary .n{margin-left:auto;font-family:var(--f-mono);color:var(--faint);text-transform:none;letter-spacing:0;font-size:11px}
.lant-think .body{padding:0 14px 12px}
.lant-step{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);overflow-wrap:anywhere}
.lant-step:first-child{border-top:0}
.lant-step .ic{flex:0 0 auto;width:16px;height:16px;border-radius:50%;margin-top:2px;background:var(--panel2);border:1px solid var(--line2)}
.lant-step .ic.ok{background:var(--good);border-color:var(--good)}
.lant-step .ic.wait{background:var(--gold);border-color:var(--gold)}
.lant-step .ic.bad{background:var(--bad);border-color:var(--bad)}
.lant-step b{color:var(--text);font-weight:600}
.lant-artifacts{display:flex;flex-direction:column;gap:12px;margin:0}
.lant-draft{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.lant-draft .hd{display:flex;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.lant-draft .hd b{font-family:var(--f-disp);font-size:14px;color:var(--cream);flex:1;overflow-wrap:anywhere}
.lant-draft .hd .cnt{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.lant-draft pre{white-space:pre-wrap;font:inherit;font-size:13px;color:var(--text);margin:0 0 8px;overflow-wrap:anywhere}
.lant-proposal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:12px;padding:13px 15px;overflow-wrap:anywhere}
.lant-proposal b{display:block;font-family:var(--f-disp);font-size:14px;color:var(--cream);margin:0 0 4px}
.lant-proposal .ev{font-size:12px;color:var(--muted);margin:6px 0}
.lant-proposal .acts{display:flex;gap:8px;margin-top:10px}
.lant-ledger .row .u{font-size:11.5px}
.lant-ledger .row.undone{opacity:.5}
.lant-ledger .row.undone .u{color:var(--faint)}
.lant-models{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.lant-models .m{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.lant-models .m i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.lant-models .m.on i{background:var(--good)}
@media(prefers-reduced-motion:reduce){.lant-step .ic{transition:none}}

/* ---- The Soul: the house's own mind, read at a glance and then in depth.
   No new colour and no chart library: the gold line the Observatory already
   draws, the good/bad/wait triad every chip here wears, and one more use of
   the bad tone for the column that asks the owner for something, because
   that column is the one he must not miss. Every chart is drawn at the pixel
   width of its own box (measured, then drawn), so a label is never stretched
   the way a fixed viewBox stretches it on a wide desk. */
.rooms .card.feat{grid-column:1/-1;min-height:96px;border-color:var(--gold-dim);background:linear-gradient(180deg,rgba(233,200,106,.05),rgba(233,200,106,0) 70px),var(--panel)}
.pill.gold{color:var(--gold);border-color:var(--gold-dim)}
.soul-hd .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim)}
.soul-hd .ms{font-family:var(--f-disp);font-size:18px;line-height:1.5;color:var(--cream);margin:6px 0 0;font-weight:500}
.soul-hd .st{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.soul-hd .st .pill{font-size:11px;padding:4px 11px}
.soul-confirm{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13.5px;color:var(--text)}
.soul-confirm .acts{margin-top:10px}
.soul-ns .hero .n{font-size:48px}
.soul-ns .hero .n.none{font-size:24px;color:var(--muted);padding-bottom:6px}
.soul-ns .vh{margin:14px 0 6px}
.soul-ch{width:100%;position:relative;overflow:hidden}
.soul-ch svg{display:block;width:100%}
.soul-ch .gl{stroke:var(--line);stroke-width:1}
.soul-ch .ax{fill:var(--faint);font-family:var(--f-mono);font-size:10px}
.soul-ch .hx{cursor:crosshair}
.soul-ch .hx .gd{opacity:0}
.soul-ch .hx:hover .gd{opacity:1}
.soul-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px 16px}
.soul-sm .trendp b{display:flex;align-items:baseline;gap:6px}
.soul-sm .trendp b .lv{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--gold);font-weight:500;white-space:nowrap}
.soul-sm .trendp svg{height:auto}
.soul-sm .why{font-size:11.5px;color:var(--faint);margin:2px 0 0;line-height:1.45}
.soul-goal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.soul-goal .h{display:flex;gap:6px 8px;align-items:flex-start;flex-wrap:wrap}
.soul-goal .h b{flex:1 1 220px;min-width:0;color:var(--cream);font-weight:600;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.soul-goal .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.soul-goal .bar2{height:8px;border-radius:4px;margin:10px 0 6px}
.soul-goal .bar2 i.met{background:var(--good)}
.soul-goal .nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:11px;color:var(--text)}
.soul-goal .nums em{font-style:normal;color:var(--faint)}
.soul-goal .ed{margin-top:10px}
.soul-goal .frm label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 4px}
.soul-lc{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:0 0 10px}
.soul-lc .w{font-size:13px;color:var(--muted);flex:1 1 auto}
.soul-cols{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.soul-cols{grid-template-columns:repeat(3,1fr)}}
.soul-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.soul-col h4{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);display:flex;align-items:center;gap:8px}
.soul-col h4 .n{margin-left:auto;font-family:var(--f-mono);color:var(--faint);letter-spacing:0}
.soul-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.soul-col li{font-size:13.5px;line-height:1.5;color:var(--text);padding-left:16px;position:relative;overflow-wrap:anywhere}
.soul-col li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.soul-col.done li::before{background:var(--good)}
.soul-col.next li::before{background:var(--gold)}
.soul-col.you{border-color:rgba(240,138,138,.5);background:rgba(240,138,138,.07)}
.soul-col.you h4{color:var(--bad)}
.soul-col.you li{color:var(--cream);font-weight:500}
.soul-col.you li::before{background:var(--bad)}
.soul-col .empty{padding:0}
@media(max-width:639px){.soul-col.you{order:-1}}
.soul-up .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.soul-int,.soul-drop{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.soul-drop{border-color:rgba(240,138,138,.4)}
.soul-drop .h{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.soul-drop .h b{flex:1 1 160px;min-width:0;color:var(--cream);font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.soul-drop li{overflow-wrap:anywhere}
.soul-int .h{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.soul-int .h b{flex:1 1 160px;min-width:0;color:var(--cream);font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.soul-int .kv{margin-top:10px}
.soul-cn{display:grid;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.soul-cn .v{padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px;min-width:0}
.soul-cn .v:first-child{border-top:0}
.soul-cn .v .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.soul-cn .v .who b{color:var(--text);font-weight:600}
.soul-cn .v .who span{color:var(--faint);font-size:11.5px}
.soul-cn .v ul{margin:5px 0 0;padding-left:18px;color:var(--muted);overflow-wrap:anywhere}
.soul-cn .v li{margin:2px 0}
.soul-res{margin-top:12px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text);overflow-wrap:anywhere}
.soul-res .tx{flex:1 1 180px;min-width:0}
.soul-meter .top{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.soul-meter .top .v{font-family:var(--f-disp);font-size:28px;font-weight:600;color:var(--cream);line-height:1.1;font-variant-numeric:tabular-nums}
.soul-meter .top .of{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.soul-meter .top .pct{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.soul-meter .bar2{height:10px;border-radius:5px;margin:10px 0 6px}
.soul-meter+.soul-meter{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

<body>

<div id="gate">
  <div class="card">
    <div class="mark">ن</div>
    <h1>The console</h1>
    <p>One key exists. This house holds the readers, the gifts, the guardians and the money.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"/>
    <button class="go" id="enter">Unlock</button>
    <p class="err" id="err"></p>
    <a class="old" href="/admin">Open the full console instead →</a>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="mark">ن</div>
    <h1 id="title">Home</h1>
    <span class="when" id="when"></span>
    <button class="rf" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
  </header>

  <main>
    <!-- The five surfaces of the bar. Home is the owner's cockpit; Ask is the
         conversation with the Lantern; Posts holds the line-up and, in a tab
         of its own, today's reels to share by hand; Numbers holds the
         Observatory and the readers' numbers, again as two tabs; More is the
         hub every other room is reached from. -->
    <section class="surf on" id="s-home"></section>
    <section class="surf" id="s-ask"></section>
    <section class="surf" id="s-posts"></section>
    <section class="surf" id="s-numbers"></section>
    <section class="surf" id="s-more"></section>
    <!-- The rooms. They are surfaces exactly like the five above, but they
         are reached from More (or from a link on Home), so the bar keeps its
         five buttons. The engine room is the code's own api/soul.js room. -->
    <section class="surf" id="s-engine"></section>
    <section class="surf" id="s-mail"></section>
    <section class="surf" id="s-lights"></section>
    <section class="surf" id="s-legacy"></section>
    <section class="surf" id="s-marketing"></section>
    <section class="surf" id="s-journal"></section>
    <section class="surf" id="s-night"></section>
    <section class="surf" id="s-system"></section>
    <section class="surf" id="s-controls"></section>
    <section class="surf" id="s-flow"></section>
    <section class="surf" id="s-readers"></section>
  </main>

  <nav class="bar" aria-label="Surfaces">
    <button data-s="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home<i class="dot" id="dot-home" hidden></i></button>
    <button data-s="ask"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1.3-1 2.5H9c0-1.2-.3-1.9-1-2.5A6 6 0 0 1 12 3z"/></svg>Ask<i class="dot" id="dot-ask" hidden></i></button>
    <button data-s="posts"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Posts<i class="dot" id="dot-posts" hidden></i></button>
    <button data-s="numbers"><svg viewBox="0 0 24 24"><path d="M3 20l5-8 4 5 3-3 6 6"/><circle cx="17" cy="6" r="2"/></svg>Numbers<i class="dot" id="dot-numbers" hidden></i></button>
    <button data-s="more"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>More<i class="dot" id="dot-more" hidden></i></button>
  </nav>
</div>

<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div id="sheet-in"></div></div>
<div id="toast" role="status"></div>
<div id="obs-tip" role="tooltip"></div>

<script>
(function(){
"use strict";
/* ---------- the small kit ---------- */
var $=function(id){return document.getElementById(id)};
/* a reel's file: the manifest row's own URL once the shelf is on the store, else the file on the site */
var reelUrl=function(c,what){var u=c&&c[what];if(typeof u==="string"&&/^https:\/\//.test(u))return u;return "/reels/"+(c&&c.id||"")+(what==="cover"?"-cover.jpg":".mp4")};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var relock=function(){$("app").classList.remove("on");$("gate").hidden=false;$("err").textContent="The key has expired. Enter it again.";$("enter").disabled=false};
var answer=function(r){if(r.status===401){relock();return{ok:false,status:401,j:{},locked:true}}return r.json().catch(function(){return null}).then(function(j){return{ok:r.ok,status:r.status,j:j}})};
var get=function(u){return fetch(u,{credentials:"same-origin",cache:"no-store"}).then(answer)};
var post=function(u,b){return fetch(u,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(answer).then(function(r){r.j=r.j||{};return r})};
/* the corrections store is the one place the house is asked to forget
   something, and it listens for DELETE, so the kit knows a third verb */
var del=function(u,b){return fetch(u,{method:"DELETE",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(answer).then(function(r){r.j=r.j||{};return r})};
/* every action ends here when the network is gone: the button comes back and the owner is told */
var unreachable=function(b,was){return function(){if(b){b.disabled=false;if(was!=null)b.textContent=was}closeSheet();toast("Could not reach the house.",true)}};
var toastT=null;
/* a toast may carry one action (Home's Undo): it then takes the finger and stays longer */
function toast(msg,bad,act){var t=$("toast");t.textContent=msg;
  if(act&&act.label&&typeof act.fn==="function"){var b=document.createElement("button");b.type="button";b.className="tact";b.textContent=act.label;b.onclick=function(){clearTimeout(toastT);t.className="";act.fn()};t.appendChild(b)}
  t.className="on"+(bad?" bad":"")+(act?" act":"");clearTimeout(toastT);toastT=setTimeout(function(){t.className=""},act?7000:2600)}
function sheet(html,wide){$("sheet-in").innerHTML=html;$("sheet").scrollTop=0;$("sheet").classList.toggle("wide",!!wide);$("veil").classList.add("on");$("sheet").classList.add("on");document.body.style.overflow="hidden"}
function closeSheet(){$("veil").classList.remove("on");$("sheet").classList.remove("on");document.body.style.overflow=""}
$("veil").addEventListener("click",closeSheet);
$("sheet-in").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.id==="cl")return closeSheet();
  /* the cycle sheet opens from the engine room and from Home's brief alike */
  if(b.dataset.soulUndo!=null)return soulUndo(b);
  if(b.dataset.retry){var q=b.dataset.retry.split("|");closeSheet();var row=document.querySelector('#slot-'+q[0]+' [data-retry="'+b.dataset.retry+'"]');return retryChan(q[0],q[1],row||b)}
  var rel=b.dataset.rel||b.dataset.rm;if(rel){var p=rel.split("|");b.disabled=true;post("/api/journal",{action:"comment-state",id:p[0],cid:p[1],state:b.dataset.rel?"approve":"reject"}).then(function(r){closeSheet();toast(r.ok?(b.dataset.rel?"Released.":"Removed."):"It refused.",!r.ok);C.held=null;drawReaders(true)})}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
var ICO={
  post:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  pen:'<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  reddit:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16V8M8.5 11.5L12 8l3.5 3.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 7"/></svg>',
  ring:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>',
  lamp:'<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1.3-1 2.5H9c0-1.2-.3-1.9-1-2.5A6 6 0 0 1 12 3z"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  /* Home's own few: who did a thing, what it served, when it is due */
  person:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.3-3.6 4-5.4 7-5.4s5.7 1.8 7 5.4"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>',
  target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>',
  rise:'<svg viewBox="0 0 24 24"><path d="M4 17l6-6 4 4 6-7"/><path d="M15 8h5v5"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  out:'<svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v5H5V7h5"/></svg>',
  plane:'<svg viewBox="0 0 24 24"><path d="M21 4L3 11l6.5 2.5L12 20l3-5.5"/><path d="M21 4l-6 11M21 4L9.5 13.5"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'
};
var SLOT_WHAT={dawn:"What today is in the Islamic year",reelA:"A reel · morning",lead:"What is coming",reelC:"A reel · noon",light:"The day's card",reelD:"A reel · afternoon",word:"One of 523 words",reelB:"A reel · evening",dusk:"One of 71 chapters of the Path",reelE:"A reel · night"};
var CHIP={sent:["good","sent"],partial:["bad","half sent"],failed:["bad","failed"],due:["bad","owed"],pending:["wait","finishing"],queued:["blue","waiting for you"],skipped:["","nothing to say"]};
function chip(state,at){var c=CHIP[state];return c?'<span class="pill '+c[0]+'">'+c[1]+'</span>':'<span class="pill">'+String(at).padStart(2,"0")+':00</span>'}
function ago(iso){if(!iso)return"";var s=(Date.now()-Date.parse(iso))/1000;if(s<90)return"just now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" d ago"}
function clock(){var d=new Date();$("when").textContent=d.toUTCString().slice(17,22)+" UTC"}
setInterval(clock,30000);

/* ---------- the cache: a surface opened again within a minute is instant ---------- */
var C={};var TTL=60000;
function cached(key,fn,force){var c=C[key];if(!force&&c&&Date.now()-c.at<TTL)return Promise.resolve(c.v);return fn().then(function(v){C[key]={at:Date.now(),v:v};return v})}
/* A network that is not open yet (Pinterest on Trial until its review) is a
   stage, not a fault. A slot whose only unanswered network is one of those
   reads as sent, with the network marked waiting, so the day is not covered
   in "half sent" for something nobody can act on. */
var WAITING={};
function settle(t){WAITING={};var slots=(t&&t.slots)||[];
  /* first pass: which networks are waiting anywhere today */
  slots.forEach(function(s){var r=s.results||{};Object.keys(r).forEach(function(k){if(r[k]&&(r[k].trial||r[k].waiting))WAITING[k]=1})});
  /* second pass: a failure on a waiting network is the same wait in another
     voice (a pin cut by the clock, a card set aside for drift), so it reads as

  if(/^https:\/\/[^\s"'<>\\]+$/i.test(href))return {url:true,href:href};

/* ---- 8c. the outreach, started once by hand (mail.start, round six) ----

   first time from a button (Make it a one time button) so I can see it in

        plain words;

        written), a tick asked every minute while the cycle runs, and Home
        read again every minute so the letters waiting for his Send appear
        above as their cards.

/* the letters in a cycle: each outreach-send intent, and where it stands */
function oLetterState(it){

  if(s==="done")return res&&res.ok===false?["no","not written"]:["done","written"];
  if(s==="failed")return ["no","not written"];
  if(s==="rejected"||(cn&&cn.approved===false))return ["no","the council said no"];
  if(s==="running")return ["read","being written"];
  if(s==="approved"||(cn&&cn.approved===true))return ["read","the council said yes"];

  if(s==="unknown")return ["read","being checked"];

function oCount(c){

  var written=its.filter(function(it){return String(it.status||"").toLowerCase()==="done"&&!(it.result&&typeof it.result==="object"&&it.result.ok===false)}).length;

/* 3. the watch: the cycle every 20 seconds, a tick each minute while it
   runs, Home each minute, for up to 15 minutes after the plan answered */
function oWatch(){
  var r=OUT.run;if(!r)return;r.step="watch";r.watchFrom=r.watchFrom||Date.now();oState("watch","work");
  oLive("watch",'<em>Looking in on the plan…</em>');oPoll();

function oPoll(){
  var r=OUT.run;if(!r||r.ended||r.step!=="watch")return;clearTimeout(r.timers.watch);r.timers.watch=0;
  if(document.visibilityState==="hidden"){r.sleeping=true;return}
  r.sleeping=false;
  /* the key expired and the gate is up: nothing is asked until he is back in */
  if(!$("app").classList.contains("on")){r.timers.watch=setTimeout(oPoll,O_MS.watch);return}
  /* the cycle the plan named is read by its id; with none named, the current
     one is taken only once it is the new one (running, or begun after the press) */
  var named=!!r.cycleId;
  oCycle(r.cycleId).then(function(c){
    if(OUT.run!==r||r.ended)return;
    if(c&&!named&&!oFresh(c,r.from)){oLive("watch",'<em>Waiting for the plan to begin…</em>');c=null}
    else if(!c){if(!r.said.read){r.said.read=1;oLine("watch","The plan could not be read just now; it is looked at again in a moment.","warn")}}
    if(c){
      if(!r.cycleId&&c.id)r.cycleId=String(c.id);
      var n=oCount(c),st=String(c.status||"").toLowerCase();
      oLive("watch",esc(oCountWords(n))+(st==="running"&&O_STAGE[String(c.stage||"").toLowerCase()]?'<br><em>Now: </em>'+esc(O_STAGE[String(c.stage||"").toLowerCase()]):''));
      var lt=r.el.querySelector(".olt"),h=oLettersHtml(n);
      if(h){if(lt)lt.outerHTML=h;else oStepEl("watch").querySelector(".osx").insertAdjacentHTML("beforeend",h);
        /* a letter that moved on since the last reading lights once */

      if(st==="done")return oEnd(n,"done");
      if(st==="failed")return oEnd(n,"failed");
      if(st==="running"&&!r.ticking&&Date.now()-r.lastTick>=O_MS.tick)oTick();
    }
    if(Date.now()-r.watchFrom>=O_MS.window)return oEnd(c?oCount(c):null,"time");
    if(Date.now()-r.lastHome>=O_MS.home&&hAwake()&&!HOME.cf&&!HOME.busy){r.lastHome=Date.now();drawHome(true)}

/* THE CHANGE CONTROL. One reel slot, one day, three doors: skip it, swap it
   for a named card, or clear whatever override already sits on it. Every
   refusal (a slot already sent, a swap id already taken, a date past the
   week api/_lineup.js allows) comes back from the server as it is, in the
   owner's own words, as a toast -- nothing here re-decides what is allowed.
   No browser dialog anywhere: the confirm step is a second face of this same

function openChange(date,slotId,cards){
  sheet('<h2>Change '+esc(slotId)+'</h2><p class="sub">'+esc(date)+'</p><div class="sk" style="height:60px"></div>');
  var src=date===todayDateStr()?today:tomorrow;
  src(false).then(function(day){
    var s=(day.slots||[]).filter(function(x){return x.id===slotId})[0]||{};
    var ov=s.override,card=s.reel;
    var cur=card?esc(card.hook||card.id||""):"no reel chosen yet";
    $("sheet-in").innerHTML='<h2>Change '+esc(slotId)+'</h2><p class="sub">'+esc(date)+' · '+cur+'</p>'
      +(ov?'<p class="muted small">currently '+(ov.action==="skip"?"skipped":"swapped for "+esc(ov.id||""))+', by '+esc(ovWho(ov.by))+'</p>':'')

    $("ch-swap").onclick=function(){openSwapPicker(date,slotId,cards)};
    if(ov)$("ch-clear").onclick=function(){confirmChange(date,slotId,null,"Clear the override on "+slotId+" for "+date+"? It goes back to the usual pick.")};
    $("ch-cancel").onclick=closeSheet;
  }).catch(function(){$("sheet-in").innerHTML='<h2>Change '+esc(slotId)+'</h2><p class="sub">That could not be read. Close this and try again.</p><div class="acts"><button class="btn ghost" id="ch-cancel">Close</button></div>';setTimeout(function(){$("ch-cancel").onclick=closeSheet},0)});

/* the swap picker. api/_schedule.js's own chooseReel only ever binds the
   half to a LIGHT card (`c.slot === half`, for kind light alone -- every
   other kind goes to any slot regardless of what `.slot` it happens to
   carry, and the real shelf only ever uses morning and evening besides).
   Checking the half for every kind here refused a swap on four of six
   slots for cards that would have played there perfectly well (2026-09-26
   review fix): the half now only narrows a LIGHT card; everything else on
   the shelf is offered to every slot, exactly as api/_lineup.js's own
   validator now checks it. The search box narrows by hook or id. */
function openSwapPicker(date,slotId,cards){
  var half=SLOT_HALF[slotId];
  var pool=(cards||[]).filter(function(c){var k=c.kind||"light";return k!=="light"||!c.slot||c.slot===half});
  var render=function(q){
    q=(q||"").toLowerCase();

    return list.length?'<div class="list">'+list.map(function(c){return '<div class="row tap" data-pick="'+esc(c.id)+'"><div class="t"><b>'+esc(c.hook||c.id)+'</b><span>'+esc(c.id)+'</span></div></div>'}).join("")+'</div>':'<div class="empty">No reels match.</div>'};

    +'<input class="fi full" id="swap-q" placeholder="Search by word or id" aria-label="Search reels" style="margin-bottom:10px">'
    +'<div id="swap-list">'+render("")+'</div>'

    var id=row.dataset.pick;var c=pool.filter(function(x){return x.id===id})[0]||{};
    /* the plain, un-escaped question: confirmChange below is the one and

/* ================= READERS ================= */

var NET_NAME={instagram:"Instagram",facebook:"Facebook",youtube:"YouTube",threads:"Threads"};
function insBars(rows,lab){if(!rows.length)return '<div class="empty">Nothing read yet.</div>';var mx=rows.reduce(function(m,r){return Math.max(m,(r.reach&&r.reach.median)||0)},0)||1;
  return '<div class="bars">'+rows.map(function(r){var med=r.reach&&r.reach.median!=null?r.reach.median:null;return '<div class="b"><span class="n" title="'+esc(r.n)+' posts">'+esc(lab(r))+' <span class="faint">'+esc(r.n)+'</span></span><span class="t"><i data-w="'+(med==null?0:Math.round(med/mx*100))+'"></i></span><span class="v">'+(med==null?"·":Math.round(med).toLocaleString())+'</span></div>'}).join("")+'</div>'}

    +'<details class="fold" open><summary>By kind<span class="pill">'+((ins.byKind||[])[0]?esc(ins.byKind[0].label)+" lead":"")+'</span></summary><div class="in">'+insBars(ins.byKind||[],function(r){return r.label})+'</div></details>'

    +(function(){
      /* a subject is ranked only once it has five posts behind it, the same

/* Read again: a batch of forty, asked for until the house says it is done */
function insRead(b){var was=b.textContent;b.disabled=true;var done=0;

/* ---- The numbers: one photograph a day (api/_insights.js, snapshot),

/* ---- Arrivals (masterplan step 8, conversion): visits the beacon could

/* ===========================================================================
   THE FLOW

   One picture of where the energy goes, drawn from GET /api/house?action=flow
   and from nothing else. The networks are small source nodes on the left; they
   converge into the posts made, and from there the map follows the server's own
   edges: reach, then views and the arrivals the beacon could attribute, then
   the readers on the site, and from them the pages read, the gifts and the
   du'as. What arrived and the guardians standing sit at the end, because no
   measured step leads to them and inventing one would be a lie.

   THREE RULES.
   1. A stage that could not be read is a hollow node saying "unread". It is
      never a nought, because nought is a number and this is an absence.
   2. An edge carries a rate only when the server sent one. The step from reach
      to the arrivals crosses two grains of time and the server says so; the
      map draws that step dotted and says nothing over it.
   3. The picture is never the only encoding: every number under it is written
      again as a plain list, and the server's notes are printed whole.

   The motion is finite and reader-driven: a dot travels each edge once, on
   load and on Trace, and under prefers-reduced-motion not one is made.
   =========================================================================== */
var F_ORDER=["posts","reach","views","clicks","readers","pages","gifts","duas","given","guardians"];
var F_SHORT={posts:"posts",reach:"reached",views:"views",clicks:"arrivals",readers:"readers",pages:"pages",gifts:"gifts",duas:"du'as"};
var F_DAYS=[7,14,30];
function fnum(v){return Number(v).toLocaleString("en-US",{maximumFractionDigits:2})}
function reduced(){try{return !!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)}catch(e){return false}}

/* the columns, from the server's own edges: a stage sits one step further out
   than the furthest stage that feeds it, and a stage nothing feeds sits at the
   end rather than at the beginning */
function flowDepths(stages,edges){
  var d={},ids={};
  stages.forEach(function(s){d[s.id]=null;ids[s.id]=1});
  if(ids.posts)d.posts=1;
  for(var pass=0;pass<stages.length+2;pass++)
    edges.forEach(function(e){if(d[e.from]!=null&&ids[e.to]!=null){var v=d[e.from]+1;if(d[e.to]==null||v>d[e.to])d[e.to]=v}});
  var max=1;for(var k in d)if(d[k]!=null&&d[k]>max)max=d[k];
  stages.forEach(function(s){if(d[s.id]==null)d[s.id]=max+1});
  return d;
}
/* the geometry. Left to right when there is room for it, top to bottom when
   there is not, and the same numbers either way. */
function flowLayout(stages,nets,edges,wide){
  var depth=flowDepths(stages,edges);
  var cols=[];
  if(nets.length)cols.push(nets.map(function(n){return{net:n.net,label:n.net,value:n.value,unit:"posts",small:true}}));
  var byDepth={};
  stages.forEach(function(s){(byDepth[depth[s.id]]=byDepth[depth[s.id]]||[]).push(s)});
  Object.keys(byDepth).map(Number).sort(function(a,b){return a-b}).forEach(function(k){
    cols.push(byDepth[k].sort(function(a,b){return F_ORDER.indexOf(a.id)-F_ORDER.indexOf(b.id)})
      .map(function(s){return{stage:s.id,label:s.label,value:s.value,unit:s.unit,unread:!!s.unread||s.value==null,small:false}}));
  });
  var at={},boxes=[],W,H;
  if(wide){
    /* the columns are drawn at a size that scales down to the card and stays
       legible there; every stacked node keeps a band under it for the rate of
       the step that fed it, which is why the rows are further apart than the
       boxes are tall */
    var PX=10,PY=20,GAP=26,NW=118,NH=58,SH=44,RG=28,CAP=15;
    W=PX*2+cols.length*NW+(cols.length-1)*GAP;
    var tallest=0;
    cols.forEach(function(c){var h=c.length*(c[0].small?SH:NH)+(c.length-1)*RG;if(h>tallest)tallest=h});
    H=PY*2+tallest+CAP;
    cols.forEach(function(c,ci){
      var nh=c[0].small?SH:NH,ch=c.length*nh+(c.length-1)*RG,y0=(H-CAP-ch)/2;
      c.forEach(function(n,ri){n.x=PX+ci*(NW+GAP);n.y=y0+ri*(nh+RG);n.w=NW;n.h=nh;n.depth=ci;
        boxes.push(n);at[n.stage||("net:"+n.net)]=n});
    });
  }else{
    var px=6,py=14,cg=10,rg=42,nh2=56,sh2=42;
    W=358;var y=py;
    cols.forEach(function(c,ci){
      var h=c[0].small?sh2:nh2,w=(W-px*2-(c.length-1)*cg)/c.length;
      c.forEach(function(n,ri){n.x=px+ri*(w+cg);n.y=y;n.w=w;n.h=h;n.depth=ci;boxes.push(n);at[n.stage||("net:"+n.net)]=n});
      y+=h+(ci<cols.length-1?rg:0);
    });
    H=y+py;
  }
  return{boxes:boxes,at:at,W:W,H:H,wide:wide};
}
function flowPath(a,b,wide){
  if(wide){
    var x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,k=Math.max(16,(x2-x1)/2);
    return{d:"M"+x1+","+y1+" C"+(x1+k)+","+y1+" "+(x2-k)+","+y2+" "+x2+","+y2,mx:(x1+x2)/2,my:(y1+y2)/2-7};
  }
  var X1=a.x+a.w/2,Y1=a.y+a.h,X2=b.x+b.w/2,Y2=b.y,K=Math.max(14,(Y2-Y1)/2);
  return{d:"M"+X1+","+Y1+" C"+X1+","+(Y1+K)+" "+X2+","+(Y2-K)+" "+X2+","+Y2,mx:(X1+X2)/2,my:(Y1+Y2)/2+3};
}
/* the width of a step is its size on a log scale, never below a hairline and
   never above eight, so a hundredfold difference is still one picture */
function flowWidth(v,max){
  if(typeof v!=="number"||!(v>0))return 1.5;
  var t=Math.log(1+v)/Math.log(1+(max>0?max:1));
  return Math.round((1.5+Math.max(0,Math.min(1,t))*6.5)*10)/10;

var OBS_TIP_WIRED=false;
function obsWireTip(){
  if(OBS_TIP_WIRED)return;OBS_TIP_WIRED=true;
  var tip=$("obs-tip");
  function show(el,ev){
    var t=el.getAttribute("data-tip");if(!t)return;
    var parts=t.split("|");
    tip.innerHTML=(parts[0]?esc(parts[0].trim())+"<br>":"")+"<b>"+esc((parts[1]||parts[0]).trim())+"</b>";
    tip.classList.add("on");
    var x=(ev&&ev.clientX!=null)?ev.clientX:el.getBoundingClientRect().left+el.offsetWidth/2;
    var y=(ev&&ev.clientY!=null)?ev.clientY:el.getBoundingClientRect().top;
    if(!ev||ev.clientX==null){var r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top}
    tip.style.left=Math.min(window.innerWidth-230,Math.max(6,x+12))+"px";
    tip.style.top=Math.max(6,y-38)+"px";
  }
  function hide(){tip.classList.remove("on")}
  document.body.addEventListener("pointerover",function(e){var el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el,e)});
  document.body.addEventListener("pointermove",function(e){var el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el,e)});
  document.body.addEventListener("pointerout",function(e){var el=e.target.closest&&e.target.closest("[data-tip]");if(el)hide()});
  document.body.addEventListener("focusin",function(e){var el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el)});
  document.body.addEventListener("focusout",function(e){var el=e.target.closest&&e.target.closest("[data-tip]");if(el)hide()});
}

/* ===========================================================================
   THE LANTERN

   An owner-only agent: POST /api/lantern-agent {message, thread} streams
   Server-Sent Events (start, plan, step, subagent, token, artifact, action,
   proposal, done, error) while it plans, reads the house's own tools, hands
   parts to subagents, and answers. Everything api/_agent.js decided is read
   here exactly as it arrives, never reordered or guessed at; every piece of
   model text is escaped before it reaches the page, the same discipline
   every other room in this console already keeps for a reader-facing string.

   THE THINKING STREAM is a <details> open while a run is in flight and
   folded the moment it ends, so the owner sees the working while it works
   and a short answer once it is done, not a wall of steps left open forever.
   ARTIFACTS reuse the Observatory's own chart functions (obsBars, trendSvgBig,
   dt, vizCard): no second chart engine, no new colour.
   =========================================================================== */
var LANT={thread:"",busy:false,turns:[]};
var LANT_STARTERS=["What should we post more of?","Why is Facebook at zero?","Plan next week's reels","Make a package for the best verse of the month"];
var lantModelsQ=function(f){return cached("lantmodels",function(){return get("/api/lantern-models").then(function(r){return r.j})},f)};
function lantLedger(){return get("/api/lantern-agent?action=ledger").then(function(r){return r.j})}

/* human words for what would otherwise be an internal action key or a
   raw hex id leaking into the room: the ledger's own "what" (an
   ACTION_TYPES slug from api/_agent.js) and a proposal's "requested".
   Never print nlan:*, a proposal id or an action key to the owner --
   say in words what the house did or asks, the same rule every other
   room here already keeps for a reader-facing string. */
var LANT_WHAT={"refresh-insights":"Refreshed the network numbers","reconcile-teach":"Taught the duplicate guard","lineup-change":"Change today's line-up"};
var LANT_NET={instagram:"Instagram",facebook:"Facebook",threads:"Threads",tiktok:"TikTok",youtube:"YouTube",x:"X"};
function lantWhatText(what,args){
  var base=LANT_WHAT[what]||("an action the room does not have a plain name for (" + String(what||"unknown") + ")");
  if(what==="reconcile-teach"&&args&&args.network){
    var net=LANT_NET[String(args.network).toLowerCase()]||args.network;
    base+=" from "+net+"'s real posts";
  }
  return base;
}
function lantStepRow(s){
  var icon=s.error?"bad":((s.phase==="done"||s.phase==="incomplete")?"ok":"wait");
  var who=s.tool?("Tool: "+esc(s.tool)):(s.role?("Subagent: "+esc(s.role)):"Plan");
  var bits=[];
  if(s.why)bits.push(esc(s.why));
  if(s.summary)bits.push(esc(s.summary));

}
function lantThinkHtml(think,open,done){

  return '<details class="lant-think"'+(open?' open':'')+'><summary>Show thinking<span class="n">'+count+(done?" step"+(count===1?"":"s"):" so far")+'</span></summary>'
    +'<div class="body">'+(count?think.map(lantStepRow).join(""):'<p class="muted small" style="margin:8px 0">Nothing to show yet.</p>')+'</div></details>';
}
/* one artifact, drawn with the room's own tools: a bars chart and a trend
   both reuse Observatory's own functions so a reader never meets a second
   way of drawing the same kind of picture; a table is dt(); a draft is a
   plain box with Copy and a character count; a proposal carries Approve
   and Decline, which the console's own click handler below wires. */
function lantArtifact(a,idx){
  var id="lant-art-"+idx;
  if(a.type==="chart"&&a.spec&&a.spec.kind==="bars"){
    var rows=(a.spec.rows||[]).map(function(r){return {label:r.label,n:r.n||0,v:r.v}});
    return obsBars(id,a.spec.title||"Chart",a.spec.sub||"",rows,function(r){return r.label},function(r){return r.n+" post"+(r.n===1?"":"s")},function(r){return r.v},function(r){return obsN(r.v)});
  }
  if(a.type==="chart"&&a.spec&&a.spec.kind==="trend"){
    var dates=a.spec.dates||[];var series=a.spec.series||{};var names=Object.keys(series);
    var body='<div class="panelgrid n2">'+names.map(function(n){return '<div class="trendp"><b>'+esc(n)+'</b>'+(trendSvgBig(series[n],dates,n)||'<p class="faint small" style="margin:4px 0 0">Not enough data yet.</p>')+'</div>'}).join("")+'</div>';
    var table=dates.length?dt(["Date"].concat(names),dates.map(function(d,i){return [d].concat(names.map(function(n){return obsN((series[n]||[])[i])}))})):"";
    return vizCard(id,a.spec.title||"Trend",a.spec.sub||"",body,table);
  }
  if(a.type==="table"){
    var headers=a.headers||[];var trows=a.rows||[];
    return vizCard(id,a.title||"Table","",dt(headers,trows),dt(headers,trows));
  }
  if(a.type==="draft"){
    var text=String(a.text||"");
    return '<div class="lant-draft" id="'+id+'"><div class="hd"><b>Draft: '+esc(a.network||"")+'</b><span class="cnt">'+text.length+' characters</span>'
      +'<button class="btn ghost sm" data-lant-copy="'+id+'-pre">Copy</button></div><pre id="'+id+'-pre">'+esc(text)+'</pre></div>';
  }
  if(a.type==="proposal"){
    var pid=a.id||"";
    var head=a.requested?lantWhatText(a.requested,a.args):"Proposal";
    return '<div class="lant-proposal" id="'+id+'"><b>'+esc(head)+'</b><p class="small">'+esc(a.description||"")+'</p>'
      +(a.why?'<p class="ev"><b>Why: </b>'+esc(a.why)+'</p>':'')
      +(a.evidence?'<p class="ev"><b>Evidence: </b>'+esc(a.evidence)+'</p>':'')
      +(a.reason?'<p class="ev"><b>Note: </b>'+esc(a.reason)+'</p>':'')
      +(a.change?'<p class="ev"><b>Change: </b>'+esc(a.change)+'</p>':'')
      +(a.undo?'<p class="ev"><b>Undo: </b>'+esc(a.undo)+'</p>':'')
      +(pid?'<div class="acts"><button class="btn sm" data-lant-approve="'+esc(pid)+'">Approve</button><button class="btn ghost sm" data-lant-decline="'+esc(pid)+'">Decline</button></div>'
           :'<p class="muted small" style="margin:8px 0 0">This proposal carries no id and cannot be decided from here.</p>')
      +'</div>';
  }
  return '';
}
/* one turn of the thread, oldest at the top, newest at the bottom: the
   question first, then (for the answer's own turn) its thinking, then
   the answer text itself, then whatever it made -- the fixed order the
   refuter's review asked for, so a reader always meets a claim after
   the working that grounds it and before the picture that follows from
   it, never scrambled by whichever SSE event happened to arrive first. */
function lantTurnHtml(t,idx){
  if(t.role==="user")return '<div class="lant-turn"><div class="lant-msg user">'+esc(t.content||"")+'</div></div>';
  var think=lantThinkHtml(t.think,!t.done,!!t.done);
  var answer=(t.content||t.done)?('<div class="lant-msg assistant" aria-live="polite">'+esc(t.content||"")
      +(t.notCompleted&&t.notCompleted.length?'<div class="note">Could not finish: '+t.notCompleted.map(esc).join("; ")+'</div>':'')+'</div>'):'';
  var arts=(t.artifacts||[]).map(function(a,ai){return lantArtifact(a,idx+"-"+ai)}).join("");
  return '<div class="lant-turn">'+think+answer+(arts?'<div class="lant-artifacts">'+arts+'</div>':'')+'</div>';
}
function lantRenderThread(){
  var el=$("lant-thread");if(!el)return;
  el.innerHTML=LANT.turns.map(function(t,i){return lantTurnHtml(t,i)}).join("");
  lantScrollBottom(el);
}
function lantModelsHtml(m){

  }).join("")+'</div>';
}
function lantLedgerHtml(items,cap,countToday){

    +'<div class="list lant-ledger">'+items.slice(0,20).map(function(e){

      +(canUndo?'<button class="btn ghost sm" data-lant-undo="'+esc(e.id)+'">Undo</button>':'<span class="u muted">'+(e.undone?"undone":(e.ok?"done":"failed"))+'</span>')+'</div>';

/* a proposal met live in a run's own thread keeps its Approve and Decline

function lantRemoveProposalDom(id){

function lantScrollBottom(el){try{el.scrollTop=el.scrollHeight}catch(e){}}

/* ASK, the conversation surface of the bar. Proposals no longer wait here:
   the house turns each into a decision on Home (LANTERN.md section 3), so
   this surface says so in one line and links there. The stream, the
   starters, the thread, the artifacts and the ledger are exactly as they

function drawLantern(force){
  var el=$("s-ask");
  if(!el.dataset.built){
    el.innerHTML='<p class="muted small" style="margin:0 0 14px">Ask a question or give an order. The Lantern answers from its own record and the house\'s numbers, with its sources; an order goes through the same council and caps as its own plans, and what it does appears on Home under Done. It never touches money or a secret.</p>'
      +'<div id="lant-models"></div>'
      +'<a class="link door" href="#home" id="lant-home"><div class="hic">'+ICO.lamp+'</div><div style="min-width:0"><b>Proposals now wait on Home as decisions</b><span>Say yes or no there, with everything else that needs you.</span></div><span class="chev">'+ICO.chev+'</span></a>'
      +'<div id="lant-starters" class="lant-starters"></div>'
      +'<div class="lant-in"><textarea id="lant-text" rows="2" placeholder="Ask the Lantern" aria-label="Ask the Lantern"></textarea><button class="go" id="lant-send">Ask</button></div>'
      +'<div id="lant-thread" class="lant-thread" role="log" aria-label="Conversation with the Lantern"></div>'
      +'<p class="sec">Actions it has taken</p><div id="lant-ledger"></div>';
    el.dataset.built="1";
    $("lant-starters").innerHTML=LANT_STARTERS.map(function(s){return '<button type="button" data-lant-start="'+esc(s)+'">'+esc(s)+'</button>'}).join("");
    var ta=$("lant-text");
    ta.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();lantSend()}});
    $("lant-send").addEventListener("click",lantSend);
    el.addEventListener("click",function(e){
      var hm=e.target.closest&&e.target.closest("#lant-home");
      if(hm){e.preventDefault();return void goRoom("home","h-decide")}
      var tv=e.target.closest&&e.target.closest("[data-tv]");
      if(tv){var card=$(tv.dataset.tv);if(!card)return;
        var showTable=card.querySelector(".vtb").hidden;
        card.querySelector(".vzc").hidden=showTable;card.querySelector(".vtb").hidden=!showTable;
        tv.textContent=showTable?"Chart":"Table";tv.setAttribute("aria-pressed",showTable?"true":"false");return}
      var st=e.target.closest&&e.target.closest("[data-lant-start]");
      if(st){$("lant-text").value=st.dataset.lantStart;lantSend();return}
      var cp=e.target.closest&&e.target.closest("[data-lant-copy]");
      if(cp){var pre=$(cp.dataset.lantCopy);if(pre&&navigator.clipboard)navigator.clipboard.writeText(pre.textContent).then(function(){toast("Copied.")});return}
      var ap=e.target.closest&&e.target.closest("[data-lant-approve]");
      if(ap){var pid=ap.dataset.lantApprove;if(!pid)return;ap.disabled=true;post("/api/lantern-agent",{action:"approve",id:pid}).then(function(r){
        toast(r.j&&r.j.ok?(r.j.executed?"Done.":"Recorded."):"It refused.",!(r.j&&r.j.ok));lantRefreshLedger();lantRefreshProposals();lantRemoveProposalDom(pid)}).catch(unreachable(ap));return}
      var dc=e.target.closest&&e.target.closest("[data-lant-decline]");
      if(dc){var did=dc.dataset.lantDecline;if(!did)return;dc.disabled=true;post("/api/lantern-agent",{action:"decline",id:did}).then(function(){toast("Declined.");lantRefreshProposals();lantRemoveProposalDom(did)}).catch(unreachable(dc));return}
      var un=e.target.closest&&e.target.closest("[data-lant-undo]");
      if(un){un.disabled=true;var was=un.textContent;un.textContent="Undoing…";post("/api/lantern-agent",{action:"undo",id:un.dataset.lantUndo}).then(function(r){
        toast(r.j&&r.j.ok?"Undone.":(r.j&&r.j.error)||"Could not undo.",!(r.j&&r.j.ok));lantRefreshLedger()}).catch(unreachable(un,was));return}

    $("lant-ledger").innerHTML=lantLedgerHtml(lg.items,lg.cap,lg.countToday);

}
function lantRefreshLedger(){lantLedger().then(function(lg){lg=lg||{};var el=$("lant-ledger");if(el)el.innerHTML=lantLedgerHtml(lg.items,lg.cap,lg.countToday)})}
/* a proposal answered or made in the thread changes what waits on Home, so
   Home reads the house again the next time it is opened */
function lantRefreshProposals(){delete C.home}

/* the stream itself: fetch (not EventSource, since the request is a POST
   with a body) read a chunk at a time, split on the blank line SSE uses
   between events, and dispatch each one exactly as api/lantern-agent.js
   sent it. A run that fails outright (the network itself, not a model)
   still folds the thinking panel and tells the owner plainly. */
function lantSend(){
  if(LANT.busy)return;
  var ta=$("lant-text");var text=(ta.value||"").trim();
  if(!text)return;
  ta.value="";
  LANT.busy=true;
  LANT.turns.push({role:"user",content:text});
  /* the one assistant turn this run fills in as events arrive: pushed now,
     at the bottom, so streaming steps only ever grow this same turn in
     place -- never a second, out-of-order bubble further up the thread. */
  var turn={role:"assistant",content:"",think:[],artifacts:[],notCompleted:[],done:false};
  LANT.turns.push(turn);
  var sendBtn=$("lant-send");sendBtn.disabled=true;sendBtn.textContent="Asking…";
  lantRenderThread();
  var done=false;
  function finish(errText){
    if(done)return;done=true;
    LANT.busy=false;sendBtn.disabled=false;sendBtn.textContent="Ask";
    turn.done=true;
    if(errText&&!turn.content)turn.content=errText;
    lantRenderThread();
    lantRefreshLedger();
    lantRefreshProposals();
  }
  function onEvent(type,data){
    if(type==="start"){LANT.thread=data.thread||LANT.thread;return}
    if(type==="plan"){(data.steps||[]).forEach(function(s){turn.think.push({why:s.why,tool:s.kind==="tool"?s.name:null,role:s.kind==="subagent"?s.name:null,phase:"planned"})});lantRenderThread();return}
    if(type==="step"){
      if(data.phase==="incomplete"){turn.think.push({items:data.items,error:""})}
      else turn.think.push(data);
      lantRenderThread();return}
    if(type==="subagent"){turn.think.push(data);lantRenderThread();return}
    if(type==="artifact"){turn.artifacts.push(data);lantRenderThread();return}
    if(type==="action"){toast(lantWhatText(data.what,data.args)+", on its own.");lantRefreshLedger();return}
    if(type==="proposal"){turn.artifacts.push({type:"proposal",id:data.id,requested:data.requested,args:data.args,description:data.description,why:data.why,reason:data.reason,evidence:data.evidence,undo:""});lantRenderThread();return}
    if(type==="token"){turn.content=data.text||"";lantRenderThread();return}
    if(type==="done"){turn.notCompleted=data.notCompleted||[];finish();return}
    if(type==="error"){finish(data.error||"The Lantern could not answer.");return}
  }
  fetch("/api/lantern-agent",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,thread:LANT.thread})})
    .then(function(r){
      if(r.status===401){relock();finish("The key has expired. Enter it again.");return}
      if(!r.ok||!r.body){finish("The Lantern could not be reached.");return}
      var reader=r.body.getReader();var dec=new TextDecoder();var buf="";
      function pump(){
        return reader.read().then(function(res){
          if(res.done){finish();return}
          buf+=dec.decode(res.value,{stream:true});
          var parts=buf.split("\n\n");buf=parts.pop();
          parts.forEach(function(block){
            var m=/event: (\S+)\ndata: ([\s\S]*)/.exec(block);
            if(!m)return;
            var data=null;try{data=JSON.parse(m[2])}catch(e){data={}}
            onEvent(m[1],data);
          });
          return pump();
        });
      }
      return pump();
    }).catch(function(){finish("Could not reach the house.")});
}

/* ===========================================================================
   THE ENGINE ROOM

   What the owner reads as the engine room is the code's own soul room: the
   house's own mind (SOUL.md), read from one owner-gated route,
   /api/soul: view=today for the glance (the mission, pause, the north star,
   the goals, the last cycle, the month's spend), and view=metrics,
   chronicle, cycle, evolution and audit for the depth. Every number on this
   surface is one the route sent; a figure it did not send is drawn as "·"
   or said in words, never guessed. Each read fails on its own: a section
   whose read failed says so in its own card and the rest still draw.

   Nothing here acts without the owner's hand. Pause and Resume ask once,
   inside the card (never a browser dialog); Undo, a goal's edit, an
   upgrade's status and the Telegram link are each one POST carrying exactly
   the body SOUL.md section 10 names.

   THE CHARTS are the Observatory's own gold line with its own tooltip
   (obsWireTip, data-tip "label | value"), drawn at the measured pixel width
   of the box they sit in rather than into a fixed viewBox stretched to fit,
   so a label is never squeezed or widened and a dot stays round at any
   width; a resize draws them again. Each chart card keeps the Observatory's
   Table twin, so every value is reachable without a mouse.
   =========================================================================== */
var SOUL={days:90,charts:{},confirm:"",tg:null,editing:"",data:null,cycle:"",wired:false,rt:0};
var SOUL_MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function soulGet(view,extra){return get("/api/soul?view="+view+(extra||""))}
var soulTodayQ=function(f){return cached("soul:today",function(){return soulGet("today")},f)};
var soulMetricsQ=function(d,f){return cached("soul:metrics:"+d,function(){return soulGet("metrics","&days="+d)},f)};
var soulChronQ=function(f){return cached("soul:chron",function(){return soulGet("chronicle","&limit=30")},f)};
var soulEvoQ=function(f){return cached("soul:evo",function(){return soulGet("evolution")},f)};
var soulAuditQ=function(f){return cached("soul:audit",function(){return soulGet("audit","&limit=50")},f)};
/* a read that could not reach the house at all is told apart from one the
   house answered with a refusal, because the two mean different things */
function soulRead(p){return p.then(function(r){return r},function(){return {ok:false,status:0,j:null,net:true}})}
function soulOk(r){return !!(r&&r.ok&&r.j&&r.j.ok!==false)}
function soulPostOk(r){return !!(r&&r.ok&&r.j&&r.j.ok!==false)}
function soulErrText(r){
  if(!r||r.net)return "Could not reach the house.";
  if(r.locked)return "The key has expired.";
  var e=String((r.j&&r.j.error)||"");
  if(r.status===503||/store|redis|upstash|\bkv\b/i.test(e))return "The store is unreachable.";
  if(r.status===404)return "The Lantern is not on this deployment yet.";
  return "The Lantern could not be read.";
}
function soulErrCard(r,what){

/* ---- reading a number the way the house sends it ----

/* ---- the paste kit ----
   A piece of outreach is two or three fields going into two or three boxes,
   and it usually wants a small edit first, so what comes back is editable in
   place, counts itself against the channel's limit, and copies field by
   field rather than arriving as one block with "Subject:" glued to the top. */
var KITN=0;
function kitLimit(ch){var c=String(ch||"").toLowerCase();
  if(/(^|\W)x(\W|$)|twitter/.test(c))return 280;
  if(/threads|mastodon/.test(c))return 500;
  if(/instagram/.test(c))return 2200;
  return 0}
function kitBlanks(t){var m=String(t||"").match(/\[[^\]\n]{2,40}\]/g);return m?m.slice(0,6):[]}
function kit(o){
  var lim=kitLimit(o.channel),gaps=kitBlanks((o.subject||"")+" "+(o.body||""));
  var h='<div class="card" data-kit="k'+(++KITN)+'" data-lim="'+lim+'">'
    +'<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><b style="color:var(--cream)">'+esc(o.label||"A draft")+'</b>'
    +(o.channel?'<span class="pill">'+esc(o.channel)+'</span>':'')
    +'<span class="faint small" data-count style="margin-left:auto"></span></div>'
    +(o.note?'<p class="muted small" style="margin:6px 0 0">'+esc(o.note)+'</p>':'');
  if(o.subject!=null)h+='<p class="sec" style="margin:12px 0 4px">'+esc(o.subjectLabel||"Subject")+'</p><input class="fi" data-sub value="'+esc(o.subject)+'"/>';
  h+='<p class="sec" style="margin:12px 0 4px">'+esc(o.bodyLabel||"Message")+'</p>'
    +'<textarea class="fi" data-body rows="'+Math.min(18,Math.max(4,Math.ceil(String(o.body||"").length/64)))+'">'+esc(o.body||"")+'</textarea>';
  if(gaps.length)h+='<p class="small" style="margin:8px 0 0;color:var(--wait)">Fill in before sending: '+esc(gaps.join(" · "))+'</p>';
  h+='<div class="acts">'
    +(o.subject!=null?'<button class="btn ghost sm" data-cp="sub">Copy the '+esc(String(o.subjectLabel||"subject").toLowerCase())+'</button>':'')
    +'<button class="btn ghost sm" data-cp="body">Copy the '+esc(String(o.bodyLabel||"message").toLowerCase())+'</button>'
    +(o.subject!=null?'<button class="btn ghost sm" data-cp="both">Copy both</button>':'')
    +(o.mail?'<button class="btn ghost sm" data-cp="mail">Open in mail</button>':'')
    +'</div></div>';
  return h}
function kitCount(card){
  var body=card.querySelector("[data-body]"),c=card.querySelector("[data-count]"),lim=+card.dataset.lim||0;
  if(!body||!c)return;
  var t=body.value||"",w=t.trim()?t.trim().split(/\s+/).length:0;
  c.textContent=w+" words · "+t.length+" characters"+(lim?" · limit "+lim:"");
  c.style.color=lim&&t.length>lim?"var(--bad)":"";
}
function kitBind(root){if(!root)return;
  root.querySelectorAll("[data-kit]").forEach(function(c){kitCount(c);
    var b=c.querySelector("[data-body]");if(b)b.addEventListener("input",function(){kitCount(c)})})}
function fallbackCopy(text){
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();var done=false;
  try{done=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);return done}
function copyText(text){
  var yes=function(){toast("Copied.")},no=function(){toast("The browser refused the clipboard.",true)};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    return navigator.clipboard.writeText(text).then(yes,function(){fallbackCopy(text)?yes():no()});
  fallbackCopy(text)?yes():no()}
function kitCopy(b){
  var card=b.closest("[data-kit]");if(!card)return;
  var sub=card.querySelector("[data-sub]"),body=card.querySelector("[data-body]");
  var s=sub?sub.value:"",t=body?body.value:"",what=b.dataset.cp;
  if(what==="mail")return void window.open("mailto:?subject="+encodeURIComponent(s)+"&body="+encodeURIComponent(t),"_blank");
  copyText(what==="sub"?s:(what==="both"?(s?s+"\n\n":"")+t:t))}

/* ---- Make a package: the Content Factory ----

function pkgBlock(label,text,limit){

}
function pkgRoomList(rows){

}
function pkgRender(r){

  h+='<p class="sec">Derivatives</p><div class="card">'

  h+='<p class="sec">Drafts</p>';
  if(dr.youtube)h+=pkgBlock("YouTube · title",dr.youtube.title,100)+pkgBlock("YouTube · description",dr.youtube.description,4900);

  if(dr.x&&dr.x.length)dr.x.forEach(function(t,i){h+=pkgBlock("X thread · post "+(i+1)+" of "+dr.x.length,t,280)});

function pkgGo(b){

/* Everything written here appears at /journal the moment it is saved as
   published: no zip, no upload, no deploy. The desk carries no author field
   and no signature, and nothing it sends out can name the writer -- the
   journal is the house's opinion, not a person's, and that is kept absolute
   exactly as the old desk kept it. */
var JW={open:false,editing:null,prev:false,say:"",d:{title:"",dek:"",body:"",tags:"",slug:""}};
function jwWords(){var w=String(JW.d.body||"").split(/\s+/).filter(Boolean).length;
  return w?(w+" words · about "+Math.max(1,Math.round(w/220))+" min"):""}
/* a faithful local echo of the small markup rules the site's own renderer
   uses, so a preview costs nothing and saves no draft */
function jwRender(md){
  return String(md||"").replace(/\r\n?/g,"\n").split(/\n{2,}/).map(function(b){
    b=b.trim();if(!b)return "";
    var inl=function(t){return esc(t)
      .replace(/\*\*([^*]{1,200})\*\*/g,"<strong>$1</strong>")
      .replace(/\*([^*]{1,200})\*/g,"<em>$1</em>")
      .replace(/\[([^\]]{1,120})\]\((https?:\/\/[^\s)]{1,300}|\/[^\s)]{0,200})\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g,"<br>")};
    if(/^---+$/.test(b))return '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">';
    if(/^###\s+/.test(b))return '<p class="ttl" style="font-size:15px">'+inl(b.replace(/^###\s+/,""))+'</p>';
    if(/^##\s+/.test(b))return '<p class="ttl" style="font-size:17px">'+inl(b.replace(/^##\s+/,""))+'</p>';
    if(/^>\s?/.test(b))return '<p class="small" style="border-left:2px solid var(--gold-dim);padding-left:12px;color:var(--muted);margin:10px 0">'+inl(b.split("\n").map(function(l){return l.replace(/^>\s?/,"")}).join("\n"))+'</p>';
    if(/^[-*]\s+/.test(b))return '<ul class="small" style="margin:10px 0;padding-left:18px">'+b.split("\n").filter(function(l){return /^[-*]\s+/.test(l)}).map(function(l){return "<li>"+inl(l.replace(/^[-*]\s+/,""))+"</li>"}).join("")+'</ul>';
    return '<p class="small" style="margin:10px 0;line-height:1.8">'+inl(b)+'</p>';
  }).join("");
}

/* ================= CONTROLS ================= */
/* THE DIALS. The last thing that lived only on the old console: every switch
   this house has, read from GET /api/settings?all=1 and written back with a
   POST carrying nothing but the dials that were moved.

   Four rules it keeps.
   1. Nothing is live until Save. A row that has been touched is marked, the
      bar at the foot counts the marks, and Discard puts every one of them
      back without asking the house anything.
   2. Only what was moved is sent. A dial typed back to the value it already
      holds stops being a change, so a save is never a rewrite of the whole
      table.
   3. A dial the house refuses keeps its mark and says why, in the house's own
      words. Snapping back to the old value as though nothing had happened is
      how an owner comes to distrust a control panel.
   4. Every value is shown as it is: a number is the number, never dressed as
      money and never given a currency.  */
var CTL={dirty:{},refused:{},list:null,by:{},store:true};
function ctlHere(d){return /^set here/.test(String(d&&d.src||""))}
/* where the value comes from, in three words at most: the house's own src,
   with "built in" said as what an owner would call it */
function ctlSrc(d){var s=String(d&&d.src||"");
  if(ctlHere(d))return "set here";
  if(/^env/.test(s))return s;
  return "default"}
function ctlVal(d){return (d.k in CTL.dirty)?CTL.dirty[d.k]:d.value}
function ctlCtl(d){
  var v=ctlVal(d),k=esc(d.k),n=esc(d.n);
  if(d.t==="bool")
    return '<button type="button" class="sw" role="switch" aria-checked="'+(v?"true":"false")+'" data-dial="'+k+'" aria-label="'+n+'"></button>';
  if(d.t==="int"||d.t==="num")
    return '<input class="fi numi" type="number" inputmode="numeric" step="1" min="'+esc(String(d.min==null?0:d.min))+'" max="'+esc(String(d.max==null?999999:d.max))+'" value="'+esc(v==null?"":String(v))+'" data-dial="'+k+'" aria-label="'+n+'"/>';
  if(d.t==="enum"){var o=(d.opts||[]).slice(0,6);
    return '<div class="seg" role="group" aria-label="'+n+'" style="grid-template-columns:repeat('+Math.max(1,o.length)+',1fr)">'
      +o.map(function(x){var on=String(v)===String(x);
        return '<button type="button" data-dial="'+k+'" data-opt="'+esc(x)+'" aria-pressed="'+(on?"true":"false")+'" class="'+(on?"on":"")+'">'+esc(x)+'</button>'}).join("")+'</div>'}
  return '<input class="fi txti" type="text" maxlength="'+esc(String(d.max||200))+'" value="'+esc(v==null?"":String(v))+'" data-dial="'+k+'" aria-label="'+n+'" placeholder="empty means none"/>';
}
function ctlRow(d){
  var chg=(d.k in CTL.dirty),why=CTL.refused[d.k]||"";
  return '<div class="dial'+(chg?" dirty":"")+'" data-row="'+esc(d.k)+'">'
    +'<div class="dt"><b>'+esc(d.n)+'</b><div class="dh">'+esc(d.h||"")+'</div>'
    +'<div class="tags"><span class="src">'+esc(ctlSrc(d))+'</span><span class="src chg"'+(chg?"":" hidden")+'>changed</span></div>'
    +'<div class="why"'+(why?"":" hidden")+'>'+esc(why)+'</div></div>'
    +'<div class="dc">'+ctlCtl(d)+'</div></div>';
}
function ctlBar(){
  var n=Object.keys(CTL.dirty).length;
  return '<div class="savebar" id="ctl-bar"'+(n?"":" hidden")+'>'
    +'<span class="n" id="ctl-n">'+n+' change'+(n===1?"":"s")+'</span> <span class="sp">·</span> '
    +'<button class="btn sm" id="ctl-save">Save</button> <span class="sp">·</span> '
    +'<button class="btn ghost sm" id="ctl-discard">Discard</button></div>';
}
/* the marks are painted rather than redrawn, so a number being typed keeps
   the cursor it is being typed with */
function ctlPaint(){
  var el=$("s-controls");if(!el||!CTL.list)return;
  CTL.list.forEach(function(d){
    var row=el.querySelector('[data-row="'+d.k+'"]');if(!row)return;
    var chg=(d.k in CTL.dirty),v=ctlVal(d),why=CTL.refused[d.k]||"";
    row.classList.toggle("dirty",chg);
    var tag=row.querySelector(".src.chg");if(tag)tag.hidden=!chg;
    var w=row.querySelector(".why");if(w){w.textContent=why;w.hidden=!why}
    if(d.t==="bool"){var sw=row.querySelector(".sw");if(sw)sw.setAttribute("aria-checked",v?"true":"false")}
    if(d.t==="enum")row.querySelectorAll("[data-opt]").forEach(function(b){
      var on=String(b.dataset.opt)===String(v);b.setAttribute("aria-pressed",on?"true":"false");b.classList.toggle("on",on)});
  });
  var n=Object.keys(CTL.dirty).length,bar=$("ctl-bar"),lab=$("ctl-n");
  if(lab)lab.textContent=n+" change"+(n===1?"":"s");
  if(bar)bar.hidden=!n;
}
function ctlSet(d,v){
  /* a dial moved back to what it already holds is not a change */
  if(String(v)===String(d.value))delete CTL.dirty[d.k];
  else CTL.dirty[d.k]=v;
  delete CTL.refused[d.k];
  ctlPaint();
}
function drawControls(force){
  var el=$("s-controls");
  if(!el.dataset.built){el.innerHTML=BACK+'<p class="sec">The dials</p>'+skel(3);el.dataset.built="1"}
  return settingsQ(force).then(function(j){
    j=j||{};
    var ds=(j.dials||[]).filter(function(d){return d&&d.k});
    CTL.store=j.store!==false;CTL.list=ds;CTL.by={};
    ds.forEach(function(d){CTL.by[d.k]=d});
    /* a dial that has gone out of the house since it was touched cannot be
       saved, so its mark goes with it rather than sitting there unsendable */
    Object.keys(CTL.dirty).forEach(function(k){if(!CTL.by[k]){delete CTL.dirty[k];delete CTL.refused[k]}});
    var groups=[],seen={};
    ds.forEach(function(d){var g=d.g||"The house";if(!seen[g]){seen[g]=[];groups.push(g)}seen[g].push(d)});
    var here=ds.filter(ctlHere).length;
    el.innerHTML=BACK
      +'<p class="sec">The dials</p>'
      +'<p class="muted small" style="margin:-6px 0 10px">Every switch this house has, in one place. Nothing is live until you save, and a dial set here overrides what the environment says: put it back to its default and the environment answers for it again.</p>'
      +(CTL.store?'':'<div class="card"><b style="color:var(--bad)">No store is connected, so nothing here can be saved.</b><p class="muted small" style="margin:6px 0 0">Every dial below is showing what the environment or the code says. Add REDIS_URL in Vercel and this room starts working.</p></div>')
      +(ds.length
        ?groups.map(function(g){return '<p class="sec">'+esc(g)+'</p>'+seen[g].map(ctlRow).join("")}).join("")
        :'<div class="empty">No dial came back, so there is nothing to turn here.</div>')
      +(ds.length?'<p class="faint small" style="margin:12px 0 0">'+esc(here+" of "+ds.length+" dials are set here; the rest are what the environment or the code says. A dial reads on the next request, not on the next deploy.")+'</p>':'')
      +ctlBar();
    el.onclick=function(e){
      var b=e.target.closest&&e.target.closest("button");if(!b)return;
      if(b.id==="ctl-save")return ctlSave(b);
      if(b.id==="ctl-discard"){CTL.dirty={};CTL.refused={};return void drawControls(false)}
      var d=CTL.by[b.dataset.dial||""];if(!d)return;
      if(d.t==="bool")return ctlSet(d,b.getAttribute("aria-checked")!=="true");
      if(d.t==="enum"&&b.dataset.opt!=null)return ctlSet(d,b.dataset.opt);
    };
    var typed=function(e){
      var t=e.target,d=CTL.by[(t&&t.dataset&&t.dataset.dial)||""];if(!d)return;
      if(d.t==="int"||d.t==="num"){
        var n=parseFloat(String(t.value).replace(/[\s,]/g,""));
        if(!isFinite(n))return;
        if(d.min!=null&&n<d.min)n=d.min;
        if(d.max!=null&&n>d.max)n=d.max;
        return ctlSet(d,d.t==="int"?Math.round(n):n)}
      if(d.t==="text")ctlSet(d,t.value);
    };
    el.oninput=typed;el.onchange=typed;
  }).catch(function(){el.innerHTML=BACK+'<div class="card" style="margin-top:12px"><b style="color:var(--bad)">The dials could not be read.</b><p class="muted small" style="margin:6px 0 0">Press refresh at the top to ask again.</p></div>'});
}
function ctlSave(b){
  var keys=Object.keys(CTL.dirty);
  if(!keys.length||INFLIGHT.dials)return;
  var body={};keys.forEach(function(k){body[k]=CTL.dirty[k]});
  var was=b.textContent;b.disabled=true;b.textContent="Saving…";INFLIGHT.dials=1;
  post("/api/settings",body).then(function(r){
    delete INFLIGHT.dials;
    var j=r.j||{},refused=Array.isArray(j.refused)?j.refused:[];
    if(r.locked)return;
    if(!r.ok&&!refused.length){b.disabled=false;b.textContent=was;toast(j.error||"It refused.",true);return}
    /* the house names the dial it would not take at the head of its sentence,
       so the reason is filed on that row and the row keeps its mark */
    var kept={};
    refused.forEach(function(line){
      var s=String(line);
      var k=keys.filter(function(x){return s.indexOf(x)===0})[0];
      if(!k)return;
      kept[k]=1;CTL.refused[k]=s.slice(k.length).replace(/^[:\s]+/,"")||"the house would not take this value";
    });
    keys.forEach(function(k){if(!kept[k]){delete CTL.dirty[k];delete CTL.refused[k]}});
    toast(refused.length?"The house refused "+refused.join("; ")+".":"Saved.",refused.length>0);
    C.settings=null;C.house=null;LOADED.house=false;
    drawControls(true);
  }).catch(function(){delete INFLIGHT.dials;unreachable(b,was)()});
}

/* ---------- the gate ---------- */
function unlock(){$("gate").hidden=true;$("app").classList.add("on");try{localStorage.setItem("noor_nocount","1")}catch(e){}
  clock();if(!unlock.tick)unlock.tick=setInterval(clock,30000);bust();show((location.hash||"").replace("#","")||"home",true)}
function tryKey(){var pw=$("pw").value;if(!pw)return;$("enter").disabled=true;$("err").textContent="";
  post("/api/admin-auth",{password:pw}).then(function(r){if(r.ok&&r.j.ok)unlock();else{$("err").textContent=r.status===501?"The house has no key set (ADMIN_PASSWORD).":"That is not the key.";$("enter").disabled=false}}).catch(function(){$("err").textContent="Could not reach the house.";$("enter").disabled=false})}
$("enter").addEventListener("click",tryKey);$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")tryKey()});
fetch("/api/admin-data",{credentials:"same-origin"}).then(function(r){if(r.ok)unlock()}).catch(function(){});
window.NOOR_CONSOLE={show:show,bust:bust,get cur(){return CUR}};
})();
