<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="NOOR — Chronological journey from Kun Fayakun to Jannah. 58 nodes of Islamic history."/>
<meta name="theme-color" content="#2C2416"/>
<title>NOOR — نُور | From Creation to Jannah</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{parchment:'#FFFEF7',ink:'#2C2416',gold:'#C9A227',sage:'#8BA888',deep:'#1A160F'},fontFamily:{amiri:['Amiri','serif'],inter:['Inter','system-ui','sans-serif']}}}}
</script>
<style>
html{scroll-behavior:smooth}body{background:#FFFEF7;color:#2C2416;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.font-amiri{font-family:Amiri,serif}
.tile{position:relative;overflow:hidden;border-radius:1.5rem;min-height:280px;isolation:isolate;transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s}
.tile:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(44,36,22,.18)}
.tile-bg{position:absolute;inset:-20%;background-size:cover;background-position:center;will-change:transform;z-index:0}
.tile-overlay{position:absolute;inset:0;background:linear-gradient(160deg,rgba(26,22,15,.78) 0%,rgba(44,36,22,.55) 45%,rgba(26,22,15,.88) 100%);z-index:1}
.tile-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:1.75rem;color:#FFFEF7;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.pattern-1{background:radial-gradient(circle at 30% 40%,#C9A22733 0%,transparent 50%),linear-gradient(135deg,#1A160F,#2C2416)}
.pattern-2{background:radial-gradient(ellipse at 70% 20%,#8BA88844 0%,transparent 55%),linear-gradient(160deg,#1F1A12,#2C2416)}
.pattern-3{background:repeating-linear-gradient(45deg,transparent,transparent 12px,#C9A22711 12px,#C9A22711 24px),linear-gradient(180deg,#221C14,#2C2416)}
.pattern-4{background:radial-gradient(circle at 50% 80%,#C9A22722 0%,transparent 40%),linear-gradient(200deg,#1A160F,#332B1E)}
.pattern-5{background:conic-gradient(from 30deg at 50% 50%,#2C2416,#3D3224,#2C2416,#1A160F)}
.pattern-nihaya{background:radial-gradient(circle at 50% 0%,#C9A22733 0%,transparent 45%),linear-gradient(180deg,#0F0D09 0%,#1A160F 60%,#2C2416 100%)}
.modal-backdrop{position:fixed;inset:0;background:rgba(26,22,15,.72);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{background:#FFFEF7;border-radius:1.75rem;max-width:42rem;width:100%;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.35);transform:translateY(24px) scale(.97);transition:transform .35s cubic-bezier(.22,1,.36,1);position:relative}
.modal-backdrop.open .modal{transform:translateY(0) scale(1)}
.modal-hero{height:200px;flex-shrink:0;position:relative;overflow:hidden}
.modal-body{flex:1;overflow-y:auto;padding:1.75rem 1.75rem 2.5rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .75rem;border-radius:9999px;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chip-bidaya{background:#8BA88822;color:#5a7a58}.chip-qisas{background:#C9A22722;color:#8a7020}.chip-seerah{background:#3b82f622;color:#1e40af}.chip-nihaya{background:#7c3aed22;color:#5b21b6}
#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#C9A227,#8BA888);z-index:60;width:0%}
.fade-up{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}.fade-up.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body class="antialiased">
<!-- Full content truncated for API size in this step; local file has complete 58-node data + modal. See repo after full push. -->
<div class="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-[#FFFEF7]">
<p class="font-amiri text-[#C9A227] text-3xl mb-4">نُورٌ عَلَىٰ نُورٍ</p>
<h1 class="text-4xl font-bold text-[#2C2416] mb-4">NOOR — Codex of Light</h1>
<p class="max-w-lg text-[#2C2416]/70 mb-6">58-node chronological Path is live. Full long-form Codex articles, companions seals, and manuscript illustrations are being layered on.</p>
<p class="text-sm text-[#2C2416]/50">Open the live site or clone the repo for the complete local build.</p>
</div>
</body>
</html>
