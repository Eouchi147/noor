<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Prayer Board · NOOR</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/mark.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="salat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#141b3a 0%,#0a1128 55%,#04060F 100%);color:#FFFEF7;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;cursor:none}
body.mouse{cursor:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:2.2vh 3vw 0}
.mname{font-size:3.4vh;font-weight:800;color:#F4D46A}
.mname span{display:block;font-size:1.5vh;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,254,247,.45)}
.dates{text-align:end;font-size:2vh;color:rgba(255,254,247,.75);line-height:1.5}
.dates .hijri{color:#F4D46A;font-family:Amiri,serif;font-size:2.4vh}
.clockrow{text-align:center;margin-top:1vh}
#clock{font-size:13vh;font-weight:900;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
#clock small{font-size:4vh;font-weight:700;color:rgba(255,254,247,.6)}
#next{margin-top:.8vh;font-size:2.4vh;color:rgba(255,254,247,.7)}
#next b{color:#F4D46A}
#next .cd{font-variant-numeric:tabular-nums;font-weight:800;color:#FFF7DF}
.grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:1.2vw;padding:2.4vh 3vw;align-content:center}
.pt{background:rgba(255,254,247,.05);border:1px solid rgba(244,212,106,.28);border-radius:2vh;text-align:center;padding:2.6vh 1vw;transition:all .4s}
.pt .nm{font-size:2.4vh;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,254,247,.75)}
.pt .ar{font-family:Amiri,serif;font-size:2.6vh;line-height:1.5;color:rgba(244,212,106,.75);display:block;margin-top:.6vh}
.pt .adh{font-size:4.1vh;font-weight:900;margin-top:1.2vh;font-variant-numeric:tabular-nums;white-space:nowrap}
.pt .iq{font-size:2vh;color:rgba(255,254,247,.55);margin-top:.8vh;font-variant-numeric:tabular-nums}
.pt .iq b{color:#E9C86A;font-weight:800}
.pt.jum{border-color:rgba(244,212,106,.85);background:linear-gradient(160deg,rgba(201,162,39,.2),rgba(244,212,106,.06))}
.pt.jum .nm{color:#F4D46A}
.pt.now{background:linear-gradient(160deg,rgba(201,162,39,.28),rgba(244,212,106,.1));border-color:#F4D46A;
  box-shadow:0 0 5vh rgba(244,212,106,.25);transform:scale(1.04);
  animation:noorBreathe 3.4s ease-in-out infinite}
/* a slow breath, near the pace of a calm one, so the eye is drawn and not
   nagged. A board is looked at from across a hall, often by somebody walking:
   the glow does the work that reading a small label cannot. */
@keyframes noorBreathe{
  0%,100%{box-shadow:0 0 3.2vh rgba(244,212,106,.18),0 0 0 0 rgba(244,212,106,.16);border-color:rgba(244,212,106,.72);transform:scale(1.035)}
  50%    {box-shadow:0 0 7.5vh rgba(244,212,106,.42),0 0 0 .5vh rgba(244,212,106,.09);border-color:#FFF0B8;transform:scale(1.055)}
}
.pt.now .adh{animation:noorGlowText 3.4s ease-in-out infinite}
@keyframes noorGlowText{
  0%,100%{text-shadow:0 0 0 rgba(244,212,106,0)}
  50%    {text-shadow:0 0 2.4vh rgba(244,212,106,.55)}
}
/* the countdown to it breathes with it, so the two read as one thing */
#next .cd{animation:noorGlowText 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .pt.now,.pt.now .adh,#next .cd{animation:none}
  .pt.now{box-shadow:0 0 6vh rgba(244,212,106,.34);border-color:#FFF0B8}
}
.pt.past{opacity:.45}
/* ---- the Friday panel: the single most-read thing on the screen ---- */
#jpanel[hidden]{display:none}
#jpanel{margin:1.4vh 3vw 0;border:.28vh solid rgba(244,212,106,.6);border-radius:2.2vh;
  background:linear-gradient(150deg,rgba(201,162,39,.26),rgba(244,212,106,.05) 70%);
  box-shadow:0 0 6vh rgba(244,212,106,.14) inset;display:flex;align-items:center;gap:2.2vw;padding:1.5vh 2.2vw}
#jpanel .jt{flex:none;text-align:center;padding-inline-end:2.2vw;border-inline-end:1px solid rgba(244,212,106,.3)}
#jpanel .jt .jn{display:block;font-size:3vh;font-weight:900;color:#F4D46A;letter-spacing:.04em;line-height:1.1}
#jpanel .jt .jar{display:block;font-family:Amiri,serif;font-size:2.6vh;color:rgba(244,212,106,.75);margin-top:.2vh}
#jpanel .js{flex:1;display:flex;gap:1.4vw}
#jpanel .sit{flex:1;text-align:center;background:rgba(255,254,247,.06);border:1px solid rgba(255,254,247,.1);
  border-radius:1.6vh;padding:1vh .7vw}
#jpanel .sit .lb{font-size:1.8vh;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,254,247,.6);line-height:1.3}
#jpanel .sit .kh{font-size:4.4vh;font-weight:900;color:#FFF7DF;margin-top:.3vh;font-variant-numeric:tabular-nums;line-height:1.1}
#jpanel .sit .kh .tg{font-size:.36em;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(244,212,106,.8);margin-inline-end:.5vw;vertical-align:.32em}
#jpanel .sit .iq{font-size:1.9vh;color:rgba(255,254,247,.6);margin-top:.4vh;font-variant-numeric:tabular-nums}
#jpanel .sit .iq b{color:#E9C86A;font-weight:800}
@media (max-width:900px){#jpanel{flex-direction:column;gap:1vh}#jpanel .jt{border-inline-end:0;padding-inline-end:0}#jpanel .js{width:100%}}
footer{display:flex;justify-content:space-between;align-items:center;padding:0 3vw 2vh;font-size:1.9vh;color:rgba(255,254,247,.6)}
#ann{flex:1;overflow:hidden;white-space:nowrap;margin:0 2vw}
#ann span{display:inline-block;padding-inline-start:100%;animation:tick 28s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.jum{color:#F4D46A;font-weight:800}
.brand{color:rgba(255,254,247,.35);font-size:1.6vh}
.est{position:fixed;top:1vh;left:50%;transform:translateX(-50%);font-size:1.5vh;color:rgba(244,212,106,.65)}
/* ---- the phone -------------------------------------------------------
   The board is built for a screen on a wall: one fixed viewport, nothing
   scrolls, everything measured in vh. A phone is none of those things. Held
   in a hand it has a third of the width and the grid was scrolling inside a
   locked page, which cut the labels off the top row and hid Fajr behind the
   Friday panel. On a phone the page simply scrolls, and the type is sized in
   rem so it stays readable instead of shrinking with the viewport. */
@media (max-width:820px), (orientation:portrait) and (max-width:1000px){
  html,body{height:auto;min-height:100%}
  body{overflow-y:auto;overflow-x:hidden;cursor:auto;display:block;padding-bottom:4.5rem}
  header{flex-direction:column;align-items:flex-start;gap:.15rem;padding:1rem 1.1rem 0}
  header .dates{text-align:start}
  .mname{font-size:1.5rem}
  .mname span{font-size:.62rem;letter-spacing:.2em}
  .dates div{font-size:.86rem}
  .dates .hijri{font-size:1rem}
  .clockrow{margin-top:.5rem}
  #clock{font-size:4.4rem;line-height:1}
  #clock small{font-size:1.5rem}
  #next{font-size:.95rem;margin-top:.35rem}
  #jpanel{margin:1rem 1.1rem 0;padding:.9rem 1rem;border-radius:1rem;border-width:1.5px;gap:.7rem}
  #jpanel .jt{padding-inline-end:0;border-inline-end:0}
  #jpanel .jt .jn{font-size:1.35rem}
  #jpanel .jt .jar{font-size:1.15rem}
  #jpanel .js{flex-direction:column;gap:.55rem;width:100%}
  #jpanel .sit{border-radius:.8rem;padding:.6rem .7rem}
  #jpanel .sit .lb{font-size:.66rem}
  #jpanel .sit .kh{font-size:1.7rem}
  #jpanel .sit .iq{font-size:.78rem}
  .grid{grid-template-columns:repeat(2,1fr);gap:.6rem;padding:1rem 1.1rem .5rem;overflow:visible;flex:none;align-content:start}
  .pt{border-radius:1rem;padding:.85rem .5rem}
  .pt .nm{font-size:.78rem;letter-spacing:.06em}
  .pt .ar{font-size:1rem;line-height:1.5;margin-top:.28rem}
  .pt .adh{font-size:1.55rem;margin-top:.4rem}
  .pt .iq{font-size:.72rem;margin-top:.3rem}
  /* the glow is scaled to a hand, not a hall */
  .pt.now{transform:none;box-shadow:0 0 1.6rem rgba(244,212,106,.3)}
  @keyframes noorBreathe{
    0%,100%{box-shadow:0 0 1rem rgba(244,212,106,.2);border-color:rgba(244,212,106,.72)}
    50%    {box-shadow:0 0 2.2rem rgba(244,212,106,.5);border-color:#FFF0B8}
  }
  @keyframes noorGlowText{
    0%,100%{text-shadow:0 0 0 rgba(244,212,106,0)}
    50%    {text-shadow:0 0 .7rem rgba(244,212,106,.55)}
  }
  .est{position:static;transform:none;margin:.6rem 1.1rem 0;font-size:.72rem;text-align:center}
  footer{flex-direction:column;gap:.4rem;padding:1rem 1.1rem 1.4rem;font-size:.78rem;text-align:center}
  #ann{margin:0;width:100%}
  .brand{font-size:.7rem}
}
/* a narrow phone gets one column rather than two cramped ones */
@media (max-width:380px){
  .grid{grid-template-columns:1fr}
  #clock{font-size:3.8rem}
}
@media (prefers-reduced-motion: reduce){#ann span{animation:none;padding-inline-start:0}}
</style>
<script src="/assets/noor-text.js?v=1" defer></script>
<link rel="stylesheet" href="/assets/noor-rtl.css?v=1"/>
<script src="/assets/noor-search.js?v=1" defer></script>
</head>
<body>
<header>
<div class="mname" id="mname">Prayer Board<span>NOOR · Codex of Light</span></div>
<div class="dates"><div id="greg"></div><div class="hijri" id="hijri"></div></div>
</header>
<div class="clockrow"><div id="clock">··:··</div><div id="next"></div></div>
<div id="jpanel" hidden></div>
<div class="grid" id="grid"></div>
<div class="est" id="est" hidden>High-latitude estimate for Fajr and Isha (seventh of the night) · verify locally</div>
<footer>
<span class="jum" id="jum"></span>
<div id="ann"><span id="annt"></span></div>
<span class="brand">✦ noorcodex.com/masjid · free forever</span>
</footer>
<script>
(function(){
"use strict";
function cfg(){
  try{ return JSON.parse(decodeURIComponent(escape(atob((location.hash||"#").slice(1).replace(/-/g,"+").replace(/_/g,"/"))))); }
  catch(e){ return null; }
}
var C=cfg()||{n:"Set up your board at noorcodex.com/masjid",lat:45.4215,lng:-75.6972,m:"ISNA",a:"standard",iq:{fajr:20,dhuhr:10,asr:10,maghrib:5,isha:10},jumuah:"",ann:[],h24:false,lang:"en"};
var L={
 en:{fajr:"Fajr",sunrise:"Sunrise",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha",iqamah:"Iqamah",next:"Next",jumuah:"Jumu'ah",in_:"in",khutba:"Khutba",thisfri:"This Friday"},
 fr:{fajr:"Fajr",sunrise:"Lever",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha",iqamah:"Iqama",next:"Prochaine",jumuah:"Joumou'a",in_:"dans",khutba:"Khoutba",thisfri:"Ce vendredi"},
 ar:{fajr:"الفجر",sunrise:"الشروق",dhuhr:"الظهر",asr:"العصر",maghrib:"المغرب",isha:"العشاء",iqamah:"الإقامة",next:"التالية",jumuah:"الجمعة",in_:"بعد",khutba:"الخطبة",thisfri:"هذه الجمعة"},
 ur:{fajr:"فجر",sunrise:"طلوع",dhuhr:"ظہر",asr:"عصر",maghrib:"مغرب",isha:"عشاء",iqamah:"اقامت",next:"اگلی",jumuah:"جمعہ",in_:"بعد",khutba:"خطبہ",thisfri:"اس جمعہ"}
}[C.lang||"en"]||{};
var AR={fajr:"الْفَجْر",sunrise:"الشُّرُوق",dhuhr:"الظُّهْر",asr:"الْعَصْر",maghrib:"الْمَغْرِب",isha:"الْعِشَاء"};
document.getElementById("mname").innerHTML=(C.n||"Prayer Board").replace(/[<>]/g,"")+'<span>NOOR · Codex of Light</span>';
if(C.ann&&C.ann.length)document.getElementById("annt").textContent=C.ann.join("  ·  ");

/* ---- Jumu'ah, the Friday gathering ----
   New boards carry C.ju: on/off, the sittings the masjid actually runs, whether
   Jumu'ah stands in place of Dhuhr on Friday, and whether the other six days
   carry a quiet notice. Boards written by the older wizard carry only the plain
   C.jumuah line, and they keep behaving exactly as they always did. */
function clean(t,n){return String(t==null?"":t).replace(/[<>]/g,"").slice(0,n||40)}
function jparse(v){                       /* "13:15", "1:15 PM", or the masjid's own words */
  var m=String(v==null?"":v).trim().match(/^(\d{1,2})[:.](\d{2})\s*([AaPp])?\.?[Mm]?\.?$/);
  if(!m)return null;
  var h=+m[1],mi=+m[2];
  if(m[3]){var ap=m[3].toLowerCase();if(ap==="p"&&h<12)h+=12;if(ap==="a"&&h===12)h=0}
  if(h>23||mi>59)return null;
  return h+mi/60;
}
function jtime(v){                        /* the board's own clock format, or the words as typed */
  var h=jparse(v);
  if(h!==null)return window.NOOR_FMT_TIME(h,C.h24);
  return clean(v,24);
}
var HASJU=!!(C.ju&&typeof C.ju==="object");
var JU=(function(){
  var j=C.ju;
  if(!j||j.on===false||j.on===0)return null;
  var raw=(j.s&&j.s.length)?j.s:[];
  var list=[];
  for(var i=0;i<raw.length&&list.length<6;i++){
    var k=jtime(raw[i]&&raw[i].k);
    if(!k)continue;
    list.push({l:clean(raw[i].l,40),k:k,i:jtime(raw[i].i),h:jparse(raw[i]&&raw[i].k)});
  }
  if(!list.length)return null;
  return {rep:j.rep!==false,all:j.all!==false,s:list};
})();
var ORDER=["fajr","sunrise","dhuhr","asr","maghrib","isha"];
/* The wizard's preview asks for the Friday screen. It used to ask with
   ?friday=1, which meant the request had to survive the clean URL redirect from
   board.html to board, and the query did not always make it. The flag now also
   rides inside the config in the hash, which cannot be dropped, so an imam who
   sets up three sittings sees them immediately instead of a normal Tuesday. */
var FORCEFRI=/[?&]friday=1/.test(location.search||"")||C._fri===1||C._fri===true;
var TZ=C.tz||Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
function zoned(d){ /* the masjid's own clock, whatever the TV thinks */
  try{
    var p={};new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(d).forEach(function(x){p[x.type]=x.value});
    return {y:+p.year,mo:+p.month,d:+p.day,h:+p.hour%24,mi:+p.minute,s:+p.second,key:p.year+"-"+p.month+"-"+p.day};
  }catch(e){return {y:d.getFullYear(),mo:d.getMonth()+1,d:d.getDate(),h:d.getHours(),mi:d.getMinutes(),s:d.getSeconds(),key:d.toDateString()};}
}
function zOffset(d){
  try{
    var z=new Date(d.toLocaleString("en-US",{timeZone:TZ}));
    var u=new Date(d.toLocaleString("en-US",{timeZone:"UTC"}));
    return Math.round((z-u)/60000)/60;
  }catch(e){return -d.getTimezoneOffset()/60;}
}
/* the Friday panel, or the quiet line the rest of the week */
function paintJumuah(){
  var panel=document.getElementById("jpanel"),foot=document.getElementById("jum");
  if(!JU){                                  /* a board from the older wizard: exactly as before */
    panel.hidden=true;panel.innerHTML="";
    foot.textContent=(!HASJU&&C.jumuah)?((L.jumuah||"Jumu'ah")+" · "+clean(C.jumuah,60)):"";
    return;
  }
  if(isFri){
    var cells="";
    JU.s.forEach(function(x){
      cells+='<div class="sit">'+(x.l?'<div class="lb">'+x.l+"</div>":"")+
        '<div class="kh"><span class="tg">'+(L.khutba||"Khutba")+"</span>"+x.k+"</div>"+
        (x.i?'<div class="iq">'+(L.iqamah||"Iqamah")+' · <b>'+x.i+"</b></div>":"")+"</div>";
    });
    panel.innerHTML='<div class="jt"><span class="jn">'+(L.jumuah||"Jumu'ah")+"</span>"+
      (((C.lang||"en")==="ar")?"":'<span class="jar">الْجُمُعَة</span>')+
      '</div><div class="js">'+cells+"</div>";
    panel.hidden=false;
    foot.textContent="";
    return;
  }
  panel.hidden=true;panel.innerHTML="";
  if(JU.all){
    var line=JU.s.map(function(x){return (x.l?x.l+" ":"")+x.k}).join("  ·  ");
    if(line.length>58)line=JU.s.map(function(x){return x.k}).join("  ·  ");
    foot.textContent=(L.jumuah||"Jumu'ah")+" · "+(L.thisfri||"This Friday")+" · "+line;
  }else foot.textContent="";
}

var times=null,shown=null,dayKey="",isFri=false;
function compute(){
  var now=new Date(), z=zoned(now);
  var noonUTC=new Date(Date.UTC(z.y,z.mo-1,z.d,12,0,0));
  times=window.NOOR_SALAT(noonUTC,C.lat,C.lng,{method:C.m,asr:C.a,tzOff:zOffset(now)});
  dayKey=z.key;
  isFri=FORCEFRI||(new Date(Date.UTC(z.y,z.mo-1,z.d)).getUTCDay()===5);   /* Friday in the masjid's own zone */
  document.getElementById("est").hidden=!times.estimated;
  document.getElementById("greg").textContent=now.toLocaleDateString(undefined,{timeZone:TZ,weekday:"long",year:"numeric",month:"long",day:"numeric"});
  try{document.getElementById("hijri").textContent=new Intl.DateTimeFormat((C.lang||"en")+"-u-ca-islamic-umalqura",{timeZone:TZ,day:"numeric",month:"long",year:"numeric"}).format(now);}catch(e){}
  /* on Friday the first sitting may stand in the place of Dhuhr, by the masjid's choice */
  var stands=!!(JU&&isFri&&JU.rep);
  shown={};ORDER.forEach(function(k){shown[k]=times[k]});
  if(stands&&JU.s[0].h!==null)shown.dhuhr=JU.s[0].h;
  var g=document.getElementById("grid");g.innerHTML="";
  ORDER.forEach(function(k){
    var j=(stands&&k==="dhuhr");
    var d=document.createElement("div");d.className="pt"+(j?" jum":"");d.id="pt-"+k;
    var iq="";
    if(j){ if(JU.s[0].i)iq='<div class="iq">'+(L.iqamah||"Iqamah")+' · <b>'+JU.s[0].i+"</b></div>" }
    else if(C.iq&&C.iq[k]!=null&&k!=="sunrise")iq='<div class="iq">'+(L.iqamah||"Iqamah")+' · <b>'+window.NOOR_FMT_TIME(times[k]+C.iq[k]/60,C.h24)+"</b></div>";
    d.innerHTML='<div class="nm">'+(j?(L.jumuah||"Jumu'ah"):(L[k]||k))+'</div><span class="ar">'+
      (j?"الْجُمُعَة":AR[k])+'</span><div class="adh">'+
      (j?JU.s[0].k:window.NOOR_FMT_TIME(times[k],C.h24))+"</div>"+iq;
    g.appendChild(d);
  });
  paintJumuah();
}
function tick(){
  var now=new Date(), z=zoned(now);
  if(z.key!==dayKey)compute();
  var h=z.h+z.mi/60+z.s/3600;
  var hh=z.h,mm=z.mi,ss=z.s;
  var t12=C.h24?((hh<10?"0":"")+hh):(((hh%12)||12));
  document.getElementById("clock").innerHTML=t12+":"+(mm<10?"0":"")+mm+"<small>:"+(ss<10?"0":"")+ss+(C.h24?"":(hh>=12?" PM":" AM"))+"</small>";
  var nextK=null,nextT=null;
  ORDER.forEach(function(k){
    if(k==="sunrise")return;
    var el=document.getElementById("pt-"+k);
    if(!el||shown[k]==null)return;
    el.classList.remove("now","past");
    if(shown[k]<h)el.classList.add("past");
    if(nextK===null&&shown[k]>h){nextK=k;nextT=shown[k];}
  });
  if(nextK===null){nextK="fajr";nextT=shown.fajr+24;}
  var cur=document.getElementById("pt-"+nextK);
  if(cur){cur.classList.remove("past");cur.classList.add("now")}
  if(nextT==null)return;
  var nextName=(JU&&isFri&&JU.rep&&nextK==="dhuhr")?(L.jumuah||"Jumu'ah"):(L[nextK]||nextK);
  var left=(nextT-h)*3600;var HH=Math.floor(left/3600),MM=Math.floor((left%3600)/60),SS=Math.floor(left%60);
  document.getElementById("next").innerHTML=(L.next||"Next")+": <b>"+nextName+"</b> "+(L.in_||"in")+' <span class="cd">'+(HH>0?HH+":":"")+(MM<10?"0":"")+MM+":"+(SS<10?"0":"")+SS+"</span>";
}
compute();tick();setInterval(tick,1000);
/* cursor discipline for TVs */
var mt;addEventListener("mousemove",function(){document.body.classList.add("mouse");clearTimeout(mt);mt=setTimeout(function(){document.body.classList.remove("mouse")},2500)});
addEventListener("dblclick",function(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(function(){})});
addEventListener("keydown",function(e){if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(function(){})}});
})();
</script>
</body>
</html>
