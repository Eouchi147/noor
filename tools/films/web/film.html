<!doctype html>
<meta charset="utf-8">
<title>NOOR · film stage</title>
<!-- The faces are the reels' own, not a second copy: one set of files, one
     set of licences, and a card and a film that are set in the same type. -->
<style>
  /* TWO SOURCES PER FACE, ON PURPOSE.
     This file lives in two layouts: the repo, where the faces sit in
     ../../reels/web, and the Mac render folder, where they sit in
     fonts/. It used to name only one of them, so copying the file from
     one to the other made every face fail with a NetworkError, which
     kills Stage() before a single frame is drawn and takes all eight
     workers with it. A font-face may list several sources and the
     browser takes the first that loads, so it now names both. */
  @font-face{font-family:'NoorCard';src:url(fonts/noor-card-regular.ttf) format('truetype'),url(../../reels/web/noor-card-regular.ttf) format('truetype');font-weight:400;font-display:block}
  @font-face{font-family:'NoorCard';src:url(fonts/noor-card-bold.ttf) format('truetype'),url(../../reels/web/noor-card-bold.ttf) format('truetype');font-weight:700;font-display:block}
  @font-face{font-family:'NoorMono';src:url(fonts/noor-mono.ttf) format('truetype'),url(../../reels/web/noor-mono.ttf) format('truetype');font-weight:400;font-display:block}
  @font-face{font-family:'Amiri';src:url(fonts/amiri-regular.ttf) format('truetype'),url(../../reels/web/amiri-regular.ttf) format('truetype');font-weight:400;font-display:block}
  @font-face{font-family:'Amiri';src:url(fonts/amiri-bold.ttf) format('truetype'),url(../../reels/web/amiri-bold.ttf) format('truetype');font-weight:700;font-display:block}
  @font-face{font-family:'AmiriQuran';src:url(fonts/amiri-quran.ttf) format('truetype'),url(../../reels/web/amiri-quran.ttf) format('truetype');font-weight:400;font-display:block}

  :root{
    --night:#04060F; --night2:#0A1024; --deep:#02030A;
    --gold:#C9A227; --goldhi:#E9C86A; --goldpale:#F4E2AE;
    --parch:#FFFEF7;
    --p86:rgba(255,254,247,.86); --p62:rgba(255,254,247,.62); --p38:rgba(255,254,247,.38);
    --line:rgba(233,200,106,.22);
  }
  /* ---- the five directions, as they reach the type --------------------
     The room, the light and the objects are themed in the shader (see
     THEMES in web/lume.js). The words are DOM, so they take their share
     here, off one attribute on <html>. Only the ink direction really moves:
     a lit page needs dark type on it, and everything else is a shift of
     warmth. */
  html[data-theme="ink"]{
    --parch:#241808; --gold:#7A5A1E; --goldhi:#4A3512;
    --p86:rgba(36,24,8,.90); --p62:rgba(36,24,8,.70); --p38:rgba(36,24,8,.46);
    --line:rgba(74,53,18,.34);
  }
  html[data-theme="orrery"]{ --gold:#B98A34; --goldhi:#E7BE72; --parch:#FBF3E0;
    --line:rgba(231,190,114,.24) }
  html[data-theme="girih"]{ --gold:#D9B23F; --goldhi:#F2D98A; --parch:#FFF7E4;
    --line:rgba(242,217,138,.30) }
  /* the flat vector language: night and void keep light type, the day mood
     is dark type on paper and everything in it has to follow */
  /* the same derived system reaching the type. Amber is the hero at every
     register; the type sits at the top of the lightness ladder on dark and
     at the bottom of it on paper. */
  html[data-theme="nutshell"], html[data-theme="nutvoid"]{
    --gold:#EFB229; --goldhi:#FBF4DA; --parch:#FBF4DA;
    --p86:rgba(251,244,218,.90); --p62:rgba(251,244,218,.68); --p38:rgba(251,244,218,.42);
    --line:rgba(239,178,41,.26);
  }
  html[data-theme="nutday"]{
    --parch:#3C2A13; --gold:#A15B00; --goldhi:#6E3E00;
    --p86:rgba(60,42,19,.92); --p62:rgba(60,42,19,.70); --p38:rgba(60,42,19,.44);
    --line:rgba(161,91,0,.34);
  }
  /* the page's own ink, not only the tokens: a light ground needs the body
     colour changed too or every element that never asked for a token stays
     the colour it was on black */
  html[data-theme="nutday"] body, html[data-theme="nutday"] #stage,
  html[data-theme="ink"] body, html[data-theme="ink"] #stage { color: #2B2016 }
  html[data-theme="relief"]{ --gold:#A99A80; --goldhi:#E4D8BE; --parch:#FFFCF5;
    --line:rgba(228,216,190,.20) }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--deep)}
  body{font-family:'NoorCard',system-ui,sans-serif;color:var(--parch);-webkit-font-smoothing:antialiased}

  #ground{position:fixed;inset:0;width:100%;height:100%;display:block;
    transform-origin:50% 50%;will-change:transform}
  /* THE LIGHT LAYER sits between the room and the words: the figures are
     objects in a space now, not drawings on a page. It carries its own
     camera -- a real dolly, not a scale -- so the near thing grows faster
     than the far one when the shot walks in. See web/lume.js. */
  #lume{position:fixed;inset:0;width:100%;height:100%;display:block;
    transform-origin:50% 50%;will-change:transform;pointer-events:none}
  /* THE VIGNETTE WAS A SQUARE.
     It was an <svg> with viewBox="0 0 100 100" and no width or height of its
     own. An SVG is a replaced element: given left and right by inset:0 it
     takes its WIDTH from them and then derives its height from the viewBox's
     1:1 ratio, ignoring top and bottom. So it came out 1920x1920 on the wide
     frame -- half of it hanging below the picture -- and 1080x1080 on the
     tall one, where it covered the top 1080 rows and stopped dead. That is
     the hard horizontal line across the middle of every 9:16 frame: not a
     seam in the render, a darkening that ended.
     A gradient does not need a document. */
  /* THE CUT ITSELF IS A THING YOU CAN SEE.
     Every beat used to leave by fading out over six hundred milliseconds
     while the next one faded in over five, with half a second of nothing in
     between -- so the film had no cuts in it at all, only dissolves, and a
     film with no cuts cannot be dynamic however well the individual beats are
     drawn. There are three ways out of a beat now: a dissolve, a straight
     cut, and a blaze of light across the join. This is the blaze. It is a
     screen-blended radial so it lifts the picture rather than covering it,
     which is what a light leak does and what a white rectangle does not. */
  #flare{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;
    background:radial-gradient(ellipse 90% 70% at 50% 52%,
      rgba(255,252,240,.95) 0%, rgba(244,212,106,.62) 34%, rgba(201,162,39,.16) 68%,
      rgba(0,0,0,0) 100%)}

  /* THE VIGNETTE IS IN THE SHADER NOW, for the reason written at the top of
     web/ground.js: a CSS radial gradient across a dark frame is a second
     eight bit gradient, dithered by the browser, laid over a first. Two
     weaves crossing is the interlacing. The element stays so nothing that
     looks it up breaks; it paints nothing. */
  #vig{display:none}

  /* THE CAMERA.
     A film that never moves is a slideshow with good typography. There are
     two planes and the camera moves them at different rates, which is what
     depth is: the ground answers a push with a fraction of it, so the figure
     comes toward you and the world stays where it is. Both are transforms,
     so they cost nothing to composite and mean the same thing in either
     frame shape. */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}
  #hold{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  /* THE TALL COMPOSITION.
     Centring the whole column looked right on paper and wrong on the frame:
     the picture floated in the middle, the words hung under it, and four
     hundred pixels of nothing sat below them at the bottom of the phone. A
     nine by sixteen frame is read in two parts. The picture takes the upper
     two thirds and is centred in that space; the words hold a band of fixed
     depth at the foot, and sit at the bottom of it, so the last line always
     lands the same distance from the edge of the screen however many lines
     there are above it. */
  /* A PLATE BEAT TAKES THE WHOLE COLUMN.
     .sky pads six per cent in on either side, which is right for a figure
     the film draws itself and wrong for a plate: the plate is already sized
     in pixels to the frame's own 1010, so a sixty pixel pad on each side
     shrank the element under the drawing and, because the box is clipped to
     give the breath an edge, sliced a label off both ends. It came out as
     "andle outside" on the left and "the image arriv" on the right. */
  .beat.has-plate .sky{padding-inline:0;flex:0 0 auto}
  /* AND IT IS COMPOSED AS ONE BLOCK.
     The normal beat pins its words a fixed distance off the bottom of the
     frame and lets the picture have everything above. On a plate that left
     four hundred pixels of nothing between the foot of the drawing and the
     first word, which reads as two unrelated things on one screen rather
     than a caption under a picture. The picture and its words are one block
     now, held together by a single gap and centred as a unit, and the air
     that is left over is shared between the top and the bottom of the frame
     instead of pooling in the middle of it. */
  .beat.has-plate{justify-content:center}
  /* ---- THE SAFE ZONE -------------------------------------------------
     A phone does not show all 1920 rows of this. Instagram lays its caption,
     its handle and its audio strip over the bottom 320; TikTok takes 250 at
     the bottom and 130 at the top; both put a column of buttons down the
     right. Anything that has to be READ lives between row 130 and row 1600,
     and the room under it is not wasted, it is where their interface goes.
     The block is shifted up so the picture sits high and the last line of
     type clears 1600 with room to spare. */
  html[data-frame="tall"] .beat.has-plate{padding-bottom:0;gap:70px;
    transform:translateY(24px)}
  /* the words hang from the TOP of their band rather than the bottom of it,
     so the first line is always the same distance under the picture whether
     the line runs to one row or to four. */
  .beat.has-plate .wordstack>div{top:0;bottom:auto}

  html[data-frame="wide"] #hold{width:1440px;height:860px;gap:56px}
  /* 1740 of the 1920 is the frame less a ninety pixel safe edge top and
     bottom, which is what every platform crops into on some surface or
     other. The column is the plate's own 1010 rather than the caption's 920,
     because the picture is the wider of the two and the words are centred
     inside it anyway. */
  html[data-frame="tall"] #hold{width:1010px;height:1740px;gap:58px}

  /* The figure is the film. It takes the room, and the words live under it. */
  .fig{position:relative;display:flex;align-items:center;justify-content:center;width:100%}
  html[data-frame="wide"] .fig{height:660px}
  html[data-frame="tall"] .fig{height:900px}
  .fig svg{overflow:visible;width:100%;height:100%}

  .words{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
  /* THE LINES CROSS IN ONE PLACE.
     On a plate short there is one sentence on screen at a time and the next
     one takes its place. Stacked in the normal flow they would push each
     other about as they overlap; laid one on top of another in a band of
     fixed height they cross cleanly, and the picture above never moves
     because the band never changes size. */
  .wordstack{position:relative;width:100%}
  /* deep enough for the largest thing that can be in it -- a three line hook
     at 78 with a subtitle under it -- so a long line never grows up out of
     the band and into the picture. NOTHING OVERLAPS TEXT is a standing rule
     here and this is where it is kept. */
  html[data-frame="tall"] .wordstack{min-height:410px}
  html[data-frame="wide"] .wordstack{min-height:210px}
  .wordstack>div{position:absolute;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;gap:.30em}
  html[data-frame="tall"] .words{gap:26px}
  .rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--goldhi),transparent);opacity:0}

  .eyebrow{font-family:'NoorMono',ui-monospace,monospace;text-transform:uppercase;color:var(--goldhi);opacity:.9}
  html[data-frame="wide"] .eyebrow{font-size:22px;letter-spacing:.34em}
  html[data-frame="tall"] .eyebrow{font-size:24px;letter-spacing:.30em}

  /* a chapter title is still a subtitle. It carries more weight than a line
     of prose and it sits in the same band, at the same left and right edge,
     so the eye never has to go looking for where the words are this time. */
  .h1{font-weight:700;line-height:1.1;letter-spacing:-.012em;text-wrap:balance;
     text-shadow:0 2px 28px rgba(0,0,0,.65)}
  html[data-frame="wide"] .h1{font-size:58px;max-width:26ch}
  html[data-frame="tall"] .h1{font-size:52px;max-width:16ch}

  /* ---- THE HOOK -------------------------------------------------------
     THE FIRST SECOND IS THE WHOLE NEGOTIATION.
     On a feed nobody has agreed to watch anything. They are moving, and a
     short has about one second to give them a reason to stop, which means
     the opening line is not a title, it is a claim, and it has to be the
     largest thing that will ever be on the screen.

     52px on a 1080 frame is under five per cent of the width, which is a
     caption. A hook is set at seven and a half, and its measure is pulled in
     to eleven characters so it breaks into two or three short lines and
     stacks rather than running as a strip. Slightly tighter tracking,
     because large type set at caption tracking looks loose. */
  .hook{font-weight:700;line-height:1.04;letter-spacing:-.022em;text-wrap:balance;
     text-shadow:0 2px 34px rgba(0,0,0,.72)}
  html[data-frame="wide"] .hook{font-size:84px;max-width:21ch}
  html[data-frame="tall"] .hook{font-size:78px;max-width:14ch}

  .h2{font-weight:700;line-height:1.14;letter-spacing:-.008em;text-wrap:balance;
     text-shadow:0 2px 28px rgba(0,0,0,.65)}
  html[data-frame="wide"] .h2{font-size:50px;max-width:34ch}
  html[data-frame="tall"] .h2{font-size:44px;max-width:20ch}

  /* A CAPTION IS NOT A COLUMN OF PROSE.
     Twenty-four characters is a measure for a paragraph in a magazine, and
     at forty-two pixels on a 1920 frame it broke every sentence in the film
     into four ragged lines. A film caption wants to be ONE line, or two with
     the break where the sentence breathes: wider measure, bigger type. */
  /* the subtitle itself. One size, one measure, one place, for the whole
     film. A shadow rather than a glow: it has to stay readable over a bright
     diagram as well as over black, and a glow on white type over gold is a
     smear. */
  .body{color:var(--parch);line-height:1.3;max-width:40ch;text-wrap:balance;
    text-shadow:0 2px 22px rgba(0,0,0,.72),0 0 4px rgba(0,0,0,.4)}
  html[data-frame="wide"] .body{font-size:44px;max-width:40ch}
  html[data-frame="tall"] .body{font-size:40px;max-width:22ch}
  .body.sm{color:var(--p62)}
  html[data-frame="wide"] .body.sm{font-size:32px;max-width:22ch}
  html[data-frame="tall"] .body.sm{font-size:33px;max-width:16ch}

  /* The Arabic is set in three sizes, each a class of its own. An em on top
     of a class that already declares a font-size is measured against the
     PARENT, not the class, which is how the derived word came out at eleven
     pixels the first time this was drawn. */
  .ar{font-family:'Amiri',serif;direction:rtl;color:var(--goldpale);line-height:1.45;
     text-shadow:0 0 46px rgba(233,200,106,.34),0 0 12px rgba(233,200,106,.18)}
  html[data-frame="wide"] .ar-xl{font-size:168px;letter-spacing:.02em}
  html[data-frame="tall"] .ar-xl{font-size:140px;letter-spacing:.02em}
  html[data-frame="wide"] .ar-lg{font-size:104px}
  html[data-frame="tall"] .ar-lg{font-size:96px}
  html[data-frame="wide"] .ar-md{font-size:64px}
  html[data-frame="tall"] .ar-md{font-size:62px}
  .quran{font-family:'AmiriQuran','Amiri',serif;direction:rtl;color:var(--parch);line-height:1.95;
     text-shadow:0 0 52px rgba(233,200,106,.30),0 0 14px rgba(255,254,247,.14)}
  html[data-frame="wide"] .quran{font-size:104px}
  html[data-frame="tall"] .quran{font-size:76px}

  /* ---- THE PLATES ------------------------------------------------------
     The figure styles from noorcodex.com, carried over unchanged in
     everything that decides how a plate reads: the same stroke weights, the
     same three text sizes, the same gold. Two things are different, and both
     are because this is a 1080 by 1920 film frame and not a page.

     The type is set from the viewBox rather than in pixels, because a plate
     drawn in a 660 unit box and shown 1080 wide is being enlarged by 1.6 and
     its 20 unit labels arrive at 33 pixels, which is right. And the stroke
     alphas are lifted a little, because the film's ground is darker than the
     card the figures sit on, and the grade and the vignette take a further
     bite out of a thin line. */
  /* THE PLATE TAKES THE FRAME, NOT THE COLUMN, AND ITS BOX IS THE SHAPE OF
     THE DRAWING.
     The text column is 920 of 1080 wide, which is right for a caption and
     wrong for a picture. The plate breaks out to 1010, the frame less a
     thumb's width either side.
     It used to be given a FIXED 1010 by 1390 box whatever was in it, because
     a camera was travelling inside that box. It is not any more, and a fixed
     box was the reason a figure half as tall as it is wide sat in a hole two
     and a half times too deep with the frame empty above the words. The box
     is sized in web/plate.js, from the artwork's own proportions at the
     enlargement its labels need, and set on the element in pixels -- so this
     rule declares no size at all. See THE BOX there. */
  .plate{position:relative;display:flex;align-items:center;justify-content:center;
    width:100%}
  .plate svg{display:block;overflow:hidden;max-width:100%}
  .figsvg{display:block;overflow:visible}
  .figsvg .ln,.figsvg .rd,.figsvg .strike{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .figsvg .ln{stroke:rgba(255,254,247,.72);stroke-width:2.4}
  .figsvg .rd{stroke:#F4D46A;stroke-width:3.4}
  .figsvg .thin{stroke:rgba(255,254,247,.40);stroke-width:1.6}
  .figsvg .strike{stroke:rgba(226,138,128,.90);stroke-width:2.6}
  .figsvg .nd{fill:#F4D46A;stroke:none}
  .figsvg .flame{fill:#F4D46A;stroke:none}
  .figsvg .halo,.figsvg .halo2{fill:rgba(244,212,106,.16);stroke:none}
  .figsvg .wait{fill:none;stroke:rgba(244,212,106,.5);stroke-width:1.2}
  .figsvg text{text-anchor:middle;font-family:'NoorCard',system-ui,sans-serif}
  .figsvg .ts{text-anchor:start}
  .figsvg .te{text-anchor:end}
  .figsvg .t1{font-size:34px;font-weight:700;fill:#FFFEF7}
  .figsvg .t2{font-size:26px;fill:rgba(255,254,247,.82)}
  .figsvg .t3{font-size:22px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;fill:rgba(244,212,106,.90)}
  .figsvg .t4{font-size:22px;fill:rgba(255,254,247,.74)}
  .figsvg .big{font-size:34px}
  .figsvg .gold{fill:#F4D46A}

  .src{font-family:'NoorMono',ui-monospace,monospace;color:rgba(233,200,106,.60);text-transform:uppercase}
  /* THE SOURCE LINE IS A FEATURE OF THIS FILM, NOT AN APOLOGY.
     Every claim in it is carried back to where it came from, and a viewer who
     wants to check should be able to read the reference without pausing. It
     stays quiet -- it is not the sentence -- but it is legible. */
  html[data-frame="wide"] .src{font-size:25px;letter-spacing:.17em}
  html[data-frame="tall"] .src{font-size:25px;letter-spacing:.15em}

  .gloss{font-family:'NoorMono',ui-monospace,monospace;color:var(--p62);text-transform:uppercase}
  html[data-frame="wide"] .gloss{font-size:22px;letter-spacing:.2em}
  html[data-frame="tall"] .gloss{font-size:24px;letter-spacing:.18em}

  /* WHEN THE LIGHT LAYER HAS AN OBJECT ON SCREEN, THE WORDS GET OUT OF ITS WAY.
     Both layers were centred, so a sentence landed across the middle of the
     figure it was describing and neither could be read. The type moves to the
     lower band and the object keeps the frame -- which is also the right
     hierarchy: the film is the animation, and the line under it is a caption
     on the thing you are already looking at. A beat can ask for the old
     behaviour with "place": "over", which is what a title wants. */
  /* =========================================================================
     EVERY WORD IS EITHER A SUBTITLE OR A LEGEND.

     The film is the picture. Type set across the middle of the frame is not a
     film, it is a slide with something moving behind it, and the first cut of
     this was full of them: ninety six pixel titles and seventy four pixel
     statements sitting in the centre of the screen with a diagram pushed up
     out of the way to make room. That is the wrong way round. If the visuals
     are good the words get read; if the words are in the way, neither gets
     looked at properly.

     So there are exactly two places a word may appear. A SUBTITLE, in a band
     at the bottom, always the same size and always the same place, the way a
     subtitle behaves in any film ever made. Or a LEGEND, drawn on the diagram
     itself as part of the picture, which lives in web/diagrams.js and not
     here. Nothing else.

     The one thing that is set large is the Qur'anic line, and that is not an
     exception: the verse IS the subject of its beat, so it is the picture,
     and its translation is the subtitle underneath it like any other.
     ========================================================================= */
  .beat{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;gap:0;opacity:0}
  html[data-frame="wide"] .beat{padding-bottom:92px}
  html[data-frame="tall"] .beat{padding-bottom:226px}
  /* the picture area: everything above the band, where a figure lives and
     where the verse is set. It takes the room and nothing crowds it. */
  .sky{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    width:100%;min-height:0;padding-inline:6%}
  /* SPECIFICITY. Three classes (0,3,0) beat the tall-frame rule's one
     attribute plus one class (0,2,1), so on 9:16 this did not narrow the
     caption from 40ch to 38ch as intended -- it WIDENED it from 22ch to
     38ch, edge to edge of the layout box, on every figure-covered beat.
     37 of 45 beats of film two. Each frame now states its own number. */
  html[data-frame="wide"] .beat.has-lume .body{max-width:38ch}
  html[data-frame="tall"] .beat.has-lume .body{max-width:21ch}

  /* the list: a column of rows, each one a thing and its name, with a rule
     under it. The Arabic sits on the right because it is read from there. */
  .listbox{display:flex;flex-direction:column;width:100%;align-items:stretch}
  .listrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
    gap:1.6em;padding-block:.82em;border-bottom:1px solid rgba(233,200,106,.22);opacity:0}
  .listrow:last-child{border-bottom:0}
  .listmid{display:flex;flex-direction:column;align-items:flex-start;gap:.14em;text-align:left}
  /* THE LINE HAS TO BE ALLOWED TO BE A LINE.
     .body.sm carries a twenty-two character measure, which is right for a
     caption under a figure and wrong inside a row of a list: it broke every
     one of the five into three ragged lines against a column of empty space.
     Inside a list the measure is the column. */
  html[data-frame="wide"] .listmid .body.sm{max-width:none;font-size:37px;text-align:left}
  html[data-frame="tall"] .listmid .body.sm{max-width:none;font-size:31px;text-align:left}
  .listrow .ar{min-width:4.6em;text-align:center}
  html[data-frame="wide"] .listrow .ar-md{font-size:70px}
  html[data-frame="tall"] .listrow .ar-md{font-size:52px}
  html[data-frame="wide"] .listbox{max-width:1330px;margin-inline:auto}
  html[data-frame="tall"] .listbox{max-width:860px;margin-inline:auto}
  html[data-frame="tall"] .listrow{gap:.9em;padding-block:.6em}

    .g{color:var(--goldhi)}
  .tok{display:inline-block;white-space:pre}
  .lt{display:inline-block}

  /* ---- THE WATERMARK -----------------------------------------------------
     A SCENE FILM STANDS ALONE, SO IT CARRIES ITS OWN MARK.
     Every other film in this house is a corridor of many figures, ending on
     a card the reels tools stamp once; a scene like darkroom is a single
     continuous shot with no such card, so the mark has to be on screen for
     the whole thing. It is DOM, not a WebGL plane, so it renders into every
     frame noor.py takes with no post step and no risk of the bloom or the
     depth of field touching it -- and it never animates, because the one
     thing worse than no mark is one that draws attention to itself.
     Hidden by default; stage.js sets data-mark="1" on <html> for anything
     that stands alone, a scene or a plate short (see THE MARK SHOWS ON
     ANYTHING THAT STANDS ALONE in stage.js, round seven for the short).
     Position mirrors the safe margins named in the darkroom spec's own
     watermark.safe: 60px
     of side margin on both frame shapes, 320px off the bottom of the tall
     frame (TikTok's own caption and audio strip live there) and 48px off
     the bottom of the wide one, which has no such strip to clear. */
  #mark{position:fixed;left:60px;display:none;align-items:center;gap:12px;
    pointer-events:none;z-index:5}
  html[data-mark="1"] #mark{display:flex}
  html[data-frame="tall"] #mark{bottom:320px}
  html[data-frame="wide"] #mark{bottom:48px}
  /* THE MARK NEEDS ITS OWN CLEARANCE, NOT JUST THE GENERIC SAFE ZONE
     (round four). .beat's own padding-bottom (226 tall, 92 wide) reserves
     the generic platform safe zone, not the mark's -- and the mark sits
     lower, at 320 on the tall frame. A beat with enough lines in it (s10
     alone carries an eyebrow, a headline, a sub AND a src) grew tall
     enough, anchored to that shallower padding, that its last line landed
     inside the mark's own row: "THE BOOK OF OPTICS, ABOUT 1020" sitting on
     top of "noorcodex.com". Raised only while data-mark is set, so every
     other film's captions keep the padding tuned for them. */
  html[data-mark="1"][data-frame="tall"] .beat{padding-bottom:360px}
  html[data-mark="1"][data-frame="wide"] .beat{padding-bottom:130px}
  .mark-badge{width:40px;height:40px;display:block;flex:0 0 auto}
  .mark-text{font-family:'NoorMono',ui-monospace,monospace;font-size:20px;
    letter-spacing:.06em;color:rgba(255,254,247,.78)}
</style>
