<!doctype html><html><head><meta charset="utf-8">
<title>NOOR reel type layer</title>
<style>
/* NOOR reel · the type layer, v2.
   One idea on the screen at a time, centred in the safe rectangle, in three
   colours: the site's night behind (drawn by the shader), parchment for what
   is read, gold for what is named. No stat grid, no build number, no ticks,
   no eyebrow, no end card asking for anything. The type is the picture. */
@font-face{font-family:NoorB;src:url(noor-card-bold.ttf) format("truetype");font-weight:700;font-display:block}
@font-face{font-family:NoorR;src:url(noor-card-regular.ttf) format("truetype");font-weight:400;font-display:block}
@font-face{font-family:NoorM;src:url(noor-mono.ttf) format("truetype");font-weight:400;font-display:block}
/* Amiri, by Khaled Hosny, SIL Open Font License (amiri-OFL.txt): the Arabic
   the site sets its dictionary in, and the Quran cut it sets the Mushaf in */
@font-face{font-family:Amiri;src:url(amiri-regular.ttf) format("truetype");font-weight:400;font-display:block}
@font-face{font-family:Amiri;src:url(amiri-bold.ttf) format("truetype");font-weight:700;font-display:block}
@font-face{font-family:AmiriQuran;src:url(amiri-quran.ttf) format("truetype");font-weight:400;font-display:block}
:root{
  /* the site's own tokens: index.html :root and tailwind.config.cjs */
  --night:#04060F; --gold:#C9A227; --goldhi:#E9C86A; --parch:#FFFEF7;
  --parch-2:rgba(255,254,247,.86); --parch-3:rgba(255,254,247,.62);
  --safeT:270px; --safeB:1500px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--night);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
body.type-only{background:transparent} body.type-only #gl{display:none}
/* the audit measures the words; a glow is light, not information, so every
   glowing thing is put out before the ink is measured */
body.type-only .key,body.type-only .ar,body.type-only .quran,
body.type-only .smallar{text-shadow:none!important}

#stage{position:absolute;inset:0}

/* one screen: one idea. They stand in the same place and take turns; JS puts
   each one's top so that it is centred in the safe rectangle. */
.screen{position:absolute;left:146px;width:788px;display:flow-root;text-align:center}
.screen>*{opacity:0;--b:0px;filter:blur(var(--b));will-change:opacity,transform,filter}

/* what is read */
.hook{font-family:NoorB,sans-serif;font-weight:700;color:var(--parch);letter-spacing:-.006em}
.hook .w{display:inline-block;opacity:0;--b:0px;filter:blur(var(--b));will-change:opacity,transform,filter}
.hook .w.key{color:var(--goldhi);--g:0;
  text-shadow:0 0 calc(var(--g)*34px) rgba(233,200,106,calc(var(--g)*.55)),
              0 0 calc(var(--g)*12px) rgba(233,200,106,calc(var(--g)*.45))}
/* a line of substance is the whole reason a stranger stopped: it is set large
   and at full brightness, and the one number or name it turns on is gold */
.line{font-family:NoorR,sans-serif;color:var(--parch)}
.line .g{color:var(--goldhi)}
.date{font-family:NoorR,sans-serif;color:var(--goldhi);letter-spacing:.15em;text-transform:uppercase}
.num{font-family:NoorB,sans-serif;font-weight:700;color:var(--goldhi);letter-spacing:-.03em;line-height:.9}
.month{font-family:NoorB,sans-serif;font-weight:700;color:var(--parch);letter-spacing:.2em;text-transform:uppercase}
.monthar{font-family:Amiri,serif;color:var(--parch-3);direction:rtl}
.todo{font-family:NoorB,sans-serif;font-weight:700;color:var(--goldhi)}

/* the Arabic: a word, a name, a du'a */
.ar{font-family:Amiri,serif;font-weight:700;color:var(--goldhi);direction:rtl;--g:1;
  text-shadow:0 0 calc(var(--g)*46px) rgba(233,200,106,calc(var(--g)*.30))}
.translit{font-family:NoorB,sans-serif;font-weight:700;color:var(--parch);letter-spacing:.22em;text-transform:uppercase}
.translit .w{display:inline-block;opacity:0;white-space:pre}
.meaning{font-family:NoorR,sans-serif;color:var(--parch-2)}
.sentence{font-family:NoorR,sans-serif;color:var(--parch-2)}

/* One verse */
/* the Qur'an breathes: --g is the reciter's own loudness, set frame by frame */
.quran{font-family:AmiriQuran,Amiri,serif;color:var(--parch);direction:rtl;--g:0;
  text-shadow:0 0 calc(24px + var(--g)*44px) rgba(233,200,106,calc(.09 + var(--g)*.30))}
.ref{font-family:NoorM,ui-monospace,monospace;color:var(--goldhi);letter-spacing:.2em}
.trans{position:relative}
.trans .s{position:absolute;left:0;right:0;top:0;font-family:NoorR,sans-serif;color:var(--parch-2);
  opacity:0;--b:0px;filter:blur(var(--b));will-change:opacity,transform,filter}
.credit{font-family:NoorR,sans-serif;color:var(--parch-3);letter-spacing:.04em}

/* the way out: the idea again, small, and where it came from */
.smallhook{font-family:NoorB,sans-serif;font-weight:700;color:var(--parch-2)}
.smallar{font-family:Amiri,serif;font-weight:700;color:var(--goldhi);direction:rtl}
.site{font-family:NoorM,ui-monospace,monospace;color:var(--goldhi);letter-spacing:.22em}
</style></head>
<body>
<canvas id="gl"></canvas>
<div id="stage"></div>
<script src="anime.min.js"></script>
<script src="scene.js"></script>
<script src="type.js"></script>
</body></html>
